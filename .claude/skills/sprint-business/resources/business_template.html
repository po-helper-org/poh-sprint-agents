<!DOCTYPE html>
<html lang="ru">
<head>
<!--#include shared/head.html-->
<title>ФАКТ | спринт</title>
<style>
/*#include shared/core.css*/
  /* ===================== Презентация «ФАКТ | спринт» =====================
     Второй отчёт из тех же данных — по эталону отчётной колоды спринта PO:
     лента белых слайдов 1280×720 (720 — минимум: стрим на восемь строк живёт на
     одном слайде, слайд растёт под него), Arial, серые рамки, строка таблицы
     красится светофором по результату. Поверх эталона — только механика: оглавление
     слева, правка кликом по строке; в печати её нет — колода выглядит как эталон. */
  .deck {
    --gray-border: #9E9E9E; --gray-dark: #595959;
    --green-fill: #D9EAD3; --green-pill: #B6D7A8;
    --yellow-fill: #FFF2CC; --yellow-pill: #FFE599;
    --red-fill: #FDE9E9; --red-pill: #F4CCCC;
    position: fixed; inset: 0; z-index: 40; background: #e9e9e9; display: flex; flex-direction: column;
    font-family: Arial, "Helvetica Neue", sans-serif; color: #111;
  }
  .deck[hidden] { display: none; }
  .deck-bar {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0; background: #fff; border-bottom: 1px solid #d6d6d6;
    padding: calc(8px + env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left));
    font-size: 13px;
  }
  .deck-bar .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .deck-bar .grow { flex: 1; }
  .deck-bar button {
    font: inherit; font-size: 12px; color: #111; background: #fff; border: 1px solid #111;
    padding: 5px 11px; cursor: pointer; white-space: nowrap;
  }
  .deck-bar button.dark { background: #111; color: #fff; }
  .deck-feed { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; scroll-behavior: smooth; }
  .deck-slides { display: flex; flex-direction: column; align-items: center; gap: 28px; padding: 28px 0 80px; }

  .fslide {
    width: 1280px; min-height: 720px; background: #fff; position: relative; flex-shrink: 0;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); padding: 36px 48px 40px; scroll-margin-top: 16px;
  }
  .fslide .slide-num { position: absolute; bottom: 14px; right: 20px; font-size: 11px; color: #999; }
  .fslide h1.slide-title { font-size: 30px; font-weight: 400; margin: 0 0 4px; color: #111; }
  .fslide .slide-sub { font-size: 14px; color: #666; margin: 0 0 18px; }
  .fslide .slide-sub [title] { border-bottom: 1px dotted #aaa; cursor: help; }

  table.rep { width: 100%; border-collapse: collapse; margin-top: 8px; table-layout: fixed; }
  table.rep col.c1 { width: 26%; } table.rep col.c2 { width: 58%; } table.rep col.c3 { width: 16%; }
  table.rep th { font-size: 13px; font-weight: 700; text-align: center; border: 1px solid var(--gray-border); padding: 8px 10px; background: #fff; }
  table.rep td { font-size: 12.5px; line-height: 1.45; vertical-align: top; border: 1px solid var(--gray-border); padding: 10px 12px; }
  table.rep td.task { font-weight: 600; }
  table.rep td.task .role { display: block; font-weight: 400; font-size: 11px; color: var(--gray-dark); }
  table.rep td.result { white-space: nowrap; font-weight: 700; }
  table.rep td.result span { border-bottom: 1px dotted #999; cursor: help; }
  /* статус красит строку целиком: слайд читается светофором сверху вниз */
  table.rep tr.stat-green td { background: var(--green-fill); }
  table.rep tr.stat-yellow td { background: var(--yellow-fill); }
  table.rep tr.stat-red td { background: var(--red-fill); }
  table.rep tr.row { cursor: pointer; }
  table.rep tr.row:hover td { box-shadow: inset 0 0 0 9999px rgba(0,0,0,.03); }
  table.rep tr.commented td:first-child { box-shadow: inset 3px 0 0 #1a7a1a; }
  table.rep tr.grp td { background: #f3f3f3; font-size: 12.5px; padding: 7px 12px; color: #333; }
  table.rep tr.grp.kr { cursor: pointer; }
  table.rep tr.grp.kr:hover b { text-decoration: underline; text-underline-offset: 3px; }
  table.rep .kr-open { float: right; color: #888; font-size: 16px; line-height: 1; }
  table.rep .blk { margin-top: 4px; }
  /* строка = направление: метки «в блоке» / «не закрыто», результат с полосой историй */
  table.rep.epics col.c1 { width: 27%; } table.rep.epics col.c2 { width: 57%; } table.rep.epics col.c3 { width: 16%; }
  table.rep.epics td { font-size: 13px; }
  table.rep.epics td.task b { font-size: 14px; }
  table.rep.epics td.task .role { margin-top: 4px; }
  table.rep tr.has-blk td:first-child { box-shadow: inset 4px 0 0 var(--c-blocked); }
  table.rep .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 5px; }
  table.rep .tag { font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
  table.rep .t-blk { background: #fee2e2; color: #b91c1c; border: 1px solid #fca5a5; }
  table.rep .t-behind { background: #fef3c7; color: #92400e; border: 1px solid #fcd34d; }
  table.rep .blk { color: #991b1b; }
  /* итог строки: метаданные, текст, «Дальше», «Блокер» — один кегль, подписи серым */
  table.rep.epics td.sum > div + div { margin-top: 4px; }
  table.rep .ln-meta { font-size: 11.5px; color: #777; }
  table.rep .ln, .kr-detail .ln { color: #222; }
  .lbl { display: inline-block; min-width: 58px; margin-right: 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: #888; }
  .ln-blk .lbl { color: #b91c1c; }
  /* сайдбар KR: два столбца */
  .panel-stack.wide { width: min(1240px, 96vw); }
  .kr2 { display: grid; grid-template-columns: 340px minmax(0, 1fr); gap: 18px; align-items: start; }
  .kr-list { position: sticky; top: 0; max-height: calc(100vh - 210px); overflow-y: auto; padding-right: 4px; }
  .kl-head { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #888; margin: 10px 0 4px; }
  .kl-group:first-child .kl-head { margin-top: 0; }
  .b-blocked .kl-head { color: #b91c1c; }
  .kl-item { display: flex; flex-direction: column; gap: 2px; width: 100%; text-align: left; font: inherit; background: var(--bg); border: 1px solid var(--line);
             border-left: 3px solid #ccc; border-radius: 6px; padding: 6px 8px; margin-bottom: 4px; cursor: pointer; color: var(--fg); }
  .kl-item.stat-green { border-left-color: #16a34a; } .kl-item.stat-yellow { border-left-color: #eab308; } .kl-item.stat-red { border-left-color: #dc2626; }
  .kl-item:hover { background: #fafafa; } .kl-item.on { background: #f2f4f7; border-color: #9ca3af; }
  .kl-title { font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .kl-meta { font-size: 11.5px; color: var(--muted); display: flex; gap: 4px; } .kl-meta b { margin-left: auto; color: var(--fg); font-weight: 600; }
  .kd-title { font-size: 16px; font-weight: 600; line-height: 1.35; } .kd-meta { font-size: 12px; color: var(--muted); margin: 3px 0 10px; }
  .kd-text { font-size: 13.5px; line-height: 1.5; margin-bottom: 4px; } .kr-detail .ln { font-size: 13px; margin-top: 3px; }
  .kd-act { margin-top: 14px; }
  @media (max-width: 900px) { .kr2 { grid-template-columns: 1fr; } .kr-list { position: static; max-height: none; } }
  /* участник: блоки «история + подзадачи», «вне спринта» */
  .mkpis { grid-template-columns: repeat(6, 1fr); }
  .sbs { display: flex; gap: 2px; min-width: 0; align-items: flex-start; }
  .sb { display: flex; flex-direction: column; gap: 2px; min-width: 4px; cursor: pointer; }
  .sb .sb-st { display: block; height: 11px; border-radius: 2px; }
  .sb.other .sb-st { opacity: .35; }
  .sb-subs { display: flex; gap: 1px; height: 6px; } .sb-subs i { flex: 1; border-radius: 1px; }
  .sb:hover .sb-st { box-shadow: 0 0 0 1px #111; }
  table.rep td.result .res-po { font-size: 10.5px; font-weight: 400; color: #777; }
  table.rep td.result .res-sub { font-size: 11.5px; font-weight: 400; color: #555; margin-top: 3px; }
  table.rep td.result .res-bar { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin-top: 6px; background: #eee; cursor: help; }
  table.rep td.result .res-bar i { display: block; height: 100%; border-right: 1px solid #fff; }
  table.rep td.result .res-bar i:last-child { border-right: 0; }
  /* «Сроки»: «Заблокировано» кликабельно — разбор */
  .tis-click { cursor: pointer; border-radius: 6px; }
  .tis-click:hover { background: #fdf2f2; box-shadow: 0 0 0 6px #fdf2f2; }
  .tis-h small { text-transform: none; letter-spacing: 0; color: #aaa; }
  /* блокаторы в «Результате» */
  table.rep .blk-badge { display: inline-block; margin-top: 7px; font: inherit; font-size: 11.5px; font-weight: 700; color: #b91c1c;
                         background: #fee2e2; border: 1px solid #fca5a5; border-radius: 999px; padding: 2px 9px; cursor: pointer; white-space: nowrap; }
  table.rep .blk-badge:hover { background: #fecaca; }
  /* ключ задачи: меню JIRA / JIRA-native */
  .klink { border-bottom: 1px dotted currentColor; cursor: pointer; }
  .kmenu { position: fixed; z-index: 70; background: #fff; border: 1px solid #d0d0d0; border-radius: 8px; box-shadow: 0 6px 22px rgba(0,0,0,.16);
           padding: 6px; min-width: 210px; font: 13px/1.3 Arial, sans-serif; }
  .kmenu[hidden] { display: none; }
  .kmenu .km-key { font-size: 11px; color: #888; padding: 2px 8px 4px; }
  .kmenu a, .kmenu .km-off { display: block; padding: 6px 8px; border-radius: 5px; color: #111; text-decoration: none; }
  .kmenu a:hover { background: #f2f2f2; }
  .kmenu .km-off { color: #aaa; }
  /* «← Назад» в шапке сайдбара */
  .panel-back { font: inherit; font-size: 12px; background: none; border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px;
                color: var(--muted); cursor: pointer; margin: 0 0 8px; }
  .panel-back:hover { color: var(--fg); border-color: var(--fg); }
  .panel-back[hidden] { display: none; }
  /* карточка блокера / эпизода блокировки */
  .bl-card { border: 1px solid var(--line); border-left: 4px solid #f59e0b; border-radius: 6px; padding: 9px 11px; margin-bottom: 9px; }
  .bl-card.now { border-left-color: #dc2626; }
  .bl-why { font-size: 12.5px; color: #991b1b; margin: 4px 0; }
  .bl-who { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: #333; }
  .bl-com { margin-top: 6px; font-size: 12px; line-height: 1.45; color: #333; border-left: 2px solid #eee; padding-left: 8px; }
  .bl-com span { color: var(--muted); }
  .bl-com.empty { color: var(--muted); font-style: italic; }
  .bl-open { margin-top: 6px; font: inherit; font-size: 12px; background: none; border: 0; color: #2563eb; cursor: pointer; padding: 0; }
  /* расшифровка сгорания и планы списком */
  .burn-how { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0 0 10px; }
  table.burn-tab tr.wk td { color: #aaa; } table.burn-tab tr.fut td { color: #ccc; }
  .burn-list { font-size: 12.5px; line-height: 1.6; margin-bottom: 8px; }
  .burn-list small { color: var(--muted); }
  table.plan-tab td { vertical-align: top; text-align: left !important; }
  table.plan-tab td.pk { white-space: nowrap; width: 86px; font-size: 12px; }
  table.plan-tab .pt { font-size: 13px; } table.plan-tab .px { font-size: 12px; color: var(--muted); margin-top: 2px; }
  table.plan-tab td.pm { font-size: 11.5px; color: var(--muted); width: 120px; }
  .pc-head[data-plancol] { cursor: pointer; } .pc-head[data-plancol]:hover b { text-decoration: underline; text-underline-offset: 3px; }
  /* задачи вне доски */
  .of-h, .of-c { font-size: 12px; line-height: 1.45; } .of-c span, .of-h { color: var(--muted); } .of-h b { color: var(--fg); }
  /* сайдбар направления: фильтр по статусам, активность — тут же */
  .es-filter { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .es-chip { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); cursor: pointer; }
  .es-chip.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .es-chip.b-blocked { border-color: #fca5a5; } .es-chip.b-done { border-color: #86efac; }
  .es-row.open { background: #fcfcfc; }
  .es-head { cursor: pointer; }
  .es-detail { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; cursor: default; }
  /* сайдбар направления: истории спринта */
  .es-row { border: 1px solid var(--line); border-left: 4px solid #ccc; border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .es-head:hover .es-title { text-decoration: underline; text-underline-offset: 3px; }
  .es-row.stat-green { border-left-color: #16a34a; } .es-row.stat-yellow { border-left-color: #eab308; } .es-row.stat-red { border-left-color: #dc2626; }
  .es-top { display: flex; justify-content: space-between; gap: 10px; font-weight: 600; font-size: 13.5px; }
  .es-pct { white-space: nowrap; }
  .es-meta { font-size: 11.5px; color: var(--muted); margin: 2px 0 4px; }
  .es-text { font-size: 12.5px; line-height: 1.45; }
  .es-blk { color: #991b1b; }
  table.rep .next .ed, table.rep .blk .ed { font-weight: 400; }
  table.rep td > div.ed { font-weight: 400; }
  .fslide .outliers { display: none; }
  .risk-team { font-weight: 400; color: #666; }
  /* режим «Редактировать текст»: всё, что можно править, — с пунктиром */
  .deck.editing .ed { outline: 1px dashed #b9b9b9; outline-offset: 2px; cursor: text; border-radius: 2px; }
  .deck.editing .ed:focus { outline: 2px solid #1a7a1a; background: #fff; }
  .deck.editing .ed.edited { background: #fffbe6; }
  .deck.editing tr.row, .deck.editing tr.grp.kr { cursor: text; }
  .deck-bar button[aria-pressed="true"] { background: #1a7a1a; border-color: #1a7a1a; color: #fff; }
  /* операционный отчёт */
  .ops2 { display: grid; grid-template-columns: 470px 1fr; gap: 24px; margin-top: 10px; }
  .ops-h { font-size: 13px; font-weight: 700; color: #222; margin: 0 0 2px; }
  .ops-h small { font-weight: 400; color: #888; }
  .ops-chart { margin-bottom: 10px; }
  .ops-chart .chart { width: 100%; height: auto; display: block; }
  .ops-chart .chart-legend { display: none; }
  .ops-empty { font-size: 12px; color: #999; padding: 40px 0; text-align: center; border: 1px dashed #ddd; }
  .ops-legend { font-size: 11px; color: #666; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; margin-top: 2px; }
  .ops-legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  .ops-legend .l-avg { width: 16px; height: 0; border-top: 2px dashed #111; border-radius: 0; }
  table.vtab { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.vtab th, table.vtab td { border: 1px solid var(--gray-border); padding: 8px 10px; text-align: right; }
  table.vtab th:first-child, table.vtab td:first-child { text-align: left; }
  table.vtab th { background: #f3f3f3; font-weight: 700; }
  /* сайдбары поверх колоды: KR и активность истории */
  body.deck-open .overlay { z-index: 41; }
  body.deck-open .panel-stack { z-index: 42; }
  .side-tabs { display: flex; gap: 6px; margin: 0 0 12px; flex-wrap: wrap; }
  .side-tab { font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--line); background: var(--bg);
              color: var(--muted); border-radius: 999px; cursor: pointer; }
  .side-tab.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }
  table.rep ul { margin: 0; padding-left: 16px; }
  table.rep li { margin-bottom: 3px; }
  table.rep .next { margin-top: 6px; font-weight: 700; }
  table.rep .next-item { font-weight: 400; }
  .fslide .sort-note { font-size: 11px; color: #888; margin: 6px 0 0; font-style: italic; }
  .fslide .ai-note { font-size: 11px; color: #888; margin: 4px 0 0; }

  /* титул: что за отчёт, ход спринта, карточки команд */
  .title-slide { display: flex; flex-direction: column; padding: 56px 72px 40px; }
  .t-head { display: flex; justify-content: space-between; align-items: center; }
  .t-kicker { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #777; }
  .t-status { font-size: 13px; padding: 6px 14px; border-radius: 999px; border: 1px solid #ccc; color: #444; }
  .t-status.on { border-color: #16a34a; color: #15803d; background: #f0fdf4; }
  .title-slide h1 { font-size: 64px; font-weight: 700; letter-spacing: -.02em; margin: 26px 0 6px; line-height: 1.05; }
  .t-period { font-size: 20px; color: #555; }
  .t-days { height: 4px; background: #eee; border-radius: 2px; margin: 18px 0 34px; overflow: hidden; }
  .t-days i { display: block; height: 100%; background: #111; }
  .t-cards { display: grid; gap: 20px; flex: 1; align-content: start; }
  .t-cards.n1 { grid-template-columns: minmax(0, 420px); } .t-cards.n2 { grid-template-columns: repeat(2, 1fr); }
  .t-cards.n3 { grid-template-columns: repeat(3, 1fr); } .t-cards.n4 { grid-template-columns: repeat(4, 1fr); }
  .t-card { border: 1px solid #ddd; border-radius: 10px; padding: 20px 22px 18px; background: #fafafa; }
  .t-team { font-size: 20px; font-weight: 700; }
  .t-sprint { font-size: 13px; color: #888; margin-top: 2px; }
  .t-big { font-size: 54px; font-weight: 700; line-height: 1; margin-top: 18px; font-variant-numeric: tabular-nums; }
  .t-big small { font-size: 26px; color: #666; margin-left: 2px; }
  .t-cap { font-size: 13px; color: #555; margin-top: 6px; }
  .t-bar { height: 6px; background: #e5e5e5; border-radius: 3px; margin: 12px 0 14px; overflow: hidden; }
  .t-bar i { display: block; height: 100%; background: var(--c-done); }
  .t-kpis { display: flex; gap: 18px; font-size: 12px; color: #666; }
  .t-kpis b { display: block; font-size: 17px; color: #111; font-variant-numeric: tabular-nums; }
  .t-kpis .bad b { color: var(--c-blocked); }
  .t-kpis .warn b { color: #b45309; }
  .t-foot { display: flex; justify-content: space-between; font-size: 13px; color: #888; border-top: 1px solid #e5e5e5; padding-top: 14px; }

  /* слайд команды: итог с одного взгляда — числа, цели, «заблокированы» и «не успели» */
  .hero-slide { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 40px 64px; }
  .h-kicker { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #777; }
  .hero-slide h1 { font-size: 64px; font-weight: 700; letter-spacing: -.02em; margin: 10px 0 0; line-height: 1.05; }
  .h-line { width: 64px; height: 4px; background: #111; margin: 14px auto 18px; }
  .h-kpis { display: flex; justify-content: center; gap: 0; margin-bottom: 18px; }
  .h-kpis > div { padding: 0 32px; border-left: 1px solid #e3e3e3; }
  .h-kpis > div:first-child { border-left: 0; }
  .h-kpis b { display: block; font-size: 38px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .h-kpis b small { font-size: 19px; color: #888; font-weight: 400; }
  .h-kpis span { font-size: 13px; color: #666; }
  .h-kpis .bad b { color: var(--c-blocked); }
  .h-kpis .warn b { color: #b45309; }
  .h-goals-title { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #999; margin: 10px 0 12px; }
  .h-goals { display: grid; gap: 16px; width: 100%; max-width: 1080px; }
  .h-goals.n1 { grid-template-columns: minmax(0, 420px); justify-content: center; } .h-goals.n2 { grid-template-columns: repeat(2, 1fr); }
  .h-goals.n3 { grid-template-columns: repeat(3, 1fr); } .h-goals.n4 { grid-template-columns: repeat(4, 1fr); }
  .h-goal { border: 1px solid #ddd; border-top: 4px solid #111; border-radius: 6px; padding: 16px 18px; text-align: left; background: #fff; }
  .h-obj { font-size: 12px; font-weight: 700; letter-spacing: .06em; color: #777; }
  .h-name { font-size: 16px; font-weight: 600; margin-top: 6px; line-height: 1.35; }
  .h-meta { font-size: 12px; color: #888; margin-top: 10px; }

  /* операционный: метка вместо заголовка, участники — три группы */

  .deck-body { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .deck-nav, .deck-bar .stage-only, .deck-side-tab { display: none; }
  /* ярлык у левого края сцены: открывает и закрывает сайдбар слайдов */
  .deck.stage .deck-side-tab { display: block; position: absolute; left: 0; top: 50%; transform: translateY(-50%); z-index: 4;

                          padding: 3px; box-shadow: 0 2px 8px rgba(0,0,0,.08); z-index: 3; }

                     font-size: 18px; line-height: 1; color: #111; }

  .deck-nav .count { font-size: 12px; min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }
  .deck.stage .deck-bar .stage-only { display: inline-block; }
  /* правки к колоде — та же корзина, что у отчёта PO, поверх слайдов */

<!-- Бизнес-отчёт «ФАКТ | спринт» (навык sprint-business): колода для управляющего

<div class="promptbox" id="promptbox">
  <div class="pb-row">

<div class="deck" id="deck" hidden role="main" aria-label="Бизнес-отчёт: факт спринта">

<script>
/*#include shared/core.js*/
  // ===================== Бизнес-отчёт «ФАКТ | спринт» =====================
  // Навык sprint-business: колода для управляющего комитета, PO смежных департаментов
  // и бизнес-заказчиков — по эталону отчётной колоды спринта PO. Данные те же, что у
  // отчёта PO (общий снимок), страница и генерация — свои.
  // Отчёт верхнеуровневый: слайд = цель OBJ, строка = KR (эпик) со сводкой историй
  // спринта — что сделано, где заблокированы, что не успели по объёму, след. шаг.
  // Истории по отдельности — по клику на строку (сайдбар), подробности — в отчёте PO
  // для техлидов. «Результат» и сводка считаются из данных; цели, KR и формулировки
  // агента — бизнес-блок reports/sprint-business.json (business.py). PO правит любой
  // текст на слайде сам («Редактировать текст»), ПКМ — комментарий.
  var deck = document.getElementById('deck');
  var deckSlides = document.getElementById('deckSlides');
  var deckFeed = document.getElementById('deckFeed');
  var deckRefs = {};                             // id → { team, epic, story }
  var deckEditing = false;

  function withTeam(t, fn) {                     // бакеты и корзина — своей команды
    var prev = team.slug;
    useTeam(t.slug);
    try { return fn(); } finally { useTeam(prev); }
  }

  var MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа',
                'сентября', 'октября', 'ноября', 'декабря'];
  function dayMonth(iso) { return iso ? parseInt(iso.slice(8, 10), 10) + ' ' + MONTHS[parseInt(iso.slice(5, 7), 10) - 1] : '—'; }
  function ddmmhhmm(iso) { return iso ? ddmm(iso) + ' ' + iso.slice(11, 16) : '—'; }
  function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }

  // Темп — та же идеальная прямая, что в burndown и в PDF /sprint-status.
  function teamPace(t) {
    var b = t.burndown || {}, days = b.days || [];
    if (!days.length) return null;
    var past = days.filter(function (d) { return !d.future; });
    var today = past.length ? past[past.length - 1] : days[0];
    var first = 0;
    for (var i = 0; i < days.length; i++) { if (days[i].scope) { first = i; break; } }
    var work = days.filter(function (d) { return !d.weekend; });
    return { start: b.start, end: b.end, scope: today.scope, closed: today.closed, scopeStart: days[first].scope,
             workday: work.filter(function (d) { return !d.future; }).length, workdays: work.length };
  }

  // «Результат» строки. Закрыта — 100%. Иначе — большее из двух: доля закрытых
  // подзадач и стадия (в работе 30, тест 80, ревью 90, не начата 0), но не выше 90:
  // 100% — только у закрытой истории. Заблокирована — 🛑, не начата — 🚫, как в
  // эталоне. Как посчитано — в подсказке у процента.
  var STAGE_PCT = { open: 0, progress: 30, testing: 80, review: 90, blocked: 0, done: 100 };
  function storyResult(st) {
    var bucket = classifyBucket(st.status, st.category);
    var subs = st.subtasks || [];
    var pct, how;
    if (bucket === 'done') { pct = 100; how = 'статус «' + st.status + '»'; }
    else {
      var stage = STAGE_PCT[bucket], parts = ['статус «' + st.status + '» — стадия ' + stage + '%'];
      pct = stage;
      if (subs.length) {
        var d = subs.filter(function (s) { return classifyBucket(s.status, s.category) === 'done'; }).length;
        var share = Math.round(100 * d / subs.length);
        parts.push('подзадачи: закрыто ' + d + ' из ' + subs.length + ' — ' + share + '%');
        pct = Math.max(pct, share);
      }
      if (pct > 90) { pct = 90; parts.push('история не закрыта — не выше 90%'); }
      how = parts.join(' · ');
    }
    var flag = bucket === 'blocked' ? '🛑 ' : (bucket === 'open' && pct === 0 ? '🚫 ' : '');
    return { pct: pct, how: how, flag: flag, bucket: bucket,
             cls: pct >= 100 ? 'stat-green' : pct >= 50 ? 'stat-yellow' : 'stat-red' };
  }

  // Текст строки — одним предложением «что сделано» и «след. шаг». Из данных:
  // закрытые подзадачи — это и есть сделанное, первая незакрытая — следующий шаг.
  var STAGE_SINCE = { progress: 'В работе с ', testing: 'В тестировании с ', review: 'На ревью с ' };
  var STAGE_NEXT = { progress: 'довести до ревью', testing: 'завершить тестирование', review: 'закрыть ревью',
                     open: 'взять в работу' };
  function listTitles(items) {
    var t = items.map(function (s) { return s.summary || s.title; });
    return t.slice(0, 2).join(', ') + (t.length > 2 ? ' и ещё ' + (t.length - 2) : '');
  }
  function autoText(st, r) {
    var subs = st.subtasks || [];
    var bucketOf = function (s) { return classifyBucket(s.status, s.category); };
    var closed = subs.filter(function (s) { return bucketOf(s) === 'done'; });
    var open = subs.filter(function (s) { return bucketOf(s) !== 'done'; });
    var done;
    if (r.bucket === 'done') done = closed.length ? 'Сделано: ' + listTitles(closed) + '.' : 'История закрыта.';
    else if (closed.length) done = 'Сделано: ' + listTitles(closed) + ' (' + closed.length + ' из ' + subs.length + ' подзадач).';
    else if (r.bucket === 'blocked') done = 'Стоит с ' + ddmm(st.statusChanged) + ': статус «' + st.status + '».';
    else if (r.bucket === 'open') done = 'Не начата.';
    else done = (STAGE_SINCE[r.bucket] || 'В работе с ') + ddmm(st.statusChanged) + '.';
    var next = '';
    if (r.bucket === 'blocked') next = 'снять блокер';
    else if (r.bucket !== 'done') {
      var active = open.filter(function (s) { return ['progress', 'testing', 'review', 'blocked'].indexOf(bucketOf(s)) !== -1; });
      var pick = active[0] || open[0];
      next = pick ? pick.summary : STAGE_NEXT[r.bucket] || '';
    }
    return { done: done, next: next };
  }

  function biz(t) { return t.business || {}; }

  // ключ строки «Вне эпиков» в бизнес-блоке (streams) — у историй спринта без эпика
  var NO_EPIC = 'no-epic';
  // название направления для бизнеса: KR из OKR, иначе эпик без служебных меток «[PaaS]»
  function cleanTitle(s) { return String(s || '').replace(/^(\s*(\[[^\]]*\]|\([^)]*\))\s*)+/, '').trim() || String(s || ''); }
  function streamName(s) { return s.ai.kr || (s.epic.epicKey ? cleanTitle(s.epic.epicTitle) : 'Вне эпиков'); }
  function clip(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1).replace(/\s+\S*$/, '') + '…' : s; }
  function titlesOf(rows, n) {
    var t = rows.map(function (r) { return clip(cleanTitle(r.st.title), 60); });
    return t.slice(0, n).join('; ') + (t.length > n ? ' и ещё ' + (t.length - n) : '');
  }

  // Последний день спринта или спринт закрыт — незакрытое уже «не успели по объёму»;
  // раньше — «пока не закрыто»: середина спринта ещё не провал.
  function behindLabel(t) {
    var p = teamPace(t);
    var late = !sprintRunning() || (p && p.workdays - p.workday <= 1);
    return late ? 'Не успели по объёму' : 'Пока не закрыто';
  }

  // Строка = эпик (KR) со сводкой историй спринта. Три корзины видны сразу: закрыто,
  // заблокировано (ждём кого-то) и не закрыто по объёму (не успели сами).
  function epicSummary(t, s) {
    var rows = s.rows;
    var of = function (f) { return rows.filter(f); };
    var done = of(function (r) { return r.r.bucket === 'done'; });
    var blocked = of(function (r) { return r.r.bucket === 'blocked'; });
    var behind = of(function (r) { return r.r.bucket !== 'done' && r.r.bucket !== 'blocked'; });
    var active = behind.filter(function (r) { return r.r.bucket !== 'open'; });
    s.done = done; s.blocked = blocked; s.behind = behind; s.active = active;
    s.pct = rows.length ? Math.round(rows.reduce(function (a, r) { return a + r.r.pct; }, 0) / rows.length) : 0;
    s.how = 'среднее «Результата» историй спринта: закрыто ' + done.length + ' из ' + rows.length +
      (blocked.length ? ', в блоке ' + blocked.length : '') + (behind.length ? ', не закрыто ' + behind.length : '');
    // готовность по оценке PO (streams.*.readiness) — главная цифра строки: PO видит
    // остаток работ, которого нет в задачах (релизный цикл, демо); расчёт — в подсказке
    if (typeof s.ai.readiness === 'number') {
      s.how = 'оценка PO: ' + s.ai.readiness + '%; по задачам спринта — ' + s.pct + '% (' + s.how + ')';
      s.pct = s.ai.readiness;
      s.byPo = true;
    }
    s.cls = s.pct >= 100 ? 'stat-green' : s.pct >= 50 ? 'stat-yellow' : 'stat-red';
    var autoDone = done.length ? 'Закрыто: ' + titlesOf(done, 2) + '.'
      : active.length ? 'В работе: ' + titlesOf(active, 2) + '.' : 'Работа не начата.';
    var autoBlk = blocked.map(function (r) {
      return clip(cleanTitle(r.st.title), 50) + ' — ' + (r.blocker || '«' + r.st.status + '» с ' + ddmm(r.st.statusChanged));
    }).slice(0, 2).join('; ') + (blocked.length > 2 ? ' и ещё ' + (blocked.length - 2) : '');
    var nextRow = active.filter(function (r) { return r.next; })[0] || behind.filter(function (r) { return r.next; })[0];
    // следующий шаг есть всегда: незакрытая история → её шаг; все закрыты → следующее по
    // эпику вне спринта; объёма не осталось — «эпик завершён»
    var openScope = (s.epic.scope || []).filter(function (it) {
      return !it.inSprint && classifyBucket(it.status, it.category) !== 'done';
    });
    var autoNext = nextRow ? nextRow.next
      : blocked.length ? 'снять блокеры'
      : !s.epic.epicKey ? 'работы вне эпиков закрыты'
      : !s.epic.scope ? 'истории спринта закрыты — взять следующие по эпику'
      : openScope.length ? 'дальше по эпику: ' + clip(cleanTitle(openScope[0].title), 70)
      : 'эпик завершён';
    s.text = { done: s.ai.done || autoDone, blocker: s.ai.blocker || autoBlk, next: s.ai.next || autoNext };
    return s;
  }

  // все строки команды: эпик (KR) → истории спринта со сводкой
  function teamStreams(t) {
    return withTeam(t, function () {
      var hide = biz(t).hide || [];
      var visible = function (e) { return (e.stories || []).filter(function (st) { return hide.indexOf(st.key) === -1; }); };
      return (t.epics || []).filter(function (e) { return visible(e).length; }).map(function (e) {
        var rows = visible(e).map(function (st) {
          var r = storyResult(st), auto = autoText(st, r), ai = (biz(t).rows || {})[st.key] || {};
          return { st: st, r: r, target: itemTarget('story', st, e),
                   done: ai.done || auto.done, next: ai.next || auto.next, blocker: ai.blocker || '', ai: !!(ai.done || ai.next) };
        }).sort(function (a, b) { return b.r.pct - a.r.pct; });
        return epicSummary(t, { epic: e, rows: rows, ai: (biz(t).streams || {})[e.epicKey || NO_EPIC] || {} });
      }).sort(function (a, b) { return (!a.epic.epicKey) - (!b.epic.epicKey) || b.pct - a.pct; });
    });
  }

  // слайд = цель (OBJ). Целей нет совсем — «Направления спринта»; есть, но эпик к
  // цели не привязан — «Без привязки к OKR».
  function objGroups(t, streams) {
    var by = {}, order = [];
    streams.forEach(function (s) {
      var k = s.ai.obj || '';
      if (!by[k]) { by[k] = []; order.push(k); }
      by[k].push(s);
    });
    order.sort(function (a, b) { return !a ? 1 : !b ? -1 : a.localeCompare(b, 'ru', { numeric: true }); });
    var names = biz(t).objectives || {};
    var anyGoal = order.some(Boolean);
    return order.map(function (k) {
      return { obj: k, title: k ? (names[k] ? k + ': ' + names[k] : k) : (anyGoal ? 'Без привязки к OKR' : 'Направления спринта'), streams: by[k] };
    });
  }

  // До шести строк-эпиков на слайд, поровну (8 → 4 + 4, не 6 + 2); что не влезло по
  // высоте — прокрутка внутри слайда.
  var ROWS_PER_SLIDE = 6;
  function packStreams(streams) {
    var n = Math.ceil(streams.length / ROWS_PER_SLIDE), per = Math.ceil(streams.length / Math.max(1, n)), pages = [];
    for (var i = 0; i < streams.length; i += per) pages.push(streams.slice(i, i + per));
    return pages;
  }

  // Правки текста PO: хранятся в браузере, по месту на слайде.
  function editsKey() { return 'actual-sprint:deck-text:' + TEAMS.map(function (t) { return t.slug + '@' + t.sprintName; }).join(','); }
  function loadEdits() { try { return JSON.parse(localStorage.getItem(editsKey()) || '{}') || {}; } catch (e) { return {}; } }
  function saveEdits(map) { try { localStorage.setItem(editsKey(), JSON.stringify(map)); } catch (e) { /* без хранилища правки живут до перезагрузки */ } }
  function ed(id, text, tag) {
    tag = tag || 'span';
    return '<' + tag + ' class="ed" data-edit="' + esc(id) + '">' + esc(text) + '</' + tag + '>';
  }

  var slideNo = 0;
  function slide(cls, inner, attrs) {
    slideNo++;
    return '<section class="fslide ' + cls + '" id="fs-' + slideNo + '"' + (attrs || '') + '>' + inner +
      '<div class="slide-num">' + slideNo + '</div></section>';
  }

  function sprintRunning() {
    var at = TEAMS.map(function (t) { return t._meta && t._meta.collectedAt; }).filter(Boolean).sort().pop();
    var end = TEAMS.map(function (t) { return t.burndown && t.burndown.end; }).filter(Boolean).sort().pop();
    return !!(at && end && at.slice(0, 10) <= end);
  }

  function sprintLabel() {
    var names = TEAMS.map(function (t) { return t.sprintName; }).filter(function (n, i, a) { return a.indexOf(n) === i; });
    var p = teamPace(TEAMS[0]);
    return names.length === 1 ? names[0] : (p ? dayMonth(p.start) + ' — ' + dayMonth(p.end) : 'спринт');
  }

  // Сводка команды для титула и слайда команды: из тех же строк, что на слайдах целей,
  // и из выработки участников (SP) текущего спринта.
  function teamStats(t, streams) {
    var rows = streams.reduce(function (a, s) { return a.concat(s.rows); }, []);   // без скрытых PO
    var by = function (f) { return rows.filter(f).length; };
    var out = t.output && t.output.sprints && t.output.sprints[t.output.sprints.length - 1];
    var sp = { done: 0, all: 0 };
    if (out && t.output.field) out.members.forEach(function (m) {
      Object.keys(m.split).forEach(function (b) { sp.all += m.split[b][1]; if (b === 'done') sp.done += m.split[b][1]; });
    });
    var objs = {};
    streams.forEach(function (s) { if (s.ai.obj) objs[s.ai.obj] = true; });
    return { stories: rows.length, done: by(function (r) { return r.r.pct >= 100; }),
             work: by(function (r) { return r.r.pct < 100 && r.r.bucket !== 'open' && r.r.bucket !== 'blocked'; }),
             blocked: by(function (r) { return r.r.bucket === 'blocked'; }), objectives: Object.keys(objs).length,
             behind: by(function (r) { return r.r.bucket !== 'done' && r.r.bucket !== 'blocked'; }),
             spDone: Math.round(sp.done), spAll: Math.round(sp.all), epics: streams.filter(function (s) { return s.epic.epicKey; }).length };
  }

  function pctOf(a, b) { return b ? Math.round(100 * a / b) : 0; }

  // Титул: что за отчёт, период и ход спринта, по команде — карточка с ключевыми числами.
  function titleSlide(all) {
    var paces = TEAMS.map(teamPace).filter(Boolean);
    var start = paces.map(function (p) { return p.start; }).sort()[0];
    var end = paces.map(function (p) { return p.end; }).sort().pop();
    var at = TEAMS.map(function (t) { return t._meta && t._meta.collectedAt; }).filter(Boolean).sort().pop();
    var p0 = paces[0], running = sprintRunning();
    var dayPct = p0 && p0.workdays ? Math.round(100 * p0.workday / p0.workdays) : 100;
    var cards = all.map(function (x) {
      var st = teamStats(x.t, x.streams), pc = pctOf(st.done, st.stories);
      return '<div class="t-card"><div class="t-team">' + esc(x.t.team) + '</div><div class="t-sprint">' + esc(x.t.sprintName) + '</div>' +
        '<div class="t-big">' + pc + '<small>%</small></div><div class="t-cap">историй закрыто · ' + st.done + ' из ' + st.stories + '</div>' +
        '<div class="t-bar"><i style="width:' + pc + '%"></i></div>' +
        '<div class="t-kpis"><span><b>' + (st.spAll ? st.spDone + '/' + st.spAll : '—') + '</b>SP сделано</span>' +
        '<span class="' + (st.blocked ? 'bad' : '') + '"><b>' + st.blocked + '</b>🛑 в блоке</span>' +
        '<span class="' + (st.behind ? 'warn' : '') + '"><b>' + st.behind + '</b>⏳ не закрыто</span></div></div>';
    }).join('');
    return slide('title-slide',
      '<div class="t-head"><div class="t-kicker">' + ed('title:kicker', 'Отчёт о продвижении за спринт') + '</div>' +
        '<div class="t-status ' + (running ? 'on' : 'off') + '">' + (running ? 'Спринт идёт' + (p0 ? ' · рабочий день ' + p0.workday + ' из ' + p0.workdays : '') : 'Спринт закрыт') + '</div></div>' +
      '<h1>' + ed('title:h1', 'ФАКТ | ' + dayMonth(start) + ' — ' + dayMonth(end) + ' ' + (end || '').slice(0, 4)) + '</h1>' +
      '<div class="t-period">' + TEAMS.map(function (t) { return esc(t.team) + ' — ' + esc(t.sprintName); }).join(' · ') + '</div>' +
      '<div class="t-days"><i style="width:' + dayPct + '%"></i></div>' +
      '<div class="t-cards n' + Math.min(all.length, 4) + '">' + cards + '</div>' +
      '<div class="t-foot"><span>' + ed('title:author', 'PO') + '</span><span>Данные JIRA на ' + ddmmhhmm(at) + '</span></div>');
  }

  // Слайд команды — итог с одного взгляда: числа, цели (если есть) и две панели —
  // «Заблокированы» (ждём других: нужна помощь) и «Не успели по объёму» (не закрыли
  // сами) по направлениям. Блокер — из бизнес-блока (rows.*.blocker), иначе статус и дата.
  function heroSlide(t, groups, streams) {
    var st = teamStats(t, streams), p = teamPace(t);
    var goals = groups.filter(function (g) { return g.obj; });
    var cards = (goals.length ? goals : groups).slice(0, 4).map(function (g) {
      var name = g.obj ? g.title.replace(g.obj + ': ', '') : g.title;
      var stories = g.streams.reduce(function (a, x) { return a + x.rows.length; }, 0);
      var done = g.streams.reduce(function (a, x) { return a + x.done.length; }, 0);
      return '<div class="h-goal"><div class="h-obj">' + esc(g.obj || 'Вне целей') + '</div>' +
        '<div class="h-name">' + ed('hero:' + t.slug + ':' + (g.obj || '-'), name) + '</div>' +
        '<div class="h-meta">' + g.streams.length + ' ' + plural(g.streams.length, 'направление', 'направления', 'направлений') +
        ' · закрыто ' + done + ' из ' + stories + '</div></div>';
    }).join('');
    return slide('hero-slide',
      '<div class="h-kicker">Команда · ' + esc(t.sprintName) + (p ? ' · ' + dayMonth(p.start) + ' — ' + dayMonth(p.end) : '') + '</div>' +
      '<h1>' + esc(t.team) + '</h1><div class="h-line"></div>' +
      '<div class="h-kpis"><div><b>' + st.done + '<small>/' + st.stories + '</small></b><span>задач закрыто</span></div>' +
        '<div><b>' + (st.spAll ? st.spDone + '<small>/' + st.spAll + '</small>' : '—') + '</b><span>SP сделано</span></div></div>' +
      '<div class="h-goals-title">' + (goals.length ? 'Цели квартала в спринте' : 'Направления спринта') + '</div>' +
      '<div class="h-goals n' + Math.min(Math.max((goals.length || groups.length), 1), 4) + '">' + cards + '</div>',
      ' data-kind="команда" data-team="' + esc(t.slug) + '"' + ctxAttr({ kind: 'slide', title: 'Команда · ' + t.team }));
  }

  // Строка = направление (эпик/KR): что сделано одним предложением, блокер, что не
  // закрыто, след. шаг; справа — результат и полоса историй по статусам.
  var RES_SEGS = [
    { id: 'done', color: 'var(--c-done)', label: 'закрыто' },
    { id: 'work', color: 'var(--c-progress)', label: 'в работе' },
    { id: 'blocked', color: 'var(--c-blocked)', label: 'в блоке' },
    { id: 'open', color: '#d1d5db', label: 'не начато' }
  ];
  function epicRow(t, s) {
    var e = s.epic, key = e.epicKey || NO_EPIC, id = 'e' + Object.keys(deckRefs).length;
    deckRefs[id] = { team: t, epic: e, stream: s };
    var n = { done: s.done.length, work: s.active.length, blocked: s.blocked.length, open: s.behind.length - s.active.length };
    var bar = RES_SEGS.map(function (g) { return n[g.id] ? '<i style="flex:' + n[g.id] + ';background:' + g.color + '"></i>' : ''; }).join('');
    var tip = RES_SEGS.filter(function (g) { return n[g.id]; }).map(function (g) { return g.label + ' ' + n[g.id]; }).join(' · ');
    var name = s.ai.kr ? ed('kr:' + t.slug + ':' + key, s.ai.kr, 'b') : '<b>' + esc(streamName(s)) + '</b>';
    return '<tr class="row erow ' + s.cls + (s.blocked.length ? ' has-blk' : '') + '" data-ref="' + id + '" data-team="' + esc(t.slug) + '"' +
      (e.epicKey ? ' data-key="' + esc(e.epicKey) + '"' : '') +
      ctxAttr(e.epicKey ? epicTarget(e) : { kind: 'general', title: 'Вне эпиков' }) + ' title="Истории спринта и весь эпик">' +
      '<td class="task">' + name + '</td>' +
      // одна гарнитура и один кегль: итог, «дальше», блокер — подписью, без жирного и красных абзацев
      '<td class="sum"><div class="ln-meta">' + (e.epicKey ? keyLink(e.epicKey) + ' · ' : '') + s.rows.length + ' ' +
        plural(s.rows.length, 'задача', 'задачи', 'задач') + ' в спринте</div>' +
        ed('sdone:' + t.slug + ':' + key, s.text.done, 'div') +
        (s.text.next ? '<div class="ln"><span class="lbl">Дальше</span>' + ed('snext:' + t.slug + ':' + key, s.text.next, 'span') + '</div>' : '') +
        (s.text.blocker ? '<div class="ln ln-blk"><span class="lbl">Блокер</span>' + ed('sblk:' + t.slug + ':' + key, s.text.blocker) + '</div>' : '') + '</td>' +
      '<td class="result"><span title="' + esc(s.how) + '">' + s.pct + '%</span>' + (s.byPo ? '<small class="res-po"> оценка PO</small>' : '') +
        '<div class="res-sub">закрыто ' + s.done.length + ' из ' + s.rows.length + '</div>' +
        '<div class="res-bar" title="' + esc(tip) + '">' + bar + '</div>' +
        (s.blocked.length ? '<button type="button" class="blk-badge" data-blk="' + id + '" title="' +
          esc(s.blocked.map(function (r) { return r.st.key + ' · ' + r.st.title + (r.blocker ? ' — ' + r.blocker : ''); }).join('\n')) +
          '">🛑 блокаторы: ' + s.blocked.length + '</button>' : '') + '</td></tr>';
  }

  function objSlide(t, g, page, part, parts) {
    return slide('', '<h1 class="slide-title">' + ed('obj:' + t.slug + ':' + (g.obj || '-') + ':' + part, g.title + (parts > 1 ? ' · ' + (part + 1) + '/' + parts : '')) + '</h1>' +
      '<table class="rep epics"><colgroup><col class="c1"><col class="c2"><col class="c3"></colgroup>' +
      '<thead><tr><th>Направление</th><th>Итог спринта</th><th>Результат</th></tr></thead><tbody>' +
      page.map(function (s) { return epicRow(t, s); }).join('') + '</tbody></table>',
      ' data-team="' + esc(t.slug) + '"' + ctxAttr({ kind: 'slide', title: t.team + ' · ' + g.title }));
  }

  // ---------- операционный отчёт команды ----------
  // «Общая производительность команды»: план по трём группам на конец спринта и сделано
  function teamOutputChart(m, box) {
    var k = m.sp ? 1 : 0;
    var finished = m.team.filter(function (c, i) { return c && !m.sprints[i].current; });
    var avgOf = finished.length ? finished : m.team.filter(Boolean);
    var data = {
      sprints: m.sprints.map(function (s, i) {
        var g = (m.team[i] || { groups: { todo: [0, 0], work: [0, 0], done: [0, 0] } }).groups;
        var split = { open: g.todo[k], blocked: 0, progress: g.work[k], testing: 0, review: 0, done: g.done[k] };
        return { name: s.name + (s.current ? ' · идёт' : ''), planned: Math.round((g.todo[k] + g.work[k] + g.done[k]) * 10) / 10,
                 done: g.done[k], split: split };
      }),
      avgDone: avgOf.length ? avgOf.reduce(function (a, c) { return a + c.groups.done[k]; }, 0) / avgOf.length : 0
    };
    return withChartBox(box || { W: 560, H: 220 }, function () { return velocityChart(data); });
  }

  // ---------- слайд «Сроки» ----------
  // короткое имя спринта для подписей: «Спринт 72» → «С72»
  function sprintShort(name) {
    var n = /(\d+)\s*$/.exec(name || '');
    return n ? 'С' + n[1] : (name || '');
  }

  // сглаженная линия через точки, монотонная по x (как curveMonotoneX): не петляет
  // назад и не выходит за соседние значения; точки одного x сливаются в последнюю;
  // cont — продолжить контур (L вместо M), чтобы собрать заливку из двух кривых
  function smoothPath(pts, cont) {
    var p = [];
    pts.forEach(function (q) { if (p.length && Math.abs(p[p.length - 1][0] - q[0]) < .5) p[p.length - 1] = q; else p.push(q); });
    if (!p.length) return '';
    var n = p.length, d = (cont ? ' L' : 'M') + p[0][0].toFixed(1) + ' ' + p[0][1].toFixed(1);
    if (n === 1) return d;
    var sl = [], m = [];
    for (var i = 0; i < n - 1; i++) sl.push((p[i + 1][1] - p[i][1]) / (p[i + 1][0] - p[i][0]));
    m[0] = sl[0]; m[n - 1] = sl[n - 2];
    for (i = 1; i < n - 1; i++) m[i] = sl[i - 1] * sl[i] <= 0 ? 0 : 2 / (1 / sl[i - 1] + 1 / sl[i]);
    for (i = 0; i < n - 1; i++) {
      var h = (p[i + 1][0] - p[i][0]) / 3;
      d += ' C' + (p[i][0] + h).toFixed(1) + ' ' + (p[i][1] + m[i] * h).toFixed(1) + ' ' + (p[i + 1][0] - h).toFixed(1) + ' ' +
        (p[i + 1][1] - m[i + 1] * h).toFixed(1) + ' ' + p[i + 1][0].toFixed(1) + ' ' + p[i + 1][1].toFixed(1);
    }
    return d;
  }

  var d1 = function (v) { return (Math.round(v * 10) / 10).toFixed(1).replace('.', ','); };

  var CYCLE_STREAMS = [
    { id: 'stories', label: 'Истории', color: '#2563eb', dash: '' },
    { id: 'subtasks', label: 'Подзадачи', color: '#ea580c', dash: '7 5' }
  ];
  var CYCLE_ROLL = 5;

  // Cycle time закрытых за 3 спринта задач: полосы спринтов, точки двух потоков и
  // скользящее среднее по последним пяти задачам потока, значение — подписью в конце линии.
  function cycleChart(t, m, box) {
    var from = opsFrom(t, m);
    var today = ((t._meta && t._meta.collectedAt) || new Date().toISOString()).slice(0, 10);
    var streams = CYCLE_STREAMS.map(function (st) {
      var pts = controlWindow((t.control || {})[st.id], from, today).points;
      var roll = [], sd = [];
      pts.forEach(function (p, i) {
        var w = pts.slice(Math.max(0, i - CYCLE_ROLL + 1), i + 1).map(function (q) { return q.cycle; });
        var mean = w.reduce(function (a, v) { return a + v; }, 0) / w.length;
        roll.push(mean);
        sd.push(Math.sqrt(w.reduce(function (a, v) { return a + (v - mean) * (v - mean); }, 0) / w.length));
      });
      return Object.assign({ pts: pts, roll: roll, sd: sd }, st);
    });
    var all = streams[0].pts.concat(streams[1].pts);
    if (!all.length) return '<div class="ops-empty">За три спринта закрытых задач нет.</div>';
    var W = box.W, H = box.H, padL = 34, padR = 128, padT = 26, padB = 22;
    var t0 = new Date(from + 'T00:00:00').getTime(), t1 = new Date(today + 'T23:59:59').getTime();
    var maxY = Math.max.apply(null, all.map(function (p) { return p.cycle; })) * 1.06 || 1;
    var xOf = function (iso) {
      var v = new Date(iso.length > 10 ? iso : iso + 'T12:00:00').getTime();
      return padL + (W - padL - padR) * Math.min(1, Math.max(0, (v - t0) / (t1 - t0)));
    };
    var yOf = function (v) { return padT + (H - padT - padB) * (1 - v / maxY); };
    var parts = [];
    // полосы спринтов: чередующаяся заливка и короткое имя сверху
    (m ? m.sprints : []).forEach(function (s, i) {
      if (!s.start) return;
      var x0 = xOf(s.start < from ? from : s.start), x1 = xOf(s.end && s.end < today ? s.end : today);
      if (x1 <= x0) return;
      parts.push('<rect x="' + x0.toFixed(1) + '" y="' + padT + '" width="' + (x1 - x0).toFixed(1) + '" height="' + (H - padT - padB) +
        '" fill="' + (i % 2 ? '#f3f4f6' : '#fafafa') + '"/>');
      parts.push('<text x="' + ((x0 + x1) / 2).toFixed(1) + '" y="' + (padT - 9) + '" font-size="12" font-weight="700" fill="#888" text-anchor="middle">' +
        esc(sprintShort(s.name)) + (s.current ? ' · идёт' : '') + '</text>');
    });
    var step = maxY > 40 ? 10 : maxY > 16 ? 5 : 2;
    for (var v = 0; v <= maxY; v += step) {
      parts.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yOf(v).toFixed(1) + '" y2="' + yOf(v).toFixed(1) + '" stroke="#e5e7eb"/>');
      parts.push('<text x="' + (padL - 6) + '" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="11" fill="#888" text-anchor="end">' + v + '</text>');
    }
    // коридор, как в JIRA: скользящее среднее ± σ того же окна, заливкой цвета потока
    streams.forEach(function (st) {
      if (st.pts.length < 2) return;
      var hi = st.pts.map(function (p, i) { return [xOf(p.doneAt), yOf(Math.min(maxY, st.roll[i] + st.sd[i]))]; });
      var lo = st.pts.map(function (p, i) { return [xOf(p.doneAt), yOf(Math.max(0, st.roll[i] - st.sd[i]))]; }).reverse();
      parts.push('<path class="cyc-band" d="' + smoothPath(hi) + smoothPath(lo, true) + ' Z" fill="' + st.color + '" fill-opacity=".09" stroke="' +
        st.color + '" stroke-opacity=".25" stroke-width="1"' + (st.dash ? ' stroke-dasharray="3 3"' : '') + '/>');
    });
    streams.forEach(function (st) {
      st.pts.forEach(function (p) {
        parts.push('<circle cx="' + xOf(p.doneAt).toFixed(1) + '" cy="' + yOf(p.cycle).toFixed(1) + '" r="' + (st.id === 'stories' ? 4 : 3.2) +
          '" fill="' + st.color + '" opacity=".45"><title>' + esc(p.key + ' · ' + fmtNum(p.cycle) + ' дн. · закрыта ' + ddmm(p.doneAt) + '\n' + p.title) + '</title></circle>');
      });
    });
    // сглаженные средние и подписи в конце; близкие подписи разводим по вертикали
    var ends = [];
    streams.forEach(function (st) {
      if (!st.pts.length) return;
      var line = st.pts.map(function (p, i) { return [xOf(p.doneAt), yOf(st.roll[i])]; });
      parts.push('<path class="cyc-avg" d="' + smoothPath(line) + '" fill="none" stroke="' + st.color + '" stroke-width="2.6"' +
        (st.dash ? ' stroke-dasharray="' + st.dash + '"' : '') + ' stroke-linecap="round"/>');
      var last = line[line.length - 1];
      ends.push({ st: st, x: last[0], y: last[1], val: st.roll[st.roll.length - 1] });
    });
    ends.sort(function (a, b) { return a.y - b.y; });
    if (ends.length === 2 && ends[1].y - ends[0].y < 34) {
      var mid = (ends[0].y + ends[1].y) / 2;
      ends[0].ly = mid - 17; ends[1].ly = mid + 17;
    }
    ends.forEach(function (e) {
      var ly = e.ly === undefined ? e.y : e.ly;
      parts.push('<circle cx="' + e.x.toFixed(1) + '" cy="' + e.y.toFixed(1) + '" r="4.5" fill="#fff" stroke="' + e.st.color + '" stroke-width="2.4"/>');
      parts.push('<text x="' + (W - padR + 12) + '" y="' + (ly - 2).toFixed(1) + '" font-size="12" fill="' + e.st.color + '">' + e.st.label + '</text>');
      parts.push('<text x="' + (W - padR + 12) + '" y="' + (ly + 16).toFixed(1) + '" font-size="17" font-weight="700" fill="' + e.st.color + '">' +
        d1(e.val) + ' дн.</text>');
    });
    // поток без закрытых задач (команда не ведёт подзадачи) — не «0» в легенде, а пояснение
    var shown = streams.filter(function (st) { return st.pts.length; });
    var empty = streams.filter(function (st) { return !st.pts.length; });
    var legend = '<div class="ops-legend">' + shown.map(function (st) {
      return '<span><i class="l-pt" style="background:' + st.color + '"></i>' + st.label + ' · ' + st.pts.length + '</span>';
    }).join('') + shown.map(function (st) {
      return '<span><i class="l-line" style="border-top:2.5px ' + (st.dash ? 'dashed' : 'solid') + ' ' + st.color + '"></i>' +
        st.label.toLowerCase() + ': среднее по ' + CYCLE_ROLL + ' последним</span>';
    }).join('') + '<span><i class="l-band"></i>коридор ± σ</span>' +
      empty.map(function (st) { return '<span class="l-none">' + st.label + ': за 3 спринта закрытых нет</span>'; }).join('') + '</div>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + parts.join('') + '</svg>' + legend;
  }

  // среднее время в статусе по спринтам: крупно текущее значение, столбики по спринтам —
  // текущий насыщенный, прошлые бледные.
  var TIS = [
    { id: 'blocked', label: 'Заблокировано', color: 'var(--c-blocked)' },
    { id: 'review', label: 'Ревью', color: 'var(--c-review)' },
    { id: 'testing', label: 'Отладка', color: 'var(--c-testing)' }
  ];

  function statusTimePanel(m, st) {
    var vals = m.sprints.map(function (s) { var v = (s.timeInStatus || {})[st.id]; return typeof v === 'number' ? v : null; });
    var have = vals.map(function (v, i) { return v === null ? -1 : i; }).filter(function (i) { return i >= 0; });
    if (!have.length) return '<div class="tis"><div class="tis-h">' + st.label + '</div><div class="tis-none">нет данных</div></div>';
    var cur = vals[have[have.length - 1]];
    var W = 340, H = 120, padB = 18, padT = 16, max = Math.max.apply(null, have.map(function (i) { return vals[i]; })) || 1;
    var n = m.sprints.length, bw = Math.min(64, (W - 20) / n - 14);
    var bars = m.sprints.map(function (s, i) {
      var x = 10 + (W - 20) * (i + .5) / n - bw / 2, v = vals[i];
      var h = v === null ? 0 : (H - padT - padB) * v / max, y = H - padB - h;
      var isCur = i === have[have.length - 1];
      return (v === null ? '' : '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
          '" rx="2" fill="' + st.color + '" opacity="' + (isCur ? 1 : .3) + '"/><text x="' + (x + bw / 2).toFixed(1) + '" y="' + (y - 4).toFixed(1) +
          '" font-size="11" text-anchor="middle" fill="' + (isCur ? '#111' : '#888') + '">' + d1(v) + '</text>') +
        '<text x="' + (x + bw / 2).toFixed(1) + '" y="' + (H - 4) + '" font-size="11" text-anchor="middle" fill="' + (isCur ? '#111' : '#999') + '"' +
        (isCur ? ' font-weight="700"' : '') + '>' + esc(sprintShort(s.name)) + '</text>';
    }).join('');
    return '<div class="tis' + (st.id === 'blocked' ? ' tis-click" data-tis="blocked' : '') + '"' + (st.id === 'blocked' ? ' title="Кто, почему и с какого числа был заблокирован"' : '') +
      '><div class="tis-h">' + st.label + (st.id === 'blocked' ? ' <small>· клик — разбор</small>' : '') + '</div><div class="tis-big" style="color:' + st.color + '">' + d1(cur) +
      ' <small>дн.</small></div><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + bars + '</svg></div>';
  }

  function cycleSlide(t) {
    var m = outputModel(t);
    var chart = '<div class="cyc" data-ctl="' + esc(t.slug) + '" title="Подробный разбор: диаграмма управления">' +
      cycleChart(t, m, { W: 1184, H: 360 }) + '</div>';
    var tis = m && m.sprints.some(function (s) { return s.timeInStatus; })
      ? '<div class="tis-row" data-team="' + esc(t.slug) + '">' + TIS.map(function (st) { return statusTimePanel(m, st); }).join('') + '</div>'
      : '<div class="ops-empty">Сборщик не отдал время в статусах (нужна версия 1.8.0).</div>';
    return slide('ops cycle', '<div class="ops-tag">' + esc(t.team) + ' · сроки</div>' + chart + tis,
      ' data-team="' + esc(t.slug) + '"' + ctxAttr({ kind: 'slide', title: 'Сроки · ' + t.team }));
  }

  // Разбор «Заблокировано»: кто и когда стоял в блоке за спринты отчёта, сколько,
  // почему — по смене статусов и комментариям задач участников (output.sprints[].items)
  function blockedEpisodes(t) {
    var m = outputModel(t), out = [];
    // комментарии задачи за всё время — из хронологии историй спринта: причина блока часто
    // записана до начала спринта, а items.comments — только в его границах
    var talk = {};
    (t.epics || []).forEach(function (e) {
      (e.stories || []).forEach(function (st) {
        (st.events || []).forEach(function (ev) {
          if (ev.kind === 'comment' && ev.body) (talk[ev.key] = talk[ev.key] || []).push({ at: ev.at, by: ev.by, body: ev.body });
        });
      });
    });
    var at = (t._meta && t._meta.collectedAt) || new Date().toISOString();
    withTeam(t, function () {
      (m ? m.sprints : []).forEach(function (sp) {
        sp.members.forEach(function (mem) {
          (mem.items || []).forEach(function (it) {
            var hist = (it.history || []).slice().sort(function (a, b) { return a.at < b.at ? -1 : 1; });
            var open = null, list = [];
            hist.forEach(function (h) {
              var blk = classifyBucket(h.to || '', '') === 'blocked';
              if (blk && !open) open = { from: h.at, status: h.to, by: h.by };
              else if (!blk && open) { open.to = h.at; open.next = h.to; list.push(open); open = null; }
            });
            if (open) list.push(open);
            if (!list.length && it.bucket === 'blocked') list.push({ from: null, status: it.status });
            list.forEach(function (iv) {
              var end = iv.to || (sp.current ? at : (sp.end || at));
              var days = iv.from ? Math.max(0, (parseTs(end).getTime() - parseTs(iv.from).getTime()) / 86400000) : null;
              out.push({ sprint: sp, who: mem.name, it: it, iv: iv, days: days, now: !iv.to && sp.current, talk: talk[it.key] || [] });
            });
          });
        });
      });
    });
    return out.sort(function (a, b) { return (b.sprint.current - a.sprint.current) || (b.now - a.now) || ((b.days || 0) - (a.days || 0)); });
  }

  function openBlocked(t) { showPanel(function () { renderBlocked(t); }); }
  function renderBlocked(t) {
    if (team.slug !== t.slug) switchTeam(t.slug);
    var eps = blockedEpisodes(t);
    stackTitle.parentNode.removeAttribute('data-ctx');
    stackKey.textContent = 'Заблокировано · ' + t.team;
    stackTitle.textContent = eps.filter(function (x) { return x.now; }).length + ' в блоке сейчас · ' + eps.length + ' эпизодов за 3 спринта';
    scopeBtn.hidden = true; scopeEpic = null;
    storiesLabel.textContent = 'По смене статусов и комментариям: кто, с какого числа, почему, что нужно для разблокировки';
    var bySprint = [];
    eps.forEach(function (x) {
      var g = bySprint.find(function (y) { return y.sp === x.sprint; });
      if (!g) bySprint.push(g = { sp: x.sprint, list: [] });
      g.list.push(x);
    });
    storiesBody.innerHTML = eps.length ? bySprint.map(function (g) {
      return '<div class="pane-label">' + esc(g.sp.name) + (g.sp.current ? ' · идёт' : '') + ' · ' + g.list.length + '</div>' + g.list.map(function (x) {
        var all = (x.it.comments || []).concat(x.talk.filter(function (c) {
          return !(x.it.comments || []).some(function (o) { return o.at === c.at && o.body === c.body; });
        })).sort(function (a, b) { return a.at < b.at ? -1 : 1; });
        var com = all.filter(function (c) { return !x.iv.from || c.at >= x.iv.from.slice(0, 10); });
        com = (com.length ? com : all).slice(-3);
        return '<div class="bl-card' + (x.now ? ' now' : '') + '"><div class="es-top"><span class="es-title">' + esc(x.it.title) + '</span>' +
          '<span class="es-pct">' + (x.days !== null ? fmtNum(Math.round(x.days * 10) / 10) + ' дн.' : '') + '</span></div>' +
          '<div class="es-meta">' + keyLink(x.it.key) + ' · ' + esc(shortName(x.who)) + ' · «' + esc(x.iv.status || x.it.status) + '»' +
            (x.iv.from ? ' с ' + ddmm(x.iv.from) : '') + (x.iv.to ? ' по ' + ddmm(x.iv.to) + (x.iv.next ? ' → ' + esc(x.iv.next) : '') : x.now ? ' · <b>в блоке сейчас</b>' : '') +
            (x.iv.by ? ' · перевёл ' + esc(shortName(x.iv.by)) : '') + '</div>' +
          (com.length ? '<div class="bl-com">' + com.map(function (c) { return '<div><span>' + ddmm(c.at) + (c.by ? ' · ' + esc(shortName(c.by)) : '') + '</span> ' + esc(clip(c.body, 280)) + '</div>'; }).join('') + '</div>'
                      : '<div class="bl-com empty">Комментариев о причине нет — спросить исполнителя.</div>') + '</div>';
      }).join('');
    }).join('') : '<div class="sidebar-empty">За 3 спринта задачи в блок не переходили.</div>';
    openPanel();
  }

  // начало окна «за 3 спринта»: старт первого из трёх спринтов выработки, иначе −6 недель
  function opsFrom(t, m) {
    var starts = m ? m.sprints.map(function (s) { return s.start; }).filter(Boolean) : [];
    var today = ((t._meta && t._meta.collectedAt) || new Date().toISOString()).slice(0, 10);
    return starts[0] || addDays(today, -42);
  }

  // Детальный разбор диаграммы управления: по потоку — показатели, диаграмма со
  // списками выбросов и зоны риска, разбивка по спринтам.
  function openControl(t) { showPanel(function () { renderControl(t); }); }
  function renderControl(t) {
    if (team.slug !== t.slug) switchTeam(t.slug);
    var m = outputModel(t), from = opsFrom(t, m);
    stackTitle.parentNode.removeAttribute('data-ctx');
    stackKey.textContent = 'Диаграмма управления · ' + t.team;
    stackTitle.textContent = 'Cycle Time за 3 спринта, с ' + ddmm(from);
    scopeBtn.hidden = true;
    scopeEpic = null;
    storiesLabel.textContent = '';
    var ctl = t.control || {};
    // «Все» — обе выборки вместе, по дате закрытия: как поток задач команды целиком
    var both = function () {
      var a = (ctl.stories || {}), b = (ctl.subtasks || {});
      return { days: a.days || b.days, points: (a.points || []).concat(b.points || []).sort(function (x, y) { return x.doneAt < y.doneAt ? -1 : 1; }),
               risks: (a.risks || []).concat(b.risks || []) };
    };
    var src = { all: both(), stories: ctl.stories, subtasks: ctl.subtasks };
    var data = { all: controlWindow(src.all, from), stories: controlWindow(ctl.stories, from), subtasks: controlWindow(ctl.subtasks, from) };
    var sprints = m ? m.sprints : [];
    sideTabs([{ id: 'all', label: 'Все', n: data.all.points.length },
              { id: 'stories', label: 'Истории', n: data.stories.points.length },
              { id: 'subtasks', label: 'Подзадачи', n: data.subtasks.points.length }], 'all', function (id, body) {
      var c = data[id], gen = id === 'stories' ? 'историй' : id === 'subtasks' ? 'подзадач' : 'задач';
      if (!c.points.length) { body.innerHTML = '<div class="sidebar-empty">Закрытых ' + gen + ' за 3 спринта нет.</div>'; return; }
      var kpi = function (v, l, tip) { return '<div class="ck"' + (tip ? ' title="' + esc(tip) + '"' : '') + '><b>' + v + '</b><span>' + l + '</span></div>'; };
      var pct = Math.round(100 * c.outliers / c.points.length);
      var rows = sprints.map(function (s, i) {
        var next = sprints[i + 1];
        var w = controlWindow(src[id], s.start, next && next.start ? addDays(next.start, -1) : null);
        return '<tr><td>' + esc(s.name) + (s.current ? ' <small>идёт</small>' : '') + '</td><td>' + w.points.length + '</td><td>' +
          (w.points.length ? fmt(w.median) : '—') + '</td><td>' + (w.points.length ? fmt(w.mean) : '—') + '</td><td>' +
          (w.points.length ? w.outliers : '—') + '</td></tr>';
      }).join('');
      body.innerHTML = '<div class="ckpis">' + kpi(c.points.length, 'закрыто') + kpi(fmt(c.median) + ' <small>дн.</small>', 'медиана') +
        kpi(fmt(c.mean) + ' <small>дн.</small>', 'среднее') + kpi(fmt(c.sd) + ' <small>дн.</small>', 'σ', 'Разброс: σ не меньше среднего — сроки непредсказуемы') +
        kpi(fmt(c.limit) + ' <small>дн.</small>', 'порог выброса', 'среднее + σ') +
        kpi(c.outliers + ' <small>· ' + pct + '%</small>', 'выбросов') + kpi(c.risks.length, 'в зоне риска', 'не закрыты и идут дольше медианы') + '</div>' +
        '<div class="cbig">' + withTeam(t, function () { return withChartBox({ W: 760, H: 280 }, function () { return controlChart(c, gen, id === 'subtasks' ? 'subtask' : 'story'); }); }) + '</div>' +
        (rows ? '<div class="pane-label">По спринтам</div><table class="ctab"><thead><tr><th>Спринт</th><th>закрыто</th><th>медиана, дн.</th><th>среднее, дн.</th><th>выбросов</th></tr></thead><tbody>' + rows + '</tbody></table>' : '');
    });
    openPanel();
  }

  // ---------- участники: выработка текущего спринта ----------
  // Строка на участника: график (задачи спринта по статусам, под ними — задачи вне
  // доски), SP план/факт, задачи и подзадачи план/факт/lead time. Состав команды —
  // business.members (кэш от PO-агента); остальные на доске — [EXT]. Без сортировок,
  // шкал и легенд: слайд читается сразу.
  var MX_BUCKETS = [
    { id: 'done', label: 'Готово', color: 'var(--c-done)' },
    { id: 'progress', label: 'В работе', color: 'var(--c-progress)' },
    { id: 'review', label: 'Ревью', color: 'var(--c-review)' },
    { id: 'testing', label: 'Отладка', color: 'var(--c-testing)' },
    { id: 'blocked', label: 'Заблокировано', color: 'var(--c-blocked)' },
    { id: 'open', label: 'Не начато', color: '#d1d5db' }
  ];

  // на момент сбора (_meta.collectedAt): слайд — снимок, одинаковый в любой день открытия
  function ageAtCollect(t, iso) {
    if (!iso) return null;
    var at = t._meta && t._meta.collectedAt ? parseTs(t._meta.collectedAt).getTime() : Date.now(), then = parseTs(iso).getTime();
    return isNaN(then) ? null : Math.max(0, Math.floor((at - then) / 86400000));
  }

  function median(xs) {
    xs = xs.filter(function (v) { return typeof v === 'number'; }).sort(function (a, b) { return a - b; });
    if (!xs.length) return null;
    var m = Math.floor(xs.length / 2);
    return xs.length % 2 ? xs[m] : (xs[m - 1] + xs[m]) / 2;
  }

  function memberRows(t) {
    var m = outputModel(t), cur = m && m.sprints[m.sprints.length - 1];
    var off = (t.output && t.output.offboard) || null, offBy = {};
    var notEpic = function (it) { return ['эпик', 'epic'].indexOf(String(it.type || '').toLowerCase()) === -1; };
    (off ? off.members : []).forEach(function (x) { offBy[x.name] = (x.items || []).filter(notEpic); });
    var by = {}, get = function (n) { return by[n] || (by[n] = { name: n, items: [], subs: [], split: null, epics: true }); };
    if (cur) cur.members.forEach(function (mem) {
      by[mem.name] = { name: mem.name, items: mem.items || [], subs: mem.subtasks || null, split: mem.split, epics: false,
                       row: m.rows.find(function (x) { return x.name === mem.name; }) };
    });
    withTeam(t, function () {
      var hide = biz(t).hide || [];
      (t.epics || []).forEach(function (e) {
        (e.stories || []).forEach(function (st) {
          if (hide.indexOf(st.key) !== -1) return;
          var r = get(st.assignee || 'Не назначен');
          if (r.epics) r.items.push({ key: st.key, title: st.title, status: st.status, bucket: classifyBucket(st.status, st.category), sp: 0, lead: null });
          (st.subtasks || []).forEach(function (sub) {
            var rs = get(sub.assignee || 'Не назначен');
            if (!rs.subs || rs.epics || rs.subsFromEpics) {
              rs.subs = rs.subs || [];
              rs.subsFromEpics = true;
              rs.subs.push({ key: sub.key, title: sub.summary || sub.title, status: sub.status, bucket: classifyBucket(sub.status, sub.category), lead: null });
            }
          });
        });
      });
    });
    Object.keys(offBy).forEach(function (n) { get(n); });
    var team = biz(t).members || null;
    return Object.keys(by).map(function (n) {
      var r = by[n];
      r.subs = r.subs || [];
      r.off = offBy[n] || [];
      var sp = { plan: 0, fact: 0 };
      if (r.split) Object.keys(r.split).forEach(function (b) { sp.plan += r.split[b][1]; if (b === 'done') sp.fact += r.split[b][1]; });
      r.sp = r.split ? sp : null;
      r.done = function (list) { return list.filter(function (x) { return x.bucket === 'done'; }); };
      r.lt = { items: median(r.done(r.items).map(function (x) { return x.lead; })), subs: median(r.done(r.subs).map(function (x) { return x.lead; })) };
      r.ext = !!team && team.indexOf(n) === -1 && n !== 'Не назначен';
      return r;
    }).filter(function (r) { return r.items.length || r.subs.length || r.off.length; })
      .sort(function (a, b) {
        if ((a.name === 'Не назначен') !== (b.name === 'Не назначен')) return a.name === 'Не назначен' ? 1 : -1;
        return ((b.sp || {}).fact || 0) - ((a.sp || {}).fact || 0) || b.done(b.items).length - a.done(a.items).length || (a.name < b.name ? -1 : 1);
      });
  }

  var OFF_REFS = [], SB_REFS = [];
  // блоки участника «в спринте»: история сверху (цвет — статус), под ней её подзадачи;
  // ширина блока — по числу подзадач. Подзадачи участника в чужих историях — блоком с
  // бледной полосой истории. Блок «вне спринта» — задача целиком, без подзадач.
  function sprintBlocks(t, name) {
    var out = [], hide = biz(t).hide || [];
    withTeam(t, function () {
      (t.epics || []).forEach(function (e) {
        (e.stories || []).forEach(function (st) {
          if (hide.indexOf(st.key) !== -1) return;
          var mine = (st.assignee || 'Не назначен') === name;
          var subs = (st.subtasks || []).filter(function (x) { return mine || (x.assignee || 'Не назначен') === name; });
          if (!mine && !subs.length) return;
          out.push({ st: st, epic: e, mine: mine, bucket: classifyBucket(st.status, st.category),
                     subs: subs.map(function (x) { return { key: x.key, title: x.summary || x.title, status: x.status, bucket: classifyBucket(x.status, x.category) }; }) });
        });
      });
    });
    return out.sort(function (a, b) { return b.mine - a.mine || ES_ORDER.indexOf(a.bucket) - ES_ORDER.indexOf(b.bucket); });
  }
  function bColor(b) { var x = MX_BUCKETS.find(function (g) { return g.id === b; }); return x ? x.color : '#d1d5db'; }
  function blocksHtml(blocks, unitsMax) {
    return blocks.map(function (bl) {
      var units = Math.max(1, bl.subs.length), i = SB_REFS.push(bl) - 1;
      var tip = bl.st.key + ' · ' + bl.st.status + ' · ' + bl.st.title + (bl.mine ? '' : '\n(история другого исполнителя)') +
        (bl.subs.length ? '\n' + bl.subs.map(function (x) { return '  ' + x.key + ' · ' + x.status + ' · ' + x.title; }).join('\n') : '');
      return '<span class="sb' + (bl.mine ? '' : ' other') + '" data-sb="' + i + '" style="flex:0 0 ' + (100 * units / unitsMax).toFixed(2) + '%" title="' + esc(tip) + '">' +
        '<i class="sb-st" style="background:' + bColor(bl.bucket) + '"></i><span class="sb-subs">' +
        bl.subs.map(function (x) { return '<i style="background:' + bColor(x.bucket) + '"></i>'; }).join('') + '</span></span>';
    }).join('');
  }
  function offHtml(r, unitsMax, idx) {
    return r.off.map(function (it) {
      return '<span class="sb off" data-off="' + idx + '" style="flex:0 0 ' + (100 / unitsMax).toFixed(2) + '%" title="' +
        esc(it.key + ' · ' + it.status + ' · ' + it.title + '\nклик — задачи вне спринта') + '"><i class="sb-st" style="background:' + bColor(it.bucket) + '"></i></span>';
    }).join('');
  }

  function memberMatrixHtml(t) {
    var rows = memberRows(t);
    if (!rows.length) return '<div class="ops-empty">В спринте нет задач.</div>';
    rows.forEach(function (r) { r.blocks = sprintBlocks(t, r.name); });
    var unitsIn = Math.max(1, Math.max.apply(null, rows.map(function (r) { return r.blocks.reduce(function (a, b) { return a + Math.max(1, b.subs.length); }, 0); })));
    var unitsOff = Math.max(1, Math.max.apply(null, rows.map(function (r) { return r.off.length; })));
    var hasOff = !!(t.output && t.output.offboard);
    var line = function (r) {
      var name = esc(r.name === 'Не назначен' ? r.name : shortName(r.name));
      if (r.row) { MEMBER_REFS.push({ team: t, row: r.row, m: outputModel(t) }); name = '<button type="button" class="mname" data-member="' + (MEMBER_REFS.length - 1) + '" title="' + esc(r.name) + ' — метрики и задачи за спринт">' + name + '</button>'; }
      var offIdx = OFF_REFS.push({ team: t, name: r.name, items: r.off }) - 1;
      return '<div class="mx-row"><span class="mx-name">' + (r.ext ? '<span class="ext">[EXT]</span> ' : '') + name + '</span>' +
        '<span class="sbs">' + blocksHtml(r.blocks, unitsIn) + '</span>' +
        (hasOff ? '<span class="sbs">' + offHtml(r, unitsOff, offIdx) + '</span>' : '') + '</div>';
    };
    var none = rows.filter(function (r) { return r.name === 'Не назначен'; });
    var team = rows.filter(function (r) { return !r.ext && r.name !== 'Не назначен'; }), ext = rows.filter(function (r) { return r.ext; });
    return '<div class="mx-grid' + (hasOff ? '' : ' nooff') + (rows.length > 11 ? ' tight' : '') + '">' +
      '<div class="mx-row mx-head"><span></span><span>В спринте</span>' + (hasOff ? '<span>Вне спринта</span>' : '') + '</div>' +
      team.map(line).join('') +
      (ext.length ? '<div class="mx-sep">[EXT] — на доске, но не в составе команды</div>' + ext.map(line).join('') : '') +
      none.map(line).join('') + '</div>';
  }

  // Задачи участника вне доски: другие проекты за период спринта, с активностью
  function openOffboard(ref) { showPanel(function () { renderOffboard(ref); }); }
  function renderOffboard(ref) {
    var t = ref.team, off = (t.output || {}).offboard || {};
    if (team.slug !== t.slug) switchTeam(t.slug);
    stackTitle.parentNode.removeAttribute('data-ctx');
    stackKey.textContent = 'Вне доски · ' + t.team + ' · с ' + ddmm(off.since);
    stackTitle.textContent = ref.name;
    scopeBtn.hidden = true; scopeEpic = null;
    storiesLabel.textContent = 'Что человек двигал в JIRA с начала спринта, кроме задач спринта';
    storiesBody.innerHTML = ref.items.length ? ref.items.map(function (it) {
      var hist = (it.history || []).map(function (h) { return '<div class="of-h">' + ddmm(h.at) + ' ' + esc(h.from || '—') + ' → <b>' + esc(h.to || '—') + '</b>' + (h.by ? ' · ' + esc(shortName(h.by)) : '') + '</div>'; }).join('');
      var com = (it.comments || []).map(function (c) { return '<div class="of-c"><span>' + ddmm(c.at) + (c.by ? ' · ' + esc(shortName(c.by)) : '') + '</span> ' + esc(clip(c.body, 260)) + '</div>'; }).join('');
      return '<div class="es-row ' + (it.bucket === 'done' ? 'stat-green' : 'stat-yellow') + '"><div class="es-top"><span class="es-title">' + esc(it.title) + '</span>' +
        '<span class="es-pct">' + (it.doneAt ? 'закрыта ' + ddmm(it.doneAt) : esc(it.status)) + '</span></div>' +
        '<div class="es-meta">' + keyLink(it.key) + ' · ' + esc(it.project || '') + (it.type ? ' · ' + esc(it.type) : '') + '</div>' + hist + com + '</div>';
    }).join('') : '<div class="sidebar-empty">Задач вне доски за период нет.</div>';
    openPanel();
  }

  // Сгорание спринта для бизнеса: идеальная линия идёт только по рабочим дням (в
  // выходные — полка), пунктир — объём спринта (видно, сколько добавили по ходу),
  // красная — сколько осталось, вертикаль — день сбора, справа — итог крупно.
  // part: 'all' — все задачи; 'story' — без подзадач (поля storyScope/storyClosed).
  function bizBurnChart(t, part, box) {
    var b = t.burndown || {}, days = b.days || [];
    if (!days.length) return '<div class="ops-empty">Нет данных по спринту.</div>';
    if (part === 'story' && !days.some(function (d) { return typeof d.storyScope === 'number'; })) {
      return '<div class="ops-empty">Сборщик не отдал сгорание без подзадач (нужна версия 1.10.0) — пересоберите данные.</div>';
    }
    var get = function (d) {
      return part === 'story' ? { scope: d.storyScope || 0, closed: d.storyClosed || 0 } : { scope: d.scope, closed: d.closed };
    };
    var W = box.W, H = box.H, padL = 30, padR = 64, padT = 12, padB = 22;
    var vals = days.map(get);
    var maxY = Math.max.apply(null, vals.map(function (v) { return v.scope; })) || 1;
    var xOf = function (i) { return padL + (W - padL - padR) * (days.length > 1 ? i / (days.length - 1) : 0); };
    var yOf = function (v) { return padT + (H - padT - padB) * (1 - v / maxY); };
    var parts = [], step = (W - padL - padR) / Math.max(1, days.length - 1);
    days.forEach(function (d, i) {
      if (d.weekend) parts.push('<rect x="' + (xOf(i) - step / 2).toFixed(1) + '" y="' + padT + '" width="' + step.toFixed(1) + '" height="' + (H - padT - padB) + '" fill="#f1f1f1"/>');
    });
    [0, Math.round(maxY / 2), maxY].forEach(function (v) {
      parts.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yOf(v).toFixed(1) + '" y2="' + yOf(v).toFixed(1) + '" stroke="#e5e7eb"/>' +
        '<text x="' + (padL - 5) + '" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="11" fill="#888" text-anchor="end">' + v + '</text>');
    });
    // идеальная: от объёма на старте до нуля, убывает только в рабочие дни
    var work = days.filter(function (d) { return !d.weekend; }).length || 1, start = vals[0].scope, passed = 0;
    var ideal = days.map(function (d, i) {
      if (!d.weekend && i > 0) passed++;
      return [xOf(i), yOf(Math.max(0, start * (1 - passed / Math.max(1, work - 1))))];
    });
    parts.push('<path d="' + ideal.map(function (p, i) { return (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1); }).join(' ') +
      '" fill="none" stroke="#9ca3af" stroke-width="2"/>');
    var past = days.map(function (d, i) { return i; }).filter(function (i) { return !days[i].future; });
    if (past.length) {
      var line = function (f, attrs) {
        return '<path d="' + past.map(function (i, j) { return (j ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(f(vals[i])).toFixed(1); }).join(' ') + '" fill="none" ' + attrs + '/>';
      };
      parts.push(line(function (v) { return v.scope; }, 'stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"'));
      parts.push(line(function (v) { return v.scope - v.closed; }, 'stroke="#dc2626" stroke-width="2.4"'));
      past.forEach(function (i) {
        var v = vals[i];
        parts.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(v.scope - v.closed).toFixed(1) + '" r="2.6" fill="#dc2626"><title>' +
          esc(ddmm(days[i].date) + ': осталось ' + (v.scope - v.closed) + ' из ' + v.scope + ', закрыто ' + v.closed) + '</title></circle>');
      });
      var li = past[past.length - 1], lv = vals[li];
      parts.push('<line x1="' + xOf(li).toFixed(1) + '" x2="' + xOf(li).toFixed(1) + '" y1="' + padT + '" y2="' + (H - padB) + '" stroke="#111" stroke-dasharray="2 3" stroke-opacity=".5"/>');
      parts.push('<text x="' + (W - padR + 8) + '" y="' + (yOf(lv.scope - lv.closed) + 2).toFixed(1) + '" font-size="18" font-weight="700" fill="#dc2626">' + (lv.scope - lv.closed) + '</text>' +
        '<text x="' + (W - padR + 8) + '" y="' + (yOf(lv.scope - lv.closed) + 16).toFixed(1) + '" font-size="10.5" fill="#666">из ' + lv.scope + '</text>');
    }
    parts.push('<text x="' + padL + '" y="' + (H - 6) + '" font-size="11" fill="#888">' + ddmm(b.start) + '</text>' +
      '<text x="' + (W - padR) + '" y="' + (H - 6) + '" font-size="11" fill="#888" text-anchor="end">' + ddmm(b.end) + '</text>');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + parts.join('') + '</svg>';
  }

  function opsSlide(t) {
    var m = outputModel(t);
    var box = { W: 560, H: 200 };
    // сверху — производительность за 3 спринта и одно сгорание (клик — из чего построено),
    // снизу — участники; без подписей и легенд: расшифровка — по наведению и в сайдбарах
    var perf = '<div><div class="ops-h">Производительность за 3 спринта</div>' +
      '<div class="ops-chart">' + (m ? teamOutputChart(m, box) : withTeam(t, function () { return withChartBox(box, velocityChart); })) + '</div></div>';
    var part = burnPart(t);
    var burn = '<div class="burn-click" data-burn="' + esc(t.slug) + '" title="Из чего построено сгорание: по дням и по задачам' +
      (part === 'story' ? ' (без подзадач)' : '') + '">' +
      '<div class="ops-h">Сгорание спринта</div><div class="ops-chart">' + bizBurnChart(t, part, box) + '</div></div>';
    return slide('ops', '<div class="ops-tag">' + esc(t.team) + ' · операционный отчёт</div><div class="ops2b">' + perf + burn + '</div>' +
