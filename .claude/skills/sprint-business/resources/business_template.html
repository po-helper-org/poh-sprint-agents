  // KR: тот же «Весь эпик», что в отчёте PO — когда будет выполнен, на чём прогноз,
  // что сделано и что осталось
  // Клик по строке-направлению: «Истории спринта» — каждая со статусом, «что сделано»
  // и след. шагом (клик — активность истории); «Весь эпик» — сгорание и объём эпика.
  // ---------- навигация сайдбаров: «← Назад» к прошлому экрану ----------
  var PANEL_HIST = [], PANEL_CUR = null;
  var panelBack = document.createElement('button');
  panelBack.type = 'button'; panelBack.className = 'panel-back'; panelBack.textContent = '← Назад'; panelBack.hidden = true;
  document.querySelector('#panelStack .stack-head').insertBefore(panelBack, document.getElementById('stackKey'));
  // id — экран того же вида (вкладки участника) заменяет текущий, а не копится в истории
  function showPanel(render, id) {
    var open = panelStack.classList.contains('open');
    if (PANEL_CUR && open && !(id && PANEL_CUR.id === id)) PANEL_HIST.push(PANEL_CUR);
    if (!open) PANEL_HIST = [];
    PANEL_CUR = { render: render, id: id || null };
    kmenu.hidden = true;
    panelStack.classList.remove('wide');
    render();
    panelBack.hidden = !PANEL_HIST.length;
  }
  panelBack.addEventListener('click', function () {
    if (!PANEL_HIST.length) return;
    PANEL_CUR = PANEL_HIST.pop();
    panelStack.classList.remove('wide');
    PANEL_CUR.render();
    panelBack.hidden = !PANEL_HIST.length;
  });
  var closePanelsBase = closePanels;
  closePanels = function () { PANEL_HIST = []; PANEL_CUR = null; panelBack.hidden = true; panelStack.classList.remove('wide'); closePanelsBase(); };
  var openMemberBase = openMember;
  openMember = function (ref, idx) {
    showPanel(function () {
      openMemberBase(ref, idx);
      var r = memberRows(ref.team).find(function (x) { return x.name === ref.row.name; });
      if (r) storiesBody.insertAdjacentHTML('afterbegin', memberKpis(r));
    }, 'member:' + ref.row.name);
  };
  // SP, задачи и подзадачи план/факт и lead time, вне доски — над задачами участника
  function memberKpis(r) {
    var k = function (v, l, tip) { return '<div class="ck"' + (tip ? ' title="' + esc(tip) + '"' : '') + '><b>' + v + '</b><span>' + l + '</span></div>'; };
    var pf = function (list) { return list.length + ' <small>/ ' + list.filter(function (x) { return x.bucket === 'done'; }).length + '</small>'; };
    var lt = function (v) { return v === null ? '—' : fmtNum(v) + ' <small>дн.</small>'; };
    var offDone = r.off.filter(function (x) { return x.bucket === 'done'; }).length;
    return '<div class="ckpis mkpis">' +
      k(r.sp ? fmtNum(r.sp.plan) + ' <small>/ ' + fmtNum(r.sp.fact) + '</small>' : '—', 'SP план / факт', 'Story Points текущего спринта: взято / сделано') +
      k(pf(r.items), 'задачи план / факт') + k(lt(r.lt.items), 'LT задач', 'медиана lead time закрытых задач') +
      k(pf(r.subs), 'подзадачи план / факт') + k(lt(r.lt.subs), 'LT подзадач', 'медиана lead time закрытых подзадач') +
      k(r.off.length + ' <small>/ ' + offDone + '</small>', 'вне спринта', 'задачи вне спринта за период: всего / закрыто') + '</div>';
  }

  // ---------- ключ задачи: JIRA в браузере или JIRA-native (виджет) ----------
  function nativeUrl(key) {
    var tpl = biz(team).jiraNative || TEAMS.map(function (t) { return biz(t).jiraNative; }).filter(Boolean)[0];
    return tpl ? tpl.replace('{key}', encodeURIComponent(key)) : '';
  }
  function keyLink(key) { return '<span class="klink" data-klink="' + esc(key) + '" tabindex="0">' + esc(key) + '</span>'; }
  var kmenu = document.createElement('div');
  kmenu.className = 'kmenu'; kmenu.hidden = true;
  document.body.appendChild(kmenu);
  var kmenuTimer = null;
  function showKmenu(el) {
    var key = el.dataset.klink, nat = nativeUrl(key), r = el.getBoundingClientRect();
    kmenu.innerHTML = '<div class="km-key">' + esc(key) + '</div><a href="' + esc(jiraUrl(key)) + '" target="_blank" rel="noopener">JIRA — в браузере</a>' +
      (nat ? '<a href="' + esc(nat) + '" target="_blank" rel="noopener">JIRA-native — виджет</a>'
           : '<span class="km-off" title="Адрес виджета не задан: jiraNative в бизнес-блоке">JIRA-native — не настроен</span>');
    kmenu.style.left = Math.max(4, Math.min(innerWidth - 230, r.left)) + 'px';
    kmenu.style.top = Math.min(innerHeight - 90, r.bottom + 4) + 'px';

  }
  document.addEventListener('mouseover', function (e) {

  });
  document.addEventListener('click', function (e) {
    var el = e.target.closest && e.target.closest('[data-klink]');
    if (el) { e.preventDefault(); e.stopPropagation(); showKmenu(el); return; }
    if (!(e.target.closest && e.target.closest('.kmenu'))) kmenu.hidden = true;
  }, true);

  // ---------- блокаторы направления: что блокирует, исполнитель, кто эскалирует ----------
  function openBlockers(ref) { showPanel(function () { renderBlockers(ref); }); }
  function renderBlockers(ref) {
    var t = ref.team, s = ref.stream;
    if (team.slug !== t.slug) switchTeam(t.slug);
    setStackHead(s.epic);
    stackKey.textContent = 'Блокаторы · ' + streamName(s);
    stackTitle.textContent = s.blocked.length + ' ' + plural(s.blocked.length, 'задача заблокирована', 'задачи заблокированы', 'задач заблокировано');
    scopeBtn.hidden = true; scopeEpic = null; storiesLabel.textContent = '';
    var owner = biz(t).escalation || 'PO команды';
    storiesBody.innerHTML = s.blocked.map(function (r, i) {
      var ai = (biz(t).rows || {})[r.st.key] || {}, age = ageAtCollect(t, r.st.statusChanged);
      var com = storyEvents(r.st).filter(function (e) { return e.kind === 'comment' && e.body; }).slice(-2);
      return '<div class="bl-card now"><div class="es-top"><span class="es-title">' + esc(r.st.title) + '</span>' +
        '<span class="es-pct">' + (age !== null ? age + ' дн.' : '') + '</span></div>' +
        '<div class="es-meta">' + keyLink(r.st.key) + ' · «' + esc(r.st.status) + '» с ' + ddmm(r.st.statusChanged) + '</div>' +
        '<div class="bl-why"><b>Блокер:</b> ' + esc(r.blocker || 'причина не записана — см. комментарии') + '</div>' +
        '<div class="bl-who"><span><b>Исполнитель:</b> ' + esc(r.st.assignee ? shortName(r.st.assignee) : 'не назначен') + '</span>' +
          '<span><b>Эскалирует:</b> ' + esc(ai.escalate || owner) + '</span></div>' +
        (com.length ? '<div class="bl-com">' + com.map(function (e) { return '<div><span>' + ddmm(e.at) + (e.by ? ' · ' + esc(shortName(e.by)) : '') + '</span> ' + esc(clip(e.body, 240)) + '</div>'; }).join('') + '</div>' : '') +
        cboxHtml(r.target, 'Комментарий: блок снят, сменить статус, кому эскалировать…') +
        '<button type="button" class="bl-open" data-i="' + i + '">Активность ›</button></div>';
    }).join('');
    storiesBody.querySelectorAll('.bl-open').forEach(function (b) {
      b.addEventListener('click', function () { openStory({ team: t, epic: s.epic, story: s.blocked[+b.dataset.i].st }); });
    });
    openPanel();
  }

  // «Весь эпик»: перед «Что осталось» — что закрыли в этом спринте и как из этого вышло «(+n%)»
  function addIterationSection(t, epic) {
    var ic = iterationClosed(t, epic), left = storiesBody.querySelector('.scope-sec[data-sec="left"]');
    if (ic.pct === null || !left) return;
    var counts = commentCounts().byKey;
    var how = document.createElement('div');
    how.className = 'iter-how';
    how.innerHTML = '<b>+' + ic.pct + '%</b> = закрыто в этом спринте ' + ic.items.length + ' ' +
      plural(ic.items.length, 'задача', 'задачи', 'задач') + ' ÷ ' + ic.total + ' в эпике. Считаются задачи эпика в статусе «готово» ' +
      'с датой закрытия с ' + ddmm(ic.start) + ' — начала спринта' +
      (ic.undated ? '; закрытые без даты закрытия (' + ic.undated + ') не учтены' : '') + '.';
    var closedAt = function (it) { return '<span class="chip-sprint now" title="Дата закрытия">закрыта ' + ddmm(it.doneAt.slice(0, 10)) + '</span>'; };
    var nodes = [how].concat(ic.items.slice().sort(function (a, b) { return a.doneAt < b.doneAt ? 1 : -1; })
      .map(function (it) { return storyNode(it, epic, counts, closedAt); }));
    left.parentNode.insertBefore(scopeSection('iter', 'Что сделали за эту итерацию (+' + ic.pct + '%)', ic.items.length, nodes, true), left);
    var sub = storiesBody.querySelector('.scope-sum .sub');
    if (sub) sub.textContent += ' · +' + ic.pct + '% за этот спринт';
  }

  // ---------- комментарий к задаче прямо в сайдбаре ----------
  // Та же корзина, что по правому клику: заметка с привязкой к задаче уходит ИИ-агенту отчёта —
  // сменить статус, привязать к эпику, снять блок, дать команду двигаться дальше.
  function cboxListHtml(key) {
    return loadComments().filter(function (c) { return c.target && c.target.key === key; }).map(function (c) {
      return '<div class="cbox-item"><span class="cbox-at">' + ddmm(String(c.at || '').slice(0, 10)) + '</span><span class="cbox-t">' + esc(c.text) + '</span>' +
        '<button type="button" class="cbox-del" data-cid="' + esc(c.id) + '" title="Удалить комментарий" aria-label="Удалить">×</button></div>';
    }).join('');
  }
  function cboxHtml(target, hint) {
    return '<div class="cbox" data-key="' + esc(target.key) + '" data-cbox="' + ctxId(target) + '">' +
      '<div class="cbox-list">' + cboxListHtml(target.key) + '</div><div class="cbox-row">' +
      '<textarea class="cbox-text" rows="1" placeholder="' + esc(hint || 'Комментарий к ' + target.key + ': сменить статус, привязать к эпику…') + '"></textarea>' +
      '<button type="button" class="cbox-add">Добавить</button></div></div>';
  }
  function cboxSubmit(box) {
    var ta = box.querySelector('.cbox-text');
    if (!addComment(ctxTargets[box.dataset.cbox], ta.value)) return;
    ta.value = '';
    box.querySelector('.cbox-list').innerHTML = cboxListHtml(box.dataset.key);
  }
  document.addEventListener('click', function (e) {
    var add = e.target.closest && e.target.closest('.cbox-add'), del = e.target.closest && e.target.closest('.cbox-del');
    if (!add && !del) return;
    e.stopPropagation();
    var box = (add || del).closest('.cbox');
    if (add) { cboxSubmit(box); return; }
    removeComment(del.dataset.cid);
    box.querySelector('.cbox-list').innerHTML = cboxListHtml(box.dataset.key);
  }, true);
  document.addEventListener('keydown', function (e) {
    var ta = e.target.closest && e.target.closest('.cbox-text');
    if (!ta) return;
    if (e.key === 'Escape') { e.stopPropagation(); ta.blur(); return; }   // Esc в поле не закрывает сайдбар
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cboxSubmit(ta.closest('.cbox')); }
  }, true);

  // ---------- направление: задачи спринта по статусам, активность — на том же экране ----------
  var ES_ORDER = ['blocked', 'progress', 'review', 'testing', 'open', 'done'];
  function openEpic(ref, tab) {
    var state = { filter: 'all', open: null, tab: tab || null };
    showPanel(function () { renderEpic(ref, state); });
  }
  function renderEpic(ref, state) {
    if (team.slug !== ref.team.slug) switchTeam(ref.team.slug);
    var epic = ref.epic, s = ref.stream;
    setStackHead(epic);
    if (epic.epicKey) stackKey.innerHTML = keyLink(epic.epicKey);
    scopeEpic = epic.epicKey ? epic : null;
    scopeBtn.hidden = true;
    storiesLabel.textContent = streamName(s);
    var tabs = [{ id: 'sprint', label: 'Задачи спринта', n: s.rows.length }];
    if (epic.epicKey) tabs.push({ id: 'scope', label: 'Весь эпик', n: (epic.scope || []).length });
    sideTabs(tabs, state.tab || 'sprint', function (id, body) {
      state.tab = id;
      panelStack.classList.toggle('wide', id === 'sprint');
      if (id === 'scope') {
        if (!epic.scope) { body.innerHTML = '<div class="sidebar-empty">Объёма эпика в данных нет (params.epic_scope).</div>'; return; }
        var keep = storiesBody;            // renderScope рисует в storiesBody — подменяем на вкладку
        storiesBody = body;
        try { renderScope(epic); addIterationSection(ref.team, epic); } finally { storiesBody = keep; }
        return;
      }
      // слева — задачи спринта по статусам, справа — выбранная задача целиком
      var label = {};
      BUCKETS.forEach(function (b) { label[b.id] = b.label; });
      var rows = s.rows.map(function (r, i) { return { r: r, i: i }; })
        .sort(function (a, b) { return ES_ORDER.indexOf(a.r.r.bucket) - ES_ORDER.indexOf(b.r.r.bucket); });
      if (!state.open) {
        var first = rows.find(function (x) { return x.r.r.bucket !== 'done'; }) || rows[0];
        state.open = first ? first.r.st.key : '';
      }
      var groups = ES_ORDER.filter(function (b) { return rows.some(function (x) { return x.r.r.bucket === b; }); });
      var list = groups.map(function (b) {
        var items = rows.filter(function (x) { return x.r.r.bucket === b; });
        return '<div class="kl-group b-' + b + '"><div class="kl-head">' + esc(label[b] || b) + ' · ' + items.length + '</div>' +
          items.map(function (x) {
            var r = x.r;
            return '<button type="button" class="kl-item ' + r.r.cls + (state.open === r.st.key ? ' on' : '') + '" data-i="' + x.i + '">' +
              '<span class="kl-title">' + esc(cleanTitle(r.st.title)) + '</span>' +
              '<span class="kl-meta">' + esc(r.st.key) + (r.st.assignee ? ' · ' + esc(shortName(r.st.assignee)) : '') + '<b>' + r.r.pct + '%</b></span></button>';
          }).join('') + '</div>';
      }).join('');
      var cur = rows.find(function (x) { return x.r.st.key === state.open; });
      var detail = cur ? (function (r) {
        var ev = withTeam(ref.team, function () { return storyEvents(r.st); });
        return '<div class="kd-head"><div class="kd-title">' + esc(r.st.title) + '</div>' +
          '<div class="kd-meta">' + keyLink(r.st.key) + ' · ' + esc(r.st.status) + (r.st.assignee ? ' · ' + esc(shortName(r.st.assignee)) : '') +
            ' · ' + r.r.flag + r.r.pct + '%</div></div>' +
          '<div class="kd-text">' + esc(r.done) + '</div>' +
          (r.next ? '<div class="ln"><span class="lbl">Дальше:</span> ' + esc(r.next) + '</div>' : '') +
          (r.blocker ? '<div class="ln ln-blk"><span class="lbl">Блокер:</span> ' + esc(r.blocker) + '</div>' : '') +
          cboxHtml(r.target) +
          '<div class="kd-act">' + withTeam(ref.team, function () { return storyCalendar(r.st, ev) + storyFeedHtml(r.st, ev); }) + '</div>';
      })(cur.r) : '<div class="sidebar-empty">Выберите задачу слева.</div>';
      body.innerHTML = '<div class="kr2"><div class="kr-list">' + list + '</div><div class="kr-detail">' + detail + '</div></div>';
      body.querySelectorAll('.kl-item').forEach(function (b) {
        b.addEventListener('click', function () {
          state.open = s.rows[+b.dataset.i].st.key;
          renderEpic(ref, state);
        });
      });
    });
    openPanel();
  }

  // ---------- история: календарь активности за всё время и хронология ----------
  // Сверху полоса времени: статус истории по дням (цветом бакета), события подзадач
  // (закрытие — зелёным), комментарии. Ниже — лента по хронологии, фильтр: все /
  // история / подзадачи. Данные — story.events сборщика 1.7.0 (нет — лента спринта).
  function storyEvents(st) {
    if (st.events && st.events.length) return st.events;
    return ((LOGS && LOGS.events) || []).filter(function (e) {
      return e.key === st.key || (st.subtasks || []).some(function (s) { return s.key === e.key; });
    }).map(function (e) {
      return { at: e.at.slice(0, 16), kind: e.kind, key: e.key, by: e.author, from: e.from, to: e.to, body: e.body,
               done: e.kind === 'status' && classifyBucket(e.to, e.toCat) === 'done' };
    }).sort(function (a, b) { return a.at < b.at ? -1 : 1; });
  }

  function storyCalendar(st, events) {
    if (!events.length) return '';
    var ms = function (at) { return new Date(at.length > 10 ? at : at + 'T12:00').getTime(); };
    var nowAt = ((team._meta && team._meta.collectedAt) || new Date().toISOString()).slice(0, 16);
    var t0 = ms(events[0].at), t1 = Math.max(ms(nowAt), ms(events[events.length - 1].at));
    if (t1 - t0 < 86400000) t1 = t0 + 86400000;
    var W = 760, padL = 84, padR = 12, top = 18, lane = 22, H = top + lane * 3 + 22;
    var xOf = function (at) { return padL + (W - padL - padR) * (ms(at) - t0) / (t1 - t0); };
    var yOf = function (i) { return top + lane * i + lane / 2; };
    var parts = [];
    ['История', 'Подзадачи', 'Комментарии'].forEach(function (name, i) {
      parts.push('<text x="0" y="' + (yOf(i) + 4) + '" font-size="11" fill="#888">' + name + '</text>');
      parts.push('<line x1="' + padL + '" x2="' + (W - padR) + '" y1="' + yOf(i) + '" y2="' + yOf(i) + '" stroke="#eee"/>');
    });
    // недели — засечки и даты
    var step = 7 * 86400000, firstTick = t0 + ((7 - new Date(t0).getDay() + 1) % 7) * 86400000;
    if ((t1 - t0) / step > 10) step = 14 * 86400000;
    for (var t = firstTick; t <= t1; t += step) {
      var x = padL + (W - padL - padR) * (t - t0) / (t1 - t0);
      parts.push('<line x1="' + x.toFixed(1) + '" x2="' + x.toFixed(1) + '" y1="' + (top - 4) + '" y2="' + (H - 22) + '" stroke="#f0f0f0"/>');
      parts.push('<text x="' + x.toFixed(1) + '" y="' + (H - 8) + '" font-size="10" fill="#888" text-anchor="middle">' + ddmm(isoDay(new Date(t))) + '</text>');
    }
    // начало спринта
    var sprintStart = (LOGS && LOGS.since) || (team.burndown && team.burndown.start);
    if (sprintStart && ms(sprintStart) > t0) {
      var sx = xOf(sprintStart).toFixed(1);
      parts.push('<line x1="' + sx + '" x2="' + sx + '" y1="' + (top - 10) + '" y2="' + (H - 22) + '" stroke="#9ca3af" stroke-dasharray="3 3"/>');
      parts.push('<text x="' + (+sx + 4) + '" y="' + (top - 10) + '" font-size="10" fill="#888">спринт</text>');
    }
    // статус истории по времени — цветная полоса
    var mine = events.filter(function (e) { return e.key === st.key && e.kind === 'status'; });
    var cur = { at: events[0].at, to: 'Бэклог' }, segs = [];
    mine.forEach(function (e) { segs.push({ from: cur.at, to: e.at, status: cur.to }); cur = { at: e.at, to: e.to }; });
    segs.push({ from: cur.at, to: nowAt, status: cur.to });
    segs.forEach(function (g) {
      var x0 = xOf(g.from), x1 = Math.max(x0 + 2, xOf(g.to));
      parts.push('<rect x="' + x0.toFixed(1) + '" y="' + (yOf(0) - 7) + '" width="' + (x1 - x0).toFixed(1) + '" height="14" rx="2" fill="' +
        BUCKET_COLOR[classifyBucket(g.status, '')] + '" opacity=".85"><title>' + esc(g.status + ': ' + ddmm(g.from.slice(0, 10)) + ' — ' + ddmm(g.to.slice(0, 10))) + '</title></rect>');
    });
    var subTitle = {};
    (st.subtasks || []).forEach(function (sb) { subTitle[sb.key] = sb.summary || sb.title || ''; });
    events.forEach(function (e) {
      var x = xOf(e.at).toFixed(1), when = e.at.slice(8, 10) + '.' + e.at.slice(5, 7) + ' ' + e.at.slice(11, 16);
      var who = e.key === st.key ? '' : e.key + ' ' + (subTitle[e.key] || '') + '\n';
      if (e.kind === 'comment') {
        parts.push('<rect x="' + (x - 4) + '" y="' + (yOf(2) - 4) + '" width="8" height="8" rx="1.5" fill="' + (e.key === st.key ? '#555' : '#9ca3af') + '"><title>' +
          esc(when + ' · ' + (e.by || '') + '\n' + who + (e.body || '')) + '</title></rect>');
      } else if (e.key !== st.key) {
        var b = e.kind === 'created' ? null : classifyBucket(e.to, '');
        parts.push('<circle cx="' + x + '" cy="' + yOf(1) + '" r="' + (e.done ? 5.5 : 3.5) + '" fill="' + (e.kind === 'created' ? '#fff' : BUCKET_COLOR[b]) +
          '" stroke="' + (e.kind === 'created' ? '#9ca3af' : (e.done ? '#15803d' : '#fff')) + '" stroke-width="1.4"><title>' +
          esc(when + ' · ' + who + (e.kind === 'created' ? 'создана' : (e.from || '—') + ' → ' + e.to + (e.done ? ' · закрыта' : '')) + (e.by ? ' · ' + e.by : '')) + '</title></circle>');
      } else if (e.kind === 'status') {
        parts.push('<line x1="' + x + '" x2="' + x + '" y1="' + (yOf(0) - 10) + '" y2="' + (yOf(0) + 10) + '" stroke="#111" stroke-width="1.2"><title>' +
          esc(when + ' · ' + (e.from || '—') + ' → ' + e.to + (e.by ? ' · ' + e.by : '')) + '</title></line>');
      }
    });
    // без легенды: строки подписаны, что значит точка или отрезок — в подсказке при наведении
    return '<div class="sc"><svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' + parts.join('') + '</svg></div>';
  }

  function storyFeedHtml(st, list) {
    if (!list.length) return '<div class="sidebar-empty">Событий нет.</div>';
    var subTitle = {};
    (st.subtasks || []).forEach(function (sb) { subTitle[sb.key] = sb.summary || sb.title || ''; });
    var html = '<ol class="sf">', last = null;
    var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
    list.forEach(function (e) {
      var day = e.at.slice(0, 10), first = day !== last;
      last = day;
      var what = e.kind === 'comment' ? '<span class="sf-c">«' + esc(e.body || '') + '»</span>'
        : e.kind === 'created' ? '<span class="sf-verb">создана</span>'
        : '<span class="status from">' + esc(e.from || '—') + '</span><span class="arrow">→</span><span class="status ' + bucketClass(e.to, '') + '">' +
          esc(e.to) + '</span>' + (e.done && e.key !== st.key ? '<span class="sf-done">закрыта</span>' : '');
      html += '<li class="sf-item' + (first ? ' day' : '') + '"><span class="sf-day" title="' + esc(dayLabel(e.at)) + '">' +
        (first ? parseInt(day.slice(8, 10), 10) + ' ' + MON[parseInt(day.slice(5, 7), 10) - 1] : '') + '</span><span class="sf-time">' + esc(e.at.slice(11, 16)) + '</span>' +
        '<span class="sf-main">' + (e.key !== st.key ? '<span class="sf-sub" title="' + esc(e.key) + '">' + esc(subTitle[e.key] || e.key) + '</span>' : '') +
        '<span class="sf-what">' + what + '</span></span><span class="sf-by" title="' + esc(e.by || '') + '">' + esc(initials(e.by || '—')) + '</span></li>';
    });
    return html + '</ol>';
  }

  function openStory(ref) { showPanel(function () { renderStory(ref); }); }
  function renderStory(ref) {
    if (team.slug !== ref.team.slug) switchTeam(ref.team.slug);
    var st = ref.story;
    var events = storyEvents(st);
    stackTitle.parentNode.setAttribute('data-ctx', ctxId(itemTarget('story', st, ref.epic)));
    stackKey.innerHTML = keyLink(st.key);
    stackTitle.textContent = st.title;
    scopeBtn.hidden = true;
    scopeEpic = null;
    storiesLabel.textContent = '';
    var mine = events.filter(function (e) { return e.key === st.key; });
    var ofSubs = events.filter(function (e) { return e.key !== st.key; });
    sideTabs([{ id: 'all', label: 'Все', n: events.length }, { id: 'story', label: 'История', n: mine.length },
              { id: 'subs', label: 'Подзадачи', n: ofSubs.length }], 'all', function (id, body) {
      body.innerHTML = storyFeedHtml(st, id === 'all' ? events : id === 'story' ? mine : ofSubs);
    }, storyCalendar(st, events));
    openPanel();
  }

  deckSlides.addEventListener('click', function (e) {
    if (deckEditing || e.target.closest('a')) return;
    var byTeam = function (slug) { return TEAMS.find(function (x) { return x.slug === slug; }); };
    var blk = e.target.closest('[data-blk]');
    if (blk) { e.stopPropagation(); openBlockers(deckRefs[blk.dataset.blk]); return; }
    var sb = e.target.closest('[data-sb]');
    if (sb && SB_REFS[+sb.dataset.sb]) {
      var bl = SB_REFS[+sb.dataset.sb];
      openStory({ team: byTeam(sb.closest('[data-team]').dataset.team), epic: bl.epic, story: bl.st });
      return;
    }
    var off = e.target.closest('[data-off]');
    if (off && OFF_REFS[+off.dataset.off] && OFF_REFS[+off.dataset.off].items.length) { openOffboard(OFF_REFS[+off.dataset.off]); return; }
    var burn = e.target.closest('[data-burn]');
    if (burn) { openBurn(byTeam(burn.dataset.burn)); return; }
    var ctl = e.target.closest('[data-ctl]');
    if (ctl) { openControl(TEAMS.find(function (x) { return x.slug === ctl.dataset.ctl; })); return; }
    var ini = e.target.closest('[data-init]');
    if (ini && deckRefs[ini.dataset.init]) { openEpic(deckRefs[ini.dataset.init], 'scope'); return; }
    var el = e.target.closest('[data-ref]');
    var ref = el && deckRefs[el.dataset.ref];
    if (!ref) return;
    if (ref.story) openStory(ref); else if (ref.stream) openEpic(ref);
  });

  function openDeck() {
    closePanels();
    setNotesOpen(false);
    deck.hidden = false;
    document.body.classList.add('deck-open');
    document.body.style.overflow = 'hidden';
    deck.classList.toggle('stage', STAGE_MQ.matches);
    stageIdx = 0;
    buildDeck();
    deckFeed.scrollTop = 0;
    goSlide(0, true);
    fitStage();
  }

  var stageIdx = 0;
  var STAGE_MQ = window.matchMedia('(min-width: 900px) and (min-height: 480px)');

  function isStage() { return deck.classList.contains('stage'); }

  function currentSlide() {
    if (isStage()) return stageIdx;
    var list = deckSlides.querySelectorAll('.fslide'), top = deckFeed.scrollTop + 40, idx = 0;
    list.forEach(function (s, i) { if (s.offsetTop <= top) idx = i; });
    return idx;
  }

  // слайд на всю сцену: масштаб — чтобы холст был не меньше 1280×720, размер — вся площадь
  function fitStage() {
    if (!isStage() || deck.hidden) return;
    var w = deckFeed.clientWidth, h = deckFeed.clientHeight, k = Math.max(0.2, Math.min(w / 1280, h / 720));
    deckSlides.style.setProperty('--k', k.toFixed(4));
    deckSlides.style.setProperty('--sw', (w / k).toFixed(1) + 'px');
    deckSlides.style.setProperty('--sh', (h / k).toFixed(1) + 'px');
  }

  function goSlide(i, quiet) {
    var list = deckSlides.querySelectorAll(':scope > .fslide');
    if (!list.length) return;
    i = Math.max(0, Math.min(list.length - 1, i));
    if (!isStage()) {
      if (!quiet) deckFeed.scrollTo({ top: list[i].offsetTop - 16 });
      return;
    }
    stageIdx = i;
    if (deckTip) deckTip.hidden = true;
    if (typeof kmenu !== 'undefined') kmenu.hidden = true;
    list.forEach(function (s, j) { s.classList.toggle('cur', j === i); });
    list[i].scrollTop = 0;
    document.querySelectorAll('#deckTocList a').forEach(function (a, j) { a.classList.toggle('cur', j === i); });
    document.getElementById('deckCount').textContent = (i + 1) + ' / ' + list.length;
    document.getElementById('deckPrev').disabled = i === 0;
    document.getElementById('deckNext').disabled = i === list.length - 1;
    updateScrollHint();
  }

  // Слайд выше 720 (много строк, правка текста) прокручивается внутри: колесом, ↓/пробелом
  // (сначала докрутить, потом листать) или кликом по «↓ ещё ниже» внизу сцены.
  function curSlideEl() { return isStage() ? deckSlides.querySelectorAll(':scope > .fslide')[stageIdx] || null : null; }
  function scrollInside(dir) {
    var el = curSlideEl();
    if (!el) return false;
    var max = el.scrollHeight - el.clientHeight;
    if (max <= 4) return false;
    if ((dir > 0 && el.scrollTop >= max - 4) || (dir < 0 && el.scrollTop <= 4)) return false;
    el.scrollBy({ top: dir * el.clientHeight * 0.8, behavior: 'smooth' });
    return true;
  }
  function updateScrollHint() {
    var el = curSlideEl(), hint = document.getElementById('deckMore');
    hint.hidden = !(el && el.scrollHeight - el.clientHeight - el.scrollTop > 4);
  }
  deckSlides.addEventListener('scroll', updateScrollHint, true);
  document.getElementById('deckMore').addEventListener('click', function () { scrollInside(1); });

  function setStage() {
    var on = STAGE_MQ.matches && !document.body.classList.contains('printing');
    if (on === isStage()) { fitStage(); return; }
    var at = currentSlide();
    deck.classList.toggle('stage', on);
    stageIdx = at;
    goSlide(at, !on);
    fitStage();
  }
  window.addEventListener('resize', function () { setStage(); fitStage(); });
  document.getElementById('deckPrev').addEventListener('click', function () { goSlide(currentSlide() - 1); });
  document.getElementById('deckNext').addEventListener('click', function () { goSlide(currentSlide() + 1); });
  document.getElementById('deckFull').addEventListener('click', function () {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen();
  });
  document.addEventListener('fullscreenchange', function () {
    document.getElementById('deckFull').textContent = document.fullscreenElement ? 'Выйти из полноэкранного' : 'На весь экран';
    setTimeout(fitStage, 50);
  });

  document.getElementById('deckEdit').addEventListener('click', function () { setEditing(!deckEditing); });
  document.getElementById('deckReset').addEventListener('click', function () {
    if (!window.confirm('Вернуть исходный текст на всех слайдах? Ваши правки текста пропадут.')) return;
    saveEdits({});
    buildDeck();
  });
  document.getElementById('deckTocBtn').addEventListener('click', function () {
    setToc(!document.getElementById('deckToc').classList.contains('open'));
  });
  document.getElementById('deckSideTab').addEventListener('click', function () {
    setToc(!document.getElementById('deckToc').classList.contains('open'));
  });
  // клик мимо сайдбара — закрыть его
  deckFeed.addEventListener('mousedown', function () { setToc(false); });
  document.getElementById('deckTocList').addEventListener('click', function (e) {
    var a = e.target.closest('a[data-go]');
    if (!a) return;
    e.preventDefault();
    var idx = Array.prototype.indexOf.call(a.parentNode.children, a);
    setToc(false);
    if (isStage()) { goSlide(idx); return; }
    var s = document.getElementById(a.dataset.go);
    if (s) deckFeed.scrollTo({ top: s.offsetTop - 16 });
  });
  document.getElementById('deckNotes').addEventListener('click', function () {
    setNotesOpen(!notesPanel.classList.contains('open'));
    if (notesPanel.classList.contains('open')) renderNotes();
  });
  document.getElementById('deckPrint').addEventListener('click', function () {
    setEditing(false);
    document.body.classList.add('printing');
    window.print();
  });
  window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); fitStage(); });
  document.addEventListener('keydown', function (e) {
    if (deck.hidden || !cpop.hidden) return;
    var typing = /TEXTAREA|INPUT/.test((e.target || {}).tagName || '') || (e.target && e.target.isContentEditable);
    if (e.key === 'Escape') {
      if (panelStack.classList.contains('open')) { e.stopImmediatePropagation(); closePanels(); return; }
      if (document.getElementById('deckToc').classList.contains('open')) { e.stopImmediatePropagation(); setToc(false); return; }
      if (notesPanel.classList.contains('open')) return;
      if (deckEditing) { e.stopImmediatePropagation(); if (e.target.blur) e.target.blur(); setEditing(false); return; }
      return;
    }
    if (typing || panelStack.classList.contains('open')) return;
    // ↓, пробел, PageDown на высоком слайде сначала докручивают его, потом листают; ←/→ — всегда листают
    var down = e.key === 'PageDown' || (isStage() && (e.key === 'ArrowDown' || e.key === ' '));
    var up = e.key === 'PageUp' || (isStage() && e.key === 'ArrowUp');
    if ((down && scrollInside(1)) || (up && scrollInside(-1))) { e.preventDefault(); return; }
    if (e.key === 'ArrowRight' || down) { e.preventDefault(); goSlide(currentSlide() + 1); }
    else if (e.key === 'ArrowLeft' || up) { e.preventDefault(); goSlide(currentSlide() - 1); }
    else if (isStage() && e.key === 'Home') { e.preventDefault(); goSlide(0); }
    else if (isStage() && e.key === 'End') { e.preventDefault(); goSlide(1e6); }
    else if (isStage() && (e.key === 'f' || e.key === 'F' || e.key === 'а' || e.key === 'А')) { e.preventDefault(); document.getElementById('deckFull').click(); }
  }, true);


  // метки комментариев — на слайдах
  function pageMarks() { refreshDeckMarks(); }

  function switchTeam(slug) {
    useTeam(slug);
    migrateNotes();
    fillRefList();
  }

  // «Для техлидов»: промт на технический отчёт PO — тем же данным, своим навыком
  function techPrompt() {
    var notes = allNotesLines();
    return [
      'Собери технический отчёт по спринту для синхронизации с техлидами — отчёт PO (sprint-report.html).',
      '',
      '/actual-sprint',
      '',
      'Контекст:',
      '- Период: ' + sprintLabel()
    ].concat(dataContext().map(function (l) { return '- ' + l; })).concat([
      '- Бизнес-отчёт «ФАКТ | спринт» по этим данным уже показан комитету; технический отчёт — те же цифры для техлидов:',
      '  эпики и статусы задач, сводный отчёт (burndown, производительность, Cycle Time), интерпретация ИИ по «!».',
      '',
      notes.length ? 'Вопросы и комментарии с бизнес-отчёта — разобрать с техлидами, привязать к эпикам и задачам:' : 'Комментариев с бизнес-отчёта нет.'
    ]).concat(notes).concat([
      '',
      'Выход: reports/sprint-report.html. Данные не выдумывать: только сборщики и снимок.'
    ]).join('\n');
  }
  document.getElementById('techBtn').addEventListener('click', function () {
    openGenPrompt('Промт: отчёт для техлидов', 'Скопируйте и отправьте агенту — он соберёт отчёт PO навыком /actual-sprint на тех же данных.', techPrompt());
  });

  // ------------------------- меню бургера (вместо панели колоды) -------------------------
  // Панель .deck-bar скрыта стилем has-burger; пункты меню нажимают её кнопки (логика колоды та же).
  burger.label = function () { return document.getElementById('deckTitle').textContent; };
  if (burgerBtn) document.getElementById('bmTitle').textContent = 'Бизнес-отчёт';
  burger.build = function () {
    var deck = document.getElementById('deck'), stage = deck.classList.contains('stage');
    var editing = document.getElementById('deckEdit').getAttribute('aria-pressed') === 'true';
    var n = +document.getElementById('cCount').textContent || 0;
    return bmSection(document.getElementById('deckTitle').textContent,
        bmItem('data-bm-click="' + (stage ? 'deckSideTab' : 'deckTocBtn') + '"', 'Слайды', 'оглавление колоды') +
        (stage ? bmItem('data-bm-click="deckFull"', 'На весь экран', 'клавиша F') : '')) +
      bmSection('Действия',
        bmItem('data-bm-click="deckNotes"', 'Комментарии', n ? n + ' ' + plural(n, 'заметка', 'заметки', 'заметок') + ' · правый клик по строке или слайду' : 'правый клик по строке или слайду',
          n ? '<span class="bm-n">' + n + '</span>' : null) +
        bmItem('data-bm-click="deckEdit"', editing ? 'Закончить правку текста' : 'Редактировать текст', 'правки прямо на слайдах, сохраняются в браузере') +
        (document.getElementById('deckReset').hidden ? '' : bmItem('data-bm-click="deckReset"', 'Вернуть текст', 'исходный текст на всех слайдах')) +
        bmItem('data-bm-click="techBtn"', 'Для техлидов', 'промт на технический отчёт PO') +
        bmItem('data-bm-click="deckPrint"', 'PDF', 'печать или «Сохранить как PDF», по слайду на страницу'));
  };

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  document.title = 'ФАКТ | ' + sprintLabel();
  openDeck();
  // корзина и метки — сразу при открытии: без этого после перезагрузки на кнопке
  // «Комментарии (0)», хотя всё сохранено (выглядело как сброс комментариев)
  refreshComments();
  refreshBurger();
</script>

</body>
</html>
