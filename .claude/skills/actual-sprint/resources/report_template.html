<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчёт по спринтам команд</title>
<style>
  :root {
    --fg: #111;
    --bg: #fff;
    --muted: #666;
    --line: #ddd;
    --accent: #111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  .hero {
    padding: 48px 32px 32px;
    border-bottom: 3px solid var(--fg);
  }
  .hero .team {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 32px;
    font-weight: 700;
  }
  .hero .meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--muted);
  }
  .hero .meta strong { color: var(--fg); }
  .team-switch { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; }
  .team-tab {
    font: inherit; font-size: 13px; padding: 5px 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    border-radius: 4px; cursor: pointer;
  }
  .team-tab:hover { border-color: var(--fg); color: var(--fg); }
  .team-tab.active { background: var(--fg); border-color: var(--fg); color: var(--bg); font-weight: 600; }

  .hero .board-link { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); }
  .hero .board-link:hover { border-bottom-color: var(--fg); }
  .hero .metrics-link {
    color: var(--fg);
    text-decoration: none;
    border-bottom: 1px dashed var(--muted);
    cursor: pointer;
    font-variant-numeric: tabular-nums;
  }
  .hero .metrics-link:hover { border-bottom-style: solid; border-bottom-color: var(--fg); }

  .logs-btn {
    font: inherit;
    font-size: 13px;
    padding: 6px 14px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
  }
  .logs-btn:hover { background: var(--fg); color: var(--bg); }

  /* лента изменений */
  .log-filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; flex-shrink: 0; }
  .log-chip {
    font: inherit;
    font-size: 12px;
    padding: 3px 10px;
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--muted);
    border-radius: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  .log-chip:hover { border-color: var(--fg); color: var(--fg); }
  .log-chip.active { background: var(--fg); border-color: var(--fg); color: var(--bg); }

  .log-day { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
             color: var(--muted); margin: 16px 0 6px; font-weight: 600; }
  .log-day:first-child { margin-top: 0; }

  .log-item { display: flex; gap: 10px; padding: 9px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .log-item:last-child { border-bottom: none; }
  .log-who {
    flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
    background: #f1f2f4; color: var(--muted);
    font-size: 10px; font-weight: 600; letter-spacing: 0.03em;
    display: flex; align-items: center; justify-content: center;
  }
  .log-main { min-width: 0; flex: 1; }
  .log-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .log-author { font-weight: 600; }
  .log-time { flex-shrink: 0; font-size: 11px; color: var(--muted); }
  .log-move { margin: 2px 0 3px; display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
  .log-move .arrow { color: var(--c-zero); }
  .log-issue { font-size: 12px; }
  .log-issue a { color: var(--muted); text-decoration: none; }
  .log-issue a:hover { color: var(--fg); text-decoration: underline; }
  .log-verb { color: var(--muted); font-size: 12px; }
  .log-quote {
    font-size: 12px;
    color: var(--fg);
    background: #fafafa;
    border-left: 2px solid var(--line);
    padding: 6px 9px;
    margin: 2px 0 4px;
    border-radius: 0 3px 3px 0;
  }
  .log-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  /* сводный отчёт за 3 спринта */
  .metrics-section + .metrics-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--line); }
  .metrics-section h3 {
    margin: 0 0 12px;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }
  .m-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .m-table th, .m-table td {
    padding: 7px 10px;
    border-bottom: 1px solid #eee;
    text-align: right;
    font-variant-numeric: tabular-nums;
    vertical-align: middle;
  }
  .m-table th:first-child, .m-table td:first-child { text-align: left; }
  .m-table thead th {
    border-bottom: 1px solid var(--line);
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    text-transform: none;
    letter-spacing: 0;
  }
  .m-table tbody tr:last-child td { border-bottom: none; }
  .m-table .accent { font-weight: 700; }
  .m-muted { color: var(--muted); }

  /* полоса производительности спринта */
  .bar {
    display: block;
    height: 6px;
    width: 100%;
    min-width: 90px;
    background: #eee;
    border-radius: 3px;
    overflow: hidden;
  }
  .bar > i { display: block; height: 100%; background: var(--c-done); }
  td.bar-cell { width: 130px; }

  /* диаграмма управления: точки Lead Time по спринтам */
  .chart { width: 100%; height: 190px; display: block; }
  .chart-legend { font-size: 11px; color: var(--muted); margin-top: 8px; line-height: 1.6; }
  .chart-legend .swatch {
    display: inline-block; width: 18px; height: 0; vertical-align: middle;
    border-top: 2px solid var(--c-progress); margin-right: 5px;
  }
  .chart-legend .swatch.median { border-top-style: dashed; border-top-color: var(--c-done); }
  .chart-legend .swatch.ideal { border-top-color: #9ca3af; }
  .chart-legend .swatch.actual { border-top-color: var(--c-blocked); }
  .chart-legend .swatch.limit { border-top-color: var(--c-blocked); }
  .chart-legend .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    vertical-align: middle; margin-right: 4px;
  }

  /* список задач-выбросов под диаграммой управления */
  .outliers { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .outliers-head {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--c-blocked); font-weight: 600; margin-bottom: 8px;
  }
  .outlier-row {
    display: flex; justify-content: space-between; gap: 10px;
    align-items: baseline; padding: 6px 0; font-size: 12px;
    border-bottom: 1px solid #f0f0f0;
  }
  .outlier-row:last-child { border-bottom: none; }
  .outlier-row a { color: var(--fg); text-decoration: none; }
  .outlier-row a:hover { text-decoration: underline; }

  main { padding: 32px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  thead th {
    border-bottom: 2px solid var(--fg);
    font-weight: 700;
    white-space: nowrap;
  }
  /* вся строка кликабельна — открывает панель эпика */
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: #fafafa; }
  td.epic { font-weight: 600; }
  td.epic .no-epic { color: var(--muted); }

  /* цвета бакетов статусов */
  :root {
    --c-open: #6b7280;      /* серый  — открыто/бэклог */
    --c-blocked: #dc2626;   /* красный — заблокировано */
    --c-progress: #2563eb;  /* синий  — в работе */
    --c-testing: #ca8a04;   /* жёлтый — тестирование */
    --c-review: #ea580c;    /* оранжевый — ревью */
    --c-done: #16a34a;      /* зелёный — готово */
    --c-zero: #c9ccd1;      /* нули — приглушённые */
  }

  /* агрегированные счётчики: миниатюрный текст 2/0/0/0/1/3
     ВАЖНО: класс ячейки (td.tally) и класс внутреннего бокса (.tally-box) разные.
     Одинаковое имя делало td инлайн-блоком и ломало раскладку таблицы. */
  td.tally { white-space: nowrap; width: 1%; text-align: right; padding-right: 20px; }
  .tally-box {
    position: relative;
    display: inline-block;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
    cursor: default;
  }
  .tally-box .n { font-weight: 600; }
  .tally-box .n.zero { color: var(--c-zero); font-weight: 400; }
  .tally-box .sep { color: var(--c-zero); margin: 0 1px; }
  .n.b-open { color: var(--c-open); }
  .n.b-blocked { color: var(--c-blocked); }
  .n.b-progress { color: var(--c-progress); }
  .n.b-testing { color: var(--c-testing); }
  .n.b-review { color: var(--c-review); }
  .n.b-done { color: var(--c-done); }

  /* подсказка при наведении на счётчик; якорь справа — счётчики стоят у правого края,
     при left:0 длинная подсказка уезжала за пределы экрана и обрезалась */
  .tally-box .tip {
    position: absolute;
    right: 0;
    top: calc(100% + 6px);
    z-index: 5;
    background: #111;
    color: #fff;
    font-size: 12px;
    font-weight: 400;
    letter-spacing: normal;
    line-height: 1.4;
    padding: 6px 10px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  .tally-box:hover .tip { opacity: 1; }

  td.actions { white-space: nowrap; width: 1%; }
  .action-btn {
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover { background: var(--fg); color: var(--bg); }
  .action-btn.has-note { border-color: #111; font-weight: 600; }
  .action-btn.has-note::after { content: " •"; }

  /* сайдбары: два независимых панеля, один стек едет целиком */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  /* единая панель: одна рамка, одна тень, одна кнопка закрытия.
     Внутри — две колонки (заметка + истории) без собственных теней. */
  .panel-stack {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 860px;
    max-width: 100vw;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    z-index: 11;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    pointer-events: none;
  }
  .panel-stack.open { transform: translateX(0); pointer-events: auto; }

  .stack-head {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
    flex-shrink: 0;
  }
  .stack-head .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .stack-head h2 { margin: 0 0 6px; font-size: 17px; line-height: 1.35; padding-right: 32px; }
  .stack-head a { font-size: 13px; color: var(--muted); }

  .sidebar-close {
    position: absolute;
    top: 18px;
    right: 20px;
    border: none;
    background: none;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
  }
  .sidebar-close:hover { color: var(--fg); }

  .stack-body { display: flex; flex: 1; min-height: 0; }

  .pane {
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 16px 24px 20px;
    overflow-y: auto;
  }
  #panelStories { flex: 1; }

  .pane-label {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
    flex-shrink: 0;
  }

  .sidebar-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }


  /* список историй эпика, с разворотом подзадач */
  .story-item { border-bottom: 1px solid #eee; }
  .story-item:last-child { border-bottom: none; }
  .story-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 10px 0;
    font-size: 13px;
  }
  .story-row .story-title-wrap, .sub-item .story-title-wrap { display: flex; align-items: baseline; gap: 6px; min-width: 0; flex: 1; }
  .story-row .meta-wrap, .sub-item .meta-wrap {
    display: flex;
    align-items: baseline;
    gap: 8px;
    flex-shrink: 0;
  }

  /* возраст статуса: сколько дней статус не менялся */
  .age {
    font-size: 11px;
    color: var(--muted);
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    min-width: 26px;
    text-align: right;
  }
  .age.stale { color: var(--c-blocked); font-weight: 600; }
  .age.done { color: var(--c-done); font-weight: 600; }
  .age.risk { color: var(--c-testing); font-weight: 600; }
  .outliers-head.risk { color: var(--c-testing); }

  /* инициалы исполнителя слева от задачи; полное имя — в подсказке */
  .who {
    position: relative;
    flex-shrink: 0;
    width: 30px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    color: var(--muted);
    cursor: default;
  }
  .who.none { color: var(--c-zero); font-weight: 400; }
  /* нативный title показывается с задержкой в секунду — рисуем свою подсказку */
  .who .who-tip {
    position: absolute;
    left: 0;
    top: calc(100% + 4px);
    z-index: 6;
    background: #111;
    color: #fff;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: normal;
    padding: 5px 9px;
    border-radius: 4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.12s ease;
  }
  .who:hover .who-tip { opacity: 1; }
  .sub-item .age { font-size: 10px; }
  .story-toggle {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px 0 0;
    width: 14px;
    transform: rotate(0deg);
    transition: transform 0.15s ease;
  }
  .story-toggle.open { transform: rotate(90deg); }
  .story-toggle:disabled { visibility: hidden; }
  .story-row a { color: var(--fg); text-decoration: none; }
  .story-row a:hover { text-decoration: underline; }

  /* базовый бейдж статуса — общий для историй и подзадач */
  .status {
    flex-shrink: 0;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    white-space: nowrap;
  }
  .sub-item .status { font-size: 10px; padding: 1px 6px; }
  .status.b-open { color: var(--c-open); border-color: var(--c-open); }
  .status.b-blocked { color: var(--c-blocked); border-color: var(--c-blocked); }
  .status.b-progress { color: var(--c-progress); border-color: var(--c-progress); }
  .status.b-testing { color: var(--c-testing); border-color: var(--c-testing); }
  .status.b-review { color: var(--c-review); border-color: var(--c-review); }
  .status.b-done { color: var(--c-done); border-color: var(--c-done); font-weight: 600; }

  .sub-list { display: none; padding: 0 0 10px 20px; }
  .sub-list.open { display: block; }
  .sub-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 6px 0;
    font-size: 12px;
    border-top: 1px dashed #eee;
  }
  .sub-item:first-child { border-top: none; }
  .sub-item a { color: var(--muted); text-decoration: none; flex: 1; min-width: 0; }
  .sub-item a:hover { color: var(--fg); text-decoration: underline; }

  .sidebar-empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

  /* подвал: чем и когда собраны данные команды — чтобы цифрам можно было доверять */
  .provenance {
    max-width: 1100px; margin: 32px auto 24px; padding: 10px 24px 0;
    border-top: 1px solid var(--line);
    color: var(--muted); font-size: 11px; line-height: 1.7;
  }
  .provenance .warn {
    color: #b45309; border-bottom: 1px dotted #b45309; cursor: help; margin-left: 6px;
  }

  /* Корзина заметок в правом верхнем углу — тот же приём, что на странице ревью
     БФТ (poh-bft-writer): кнопка «Комментарии (N)», под ней панель со списком
     заметок и готовым промтом для ИИ. */
  .promptbox {
    position: fixed; top: 20px; right: 24px; z-index: 9;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .pb-row { display: flex; gap: 8px; }
  .pb-toggle {
    font: inherit; font-size: 13px; padding: 6px 14px; border-radius: 4px; cursor: pointer;
    background: var(--fg); color: var(--bg); border: 1px solid var(--fg);
  }
  .pb-toggle[aria-expanded="true"] { background: var(--bg); color: var(--fg); }
  .notes-panel {
    display: none; width: 400px; max-height: calc(100vh - 90px); overflow-y: auto;
    background: var(--bg); border: 1px solid var(--fg); border-radius: 6px;
    box-shadow: 3px 3px 0 var(--line); padding: 14px;
  }
  .notes-panel.open { display: block; }
  .notes-panel h4 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted);
  }
  .notes-panel h4.sp { margin-top: 16px; }
  .nform textarea, .nedit textarea, .notes-panel .prompt {
    width: 100%; font: inherit; font-size: 13px; line-height: 1.5; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; resize: vertical;
  }
  .nform textarea, .nedit textarea { min-height: 58px; }
  .nform textarea:focus, .nedit textarea:focus, .nref:focus { outline: none; border-color: var(--fg); }
  .nref {
    width: 100%; margin-top: 6px; font: inherit; font-size: 12px; color: var(--fg);
    border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px;
  }
  .prow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .prow .hint { flex: 1; font-size: 11px; color: var(--muted); }
  .nbtn {
    font: inherit; font-size: 12px; padding: 4px 12px; border-radius: 4px; cursor: pointer;
    border: 1px solid var(--fg); background: var(--fg); color: var(--bg);
  }
  .nbtn.ghost { background: var(--bg); color: var(--fg); }
  .nitems { margin-top: 12px; border-top: 1px solid var(--line); }
  .nitem { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 13px; }
  .nitem .where { font-size: 11px; color: var(--muted); line-height: 1.4; }
  .nitem .where b { color: var(--fg); font-weight: 600; }
  .nitem .body { white-space: pre-wrap; word-break: break-word; margin: 2px 0; }
  .nitem .acts { display: flex; gap: 10px; font-size: 11px; color: var(--muted); }
  .nitem .acts button {
    border: none; background: none; padding: 0; font: inherit; color: var(--muted);
    text-decoration: underline; cursor: pointer;
  }
  .nitem .acts button:hover { color: var(--fg); }
  .nitem .acts .when { margin-left: auto; font-variant-numeric: tabular-nums; }
  .notes-panel .empty { color: var(--muted); font-style: italic; font-size: 13px; padding: 8px 0; }
  .notes-panel .prompt { min-height: 130px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--muted); }
  .notes-panel .copybtn { width: 100%; margin-top: 6px; padding: 6px; }

  /* уже оставленное к этой сущности — в поле правого клика */
  .pexisting { margin-bottom: 8px; }
  .pexisting-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px; }
  .pex-item { border-left: 2px solid var(--c-done); padding: 2px 8px; margin-bottom: 4px; font-size: 12px; color: var(--muted); white-space: pre-wrap; }
  .pex-item button { border: none; background: none; padding: 0; margin-left: 6px; font: inherit; font-size: 11px; color: var(--muted); text-decoration: underline; cursor: pointer; }

  /* поле комментария по правому клику */
  .cpop {
    position: fixed; z-index: 20; width: 380px;
    background: var(--bg); border: 1px solid var(--fg); border-radius: 6px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.18); padding: 10px 12px 12px;
  }
  .cpop[hidden] { display: none; }
  .cpop-target { font-size: 12px; color: var(--muted); margin-bottom: 6px; line-height: 1.4; }
  .cpop-target b { color: var(--fg); }
  .cpop textarea {
    width: 100%; min-height: 76px; resize: vertical; font: inherit; font-size: 13px; line-height: 1.5;
    border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; color: var(--fg);
  }
  .cpop textarea:focus { outline: none; border-color: var(--fg); }
  .cpop-actions { display: flex; align-items: center; gap: 8px; margin-top: 8px; }
  .cpop-actions .hint { flex: 1; font-size: 11px; color: var(--muted); }

  /* метка «есть комментарии» у эпика и задачи */
  .cmark { font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .cmark::before { content: "● "; font-size: 9px; }
  [data-ctx] { cursor: context-menu; }
  tbody tr[data-ctx] { cursor: pointer; }

  /* приоритет: глиф фиксированной ширины, имя из JIRA — в подсказке.
     Ч/б: цвет на странице несёт только статус, приоритет — насыщенностью. */
  .prio {
    flex-shrink: 0; display: inline-block; width: 16px; text-align: center;
    font-size: 12px; font-weight: 700; color: var(--fg); cursor: default;
  }
  .prio.p-medium, .prio.p-low, .prio.p-lowest { color: var(--muted); font-weight: 400; }
  .prio.p-none { color: var(--c-zero); font-weight: 400; }
  td.epic .prio { margin-right: 6px; }

  @media (max-width: 900px) {
    .promptbox { position: static; padding: 12px 16px 0; }
    .notes-panel { width: 100%; }
  }
</style>
</head>
<body>

<div class="promptbox" id="promptbox">
  <div class="pb-row">
    <button class="logs-btn" id="logsBtn" title="Кто что менял за последнюю неделю">Logs</button>
    <button class="pb-toggle" id="notesToggle" aria-expanded="false" aria-controls="notesPanel"
      title="Заметки к спринту и промт для ИИ">Комментарии (<span id="cCount">0</span>)</button>
  </div>
  <div class="notes-panel" id="notesPanel">
    <h4>Заметки к спринту</h4>
    <div class="nform">
      <textarea id="nText" placeholder="Короткая заметка: процесс, история вне спринта, замечание к агенту…"></textarea>
      <input class="nref" id="nRef" list="refList" autocomplete="off"
        placeholder="К чему (необязательно): ключ эпика или задачи">
      <div class="prow">
        <span class="hint">Enter — добавить · правый клик по строке — заметка к ней</span>
        <button class="nbtn" id="nAdd" type="button">Добавить</button>
      </div>
    </div>
    <div class="nitems" id="itemsList"></div>
    <h4 class="sp">Промт для ИИ</h4>
    <textarea class="prompt" id="promptOut" readonly></textarea>
    <button class="nbtn copybtn" id="copyBtn" type="button">Скопировать промт</button>
  </div>
  <datalist id="refList"></datalist>
</div>

<div class="hero">
  <div class="team">Команда</div>
  <h1 id="teamName">—</h1>
  <div class="team-switch" id="teamSwitch"></div>
  <div class="meta">
    <div>Спринт: <strong id="sprintName">—</strong></div>
    <div>Доска: <strong><a class="board-link" id="boardLink" href="#" target="_blank" rel="noopener">—</a></strong></div>
    <div>Lead Time за 3 спринта:
      <strong><a class="metrics-link" href="#" id="metricsLink" title="Среднее / медиана / количество закрытых запросов. Открыть сводный отчёт">—</a></strong>
    </div>
  </div>
</div>

<main>
  <table>
    <tbody id="tableBody"></tbody>
  </table>
</main>

<footer class="provenance" id="provenance"></footer>

<div class="overlay" id="overlay"></div>
<aside class="panel-stack" id="panelStack">
  <!-- общая шапка: одна кнопка закрытия на всю панель -->
  <div class="stack-head">
    <button class="sidebar-close" data-close aria-label="Закрыть">&times;</button>
    <div class="eyebrow" id="stackKey">—</div>
    <h2 id="stackTitle">—</h2>
    <a id="stackLink" href="#" target="_blank" rel="noopener">Открыть в JIRA →</a>
  </div>

  <div class="stack-body">
    <!-- истории эпика + их подзадачи; комментарии — правым кликом по строке -->
    <section class="pane" id="panelStories">
      <div class="pane-label" id="storiesLabel">Истории</div>
      <div class="sidebar-body" id="storiesBody"></div>
    </section>
  </div>
</aside>

<div class="cpop" id="cpop" hidden role="dialog" aria-label="Заметка">
  <div class="cpop-target" id="cpopTarget"></div>
  <div class="pexisting" id="cpopExisting" hidden></div>
  <textarea id="cpopText" placeholder="Короткая заметка…"></textarea>
  <div class="cpop-actions">
    <span class="hint">Enter — сохранить · Shift+Enter — перенос · Esc — отмена</span>
    <button class="action-btn" id="cpopSave">Сохранить</button>
  </div>
</div>

<script>
  // -------------------------------------------------------------------
  // TEAMS: по одному объекту на команду — то, что отдаёт сборщик команды
  // (contract/team.schema.json). Каждый — { slug, team, boardName, boardUrl,
  //            jiraBase, sprintName, epics, metrics, burndown, control,
  //            velocity, logs, statusMap?, notes?, _meta }.
  // Одна страница обслуживает все команды: переключатель в шапке.
  var TEAMS = {{TEAMS_JSON}};

  var team = TEAMS[0];
  var REPORT_ID, JIRA_BASE, EPICS, METRICS, BURNDOWN, CONTROL, VELOCITY, LOGS, STATUS_MAP;

  function useTeam(slug) {
    team = TEAMS.find(function (t) { return t.slug === slug; }) || TEAMS[0];
    // REPORT_ID разводит localStorage-заметки: у каждой команды свои
    REPORT_ID = team.slug;
    // раскладку статусов считает сборщик команды и кладёт в statusMap: у команд
    // разные workflow. Нет карты (старый файл данных) — падаем в classifyBucket.
    STATUS_MAP = team.statusMap || null;
    JIRA_BASE = team.jiraBase;
    EPICS = team.epics; METRICS = team.metrics; BURNDOWN = team.burndown;
    CONTROL = team.control; VELOCITY = team.velocity; LOGS = team.logs;
  }
  // -------------------------------------------------------------------

  // Бакеты статусов. Порядок = порядок вывода счётчиков в строке эпика.
  // phrase — формулировка для подсказки при наведении («2 — в бэклоге»).
  var BUCKETS = [
    { id: 'open',     label: 'Открыто',       cls: 'b-open',     phrase: 'в бэклоге' },
    { id: 'blocked',  label: 'Заблокировано', cls: 'b-blocked',  phrase: 'заблокировано' },
    { id: 'progress', label: 'В работе',      cls: 'b-progress', phrase: 'в работе' },
    { id: 'testing',  label: 'Тестирование',  cls: 'b-testing',  phrase: 'в тестировании' },
    { id: 'review',   label: 'Ревью',         cls: 'b-review',   phrase: 'в ревью' },
    { id: 'done',     label: 'Готово',        cls: 'b-done',     phrase: 'готово' }
  ];

  // Маппинг реального статуса JIRA -> бакет (см. resources/status_mapping.md).
  // Порядок проверок важен и выверен регрессией по всем ~330 статусам инстанса.
  var DONE_EXACT = [
    'закрыт', 'закрыта', 'закрыто', 'готово', 'сделано', 'выполнено', 'выполнена',
    'завершено', 'завершена', 'отменен', 'отменён', 'отменена', 'отменено',
    'отклонен', 'отклонён', 'отклонена', 'отклонено', 'решён', 'решен', 'решена'
  ];

  function classifyBucket(status, category) {
    if (STATUS_MAP) {
      var mapped = STATUS_MAP[status];
      if (mapped) return mapped;
    }
    var s = (status || '').trim().toLowerCase();

    // 1. Категория JIRA "Выполнено" — авторитетный и единственный широкий признак готовности.
    //    Подстрочный поиск по имени здесь недопустим: "Аналитика завершена", "Готово к закрытию",
    //    "Ожидает решения КЦ" содержат done-подобные корни, но финальными НЕ являются.
    if (category === 'Выполнено') return 'done';
    if (DONE_EXACT.indexOf(s) !== -1) return 'done';

    // 2. Блокировки и ожидания — раньше остальных: "Ожидает тестирование" это очередь, не тесты.
    if (/блок|ожида|пауза|на паузе|hold|wait|отложен|приостановл/.test(s)) return 'blocked';

    // 3. Тестирование раньше ревью: "Готово к тестированию" — про тесты.
    if (/тест|qa/.test(s)) return 'testing';

    // 4. Ревью / приёмка / согласование.
    if (/ревью|review|проверк|приемк|приёмк|согласован|утвержд/.test(s)) return 'review';

    // 5. Дефолт по категории JIRA.
    if (category === 'К выполнению') return 'open';
    return 'progress';
  }

  function bucketClass(status, category) {
    var id = classifyBucket(status, category);
    for (var i = 0; i < BUCKETS.length; i++) {
      if (BUCKETS[i].id === id) return BUCKETS[i].cls;
    }
    return 'b-open';
  }

  // Агрегация по ВСЕЙ иерархии эпика: каждая история + каждая её подзадача = 1 единица.
  function tallyEpic(epic) {
    var counts = {};
    BUCKETS.forEach(function (b) { counts[b.id] = 0; });

    (epic.stories || []).forEach(function (story) {
      counts[classifyBucket(story.status, story.category)]++;
      (story.subtasks || []).forEach(function (sub) {
        counts[classifyBucket(sub.status, sub.category)]++;
      });
    });

    counts.total = BUCKETS.reduce(function (acc, b) { return acc + counts[b.id]; }, 0);
    return counts;
  }

  function jiraUrl(key) { return JIRA_BASE + '/browse/' + key; }

  // Сколько дней статус не менялся. Считается в браузере от текущей даты,
  // поэтому страница не «протухает»: в данных лежит ISO-дата последней смены статуса.
  // Больше STALE_DAYS дней без движения — подсвечиваем красным.
  var STALE_DAYS = 3;

  function statusAge(iso) {
    if (!iso) return null;
    var then = new Date(iso);
    if (isNaN(then.getTime())) return null;
    var days = Math.floor((Date.now() - then.getTime()) / 86400000);
    if (days < 0) days = 0;
    return days;
  }

  // Готовые задачи по определению стоят без движения — красить их «просрочкой» смысла нет,
  // поэтому для бакета done возраст всегда зелёный и никогда не stale.
  function ageHtml(iso, status, category) {
    var isDone = classifyBucket(status, category) === 'done';
    var days = statusAge(iso);
    if (days === null) {
      return '<span class="age' + (isDone ? ' done' : '') + '" title="Дата смены статуса неизвестна">—</span>';
    }
    var label = days + 'д';
    var title = isDone
      ? 'Закрыто ' + (days === 0 ? 'сегодня' : days + ' дн. назад')
      : (days === 0 ? 'Статус изменён сегодня' : 'Статус не менялся ' + days + ' дн.');
    var cls = isDone ? ' done' : (days > STALE_DAYS ? ' stale' : '');
    return '<span class="age' + cls + '" title="' + esc(title) + '">' + label + '</span>';
  }

  // Инициалы исполнителя: "Фамилия Имя Отчество" -> "ФИ" (фамилия + имя).
  // Полное имя показывается подсказкой при наведении.
  function whoHtml(name) {
    if (!name) {
      return '<span class="who none">—<span class="who-tip">Исполнитель не назначен</span></span>';
    }
    var parts = String(name).trim().split(/\s+/);
    var initials = parts.slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
    // В подсказке переставляем «Фамилия Имя Отчество» в «Имя Фамилия».
    // Но если вторая часть — одна буква (инициал или метка вида «Участник А»),
    // переставлять нечего: получится «А Участник».
    var full = (parts.length >= 2 && parts[1].replace('.', '').length > 1)
      ? parts[1] + ' ' + parts[0]
      : name;
    return '<span class="who" title="' + esc(name) + '">' + esc(initials) +
      '<span class="who-tip">' + esc(full) + '</span></span>';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  var tableBody = document.getElementById('tableBody');

  // подсказка: только ненулевые бакеты, «2 — в бэклоге, 1 — в ревью»
  function tallyTip(counts) {
    var parts = BUCKETS
      .filter(function (b) { return counts[b.id] > 0; })
      .map(function (b) { return counts[b.id] + ' — ' + b.phrase; });
    if (!parts.length) return 'Задач нет';
    return parts.join(', ') + ' · всего ' + counts.total;
  }

  function tallyHtml(counts) {
    var nums = BUCKETS.map(function (b) {
      var n = counts[b.id];
      return '<span class="n ' + b.cls + (n ? '' : ' zero') + '">' + n + '</span>';
    }).join('<span class="sep">/</span>');
    return '<span class="tally-box">' + nums + '<span class="tip">' + esc(tallyTip(counts)) + '</span></span>';
  }

  function renderTable() {

    tableBody.innerHTML = EPICS.map(function (e) {
      // название эпика — просто текст: ссылка на JIRA живёт в шапке панели,
      // иначе клик по строке конфликтует с переходом по ссылке
      var epicCell = e.epicKey
        ? prioHtml(e.epicPriority) + esc(e.epicTitle)
        : '<span class="prio p-none"></span><span class="no-epic">' + esc(e.epicTitle || 'Без эпика') + '</span>';
      return (
        '<tr data-row="' + esc(e.rowId) + '"' + ctxAttr(epicTarget(e)) + '>' +
          '<td class="epic">' + epicCell + '</td>' +
          '<td class="tally">' + tallyHtml(tallyEpic(e)) + '</td>' +
          '<td class="actions"><button class="action-btn" data-open="' + esc(e.rowId) + '">Статус</button></td>' +
        '</tr>'
      );
    }).join('');

    // клик по любому месту строки открывает панель
    tableBody.querySelectorAll('tr').forEach(function (tr) {
      var rowId = tr.dataset.row;
      tr.addEventListener('click', function () { openPanels(rowId); });
    });
    refreshComments();
  }

  var overlay = document.getElementById('overlay');
  var panelStack = document.getElementById('panelStack');
  var stackKey = document.getElementById('stackKey');
  var stackTitle = document.getElementById('stackTitle');
  var stackLink = document.getElementById('stackLink');
  var storiesLabel = document.getElementById('storiesLabel');
  var storiesBody = document.getElementById('storiesBody');

  // ------------------------- заметки (корзина) -------------------------
  // Как на странице ревью БФТ: заметки копятся в корзине справа вверху, каждую
  // можно поправить или удалить, наружу они уходят готовым промтом для ИИ.
  // У заметки необязательная привязка к сущности (эпик, история, подзадача или
  // любой ключ вне отчёта) — чтобы LLM сразу понимала, о чём речь.
  // Хранение — localStorage браузера, своя корзина у каждой команды и спринта.
  function commentsKey() { return 'actual-sprint:' + REPORT_ID + ':comments:' + team.sprintName; }

  function loadComments() {
    try {
      var list = JSON.parse(localStorage.getItem(commentsKey()) || '[]');
      return Array.isArray(list) ? list : [];
    } catch (e) { return []; }
  }

  function saveComments(list) {
    try { localStorage.setItem(commentsKey(), JSON.stringify(list)); } catch (e) {}
  }

  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

  function addComment(target, text) {
    text = String(text || '').trim();
    if (!text) return false;
    var list = loadComments();
    list.push({ id: newId(), at: new Date().toISOString(), target: target, text: text });
    saveComments(list);
    refreshComments();
    return true;
  }

  function updateComment(id, text, target) {
    text = String(text || '').trim();
    if (!text) return false;
    saveComments(loadComments().map(function (c) {
      return c.id === id ? Object.assign({}, c, { text: text, target: target, editedAt: new Date().toISOString() }) : c;
    }));
    refreshComments();
    return true;
  }

  function removeComment(id) {
    saveComments(loadComments().filter(function (c) { return c.id !== id; }));
    refreshComments();
  }

  // Заметки прошлых версий страницы (textarea в панели и файл sprint-report-notes.json)
  // один раз переезжают в корзину, чтобы ничего не потерялось. Старые ключи не трогаем.
  function migrateNotes() {
    var flag = 'actual-sprint:' + REPORT_ID + ':notes-migrated';
    if (localStorage.getItem(flag)) return;
    var prefix = 'actual-sprint:' + REPORT_ID + ':note:';
    var bag = {};
    Object.keys(team.notes || {}).forEach(function (k) { bag[k] = team.notes[k]; });
    Object.keys(localStorage).forEach(function (k) {
      if (k.indexOf(prefix) === 0 && localStorage.getItem(k)) bag[k.slice(prefix.length)] = localStorage.getItem(k);
    });
    var list = loadComments();
    Object.keys(bag).forEach(function (rowId) {
      var text = String(bag[rowId] || '').trim();
      if (!text) return;
      var epic = EPICS.find(function (e) { return e.rowId === rowId; });
      var target = epic ? epicTarget(epic)
        : { kind: 'general', title: rowId === '__metrics__' ? 'Сводный отчёт' : rowId === '__logs__' ? 'Лента изменений' : '' };
      list.push({ id: 'm-' + rowId, at: new Date().toISOString(), target: target, text: text, migrated: true });
    });
    saveComments(list);
    localStorage.setItem(flag, '1');
  }

  // --- к чему заметка: снимок сущности на момент записи, чтобы промт читался
  //     и тогда, когда данные отчёта уже пересобраны
  function epicTarget(epic) {
    return { kind: 'epic', key: epic.epicKey, title: epic.epicTitle || 'Без эпика',
             rowId: epic.rowId, priority: epic.epicPriority || null };
  }

  function itemTarget(kind, item, epic) {
    return { kind: kind, key: item.key, title: item.title || item.summary, status: item.status,
             priority: item.priority || null, assignee: item.assignee || null,
             epicKey: epic.epicKey, epicTitle: epic.epicTitle, rowId: epic.rowId };
  }

  var GENERAL = { kind: 'general' };
  var KIND_NAME = { epic: 'Эпик', story: 'История', subtask: 'Подзадача', event: 'Задача',
                    ref: 'Вне отчёта' };

  // все сущности текущей команды по ключу: для привязки из корзины и подсказок
  function entityIndex() {
    var idx = {};
    EPICS.forEach(function (e) {
      if (e.epicKey) idx[e.epicKey.toUpperCase()] = epicTarget(e);
      (e.stories || []).forEach(function (st) {
        idx[st.key.toUpperCase()] = itemTarget('story', st, e);
        (st.subtasks || []).forEach(function (sub) { idx[sub.key.toUpperCase()] = itemTarget('subtask', sub, e); });
      });
    });
    return idx;
  }

  function fillRefList() {
    var idx = entityIndex();
    document.getElementById('refList').innerHTML = Object.keys(idx).map(function (k) {
      var t = idx[k];
      return '<option value="' + esc(t.key) + '">' + esc(KIND_NAME[t.kind] + ' · ' + t.title) + '</option>';
    }).join('');
  }

  // «INIT-132» или «INIT-132 — что угодно» → снимок сущности; ключ не из отчёта
  // (история вне спринта) тоже годится; пусто → заметка без привязки
  function resolveRef(value) {
    value = String(value || '').trim();
    if (!value) return GENERAL;
    var m = value.match(/^[A-Za-zА-Яа-яЁё][\wЀ-ӿ]*-\d+/);
    var key = m ? m[0].toUpperCase() : null;
    var known = key ? entityIndex()[key] : null;
    if (known) return known;
    return { kind: 'ref', key: key || value, title: key ? value.slice(m[0].length).replace(/^[\s—–-]+/, '') : '' };
  }

  function refValue(t) { return t && t.kind !== 'general' && t.key ? t.key : ''; }

  // одна строка «к чему»: и для корзины, и для промта
  function targetLine(t) {
    if (!t || t.kind === 'general') return 'без привязки' + (t && t.title ? ' · ' + t.title : '');
    var head = KIND_NAME[t.kind] + (t.key ? ' ' + t.key : '') + (t.title ? ' «' + t.title + '»' : '');
    var parts = [head];
    if ((t.kind === 'story' || t.kind === 'subtask') && t.epicTitle) {
      parts.push('эпик ' + (t.epicKey ? t.epicKey + ' ' : '') + '«' + t.epicTitle + '»');
    }
    if (t.priority) parts.push('приоритет ' + t.priority);
    if (t.status) parts.push('статус ' + t.status);
    if (t.assignee) parts.push('исполнитель ' + t.assignee);
    return parts.join(' · ');
  }

  function stamp(iso, withYear) {
    var d = new Date(iso);
    var two = function (n) { return ('0' + n).slice(-2); };
    return two(d.getDate()) + '.' + two(d.getMonth() + 1) + (withYear ? '.' + d.getFullYear() : '') +
      ' ' + two(d.getHours()) + ':' + two(d.getMinutes());
  }

  // Промт для ИИ: контекст отчёта, формат строки и заметки по порядку.
  // В квадратных скобках — к чему заметка; по ним LLM сразу находит сущность.
  function buildPrompt(list) {
    if (!list.length) return '';
    var when = team._meta && team._meta.collectedAt ? ' · данные JIRA на ' + stamp(team._meta.collectedAt, true) : '';
    var out = ['Заметки PO к отчёту спринта — учти их при разборе спринта и в ответах.',
               'Команда «' + team.team + '» · ' + team.sprintName + ' · доска «' + team.boardName + '»' + when + '.',
               'Формат: номер. [к чему относится] текст заметки. [без привязки] — заметка о процессе в целом.', ''];
    list.forEach(function (c, i) {
      var lines = String(c.text).split('\n');
      out.push((i + 1) + '. [' + targetLine(c.target) + '] ' + lines[0]);
      lines.slice(1).forEach(function (line) { out.push('   ' + line); });
    });
    return out.join('\n');
  }

  function copyText(text) {
    // file:// и старые браузеры без Clipboard API — через скрытое поле
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      return ok ? Promise.resolve() : Promise.reject(new Error('copy'));
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).catch(fallback);
    }
    return fallback();
  }

  // --- корзина
  var notesPanel = document.getElementById('notesPanel');
  var notesToggle = document.getElementById('notesToggle');
  var editingId = null;

  function whereHtml(t) {
    if (!t || t.kind === 'general') return '<b>без привязки</b>' + (t && t.title ? ' · ' + esc(t.title) : '');
    var line = targetLine(t);
    var head = KIND_NAME[t.kind] + (t.key ? ' ' + t.key : '');
    return '<b>' + esc(head) + '</b>' + esc(line.slice(head.length));
  }

  function noteItemHtml(c) {
    if (c.id === editingId) {
      return '<div class="nitem nedit" data-id="' + esc(c.id) + '">' +
        '<textarea class="nedit-text">' + esc(c.text) + '</textarea>' +
        '<input class="nref nedit-ref" list="refList" autocomplete="off" value="' + esc(refValue(c.target)) + '"' +
        ' placeholder="К чему (необязательно): ключ эпика или задачи">' +
        '<div class="prow"><span class="hint">Enter — сохранить · Esc — отмена</span>' +
        '<button class="nbtn ghost" data-cancel type="button">Отмена</button>' +
        '<button class="nbtn" data-save type="button">Сохранить</button></div></div>';
    }
    return '<div class="nitem" data-id="' + esc(c.id) + '">' +
      '<div class="where">' + whereHtml(c.target) + (c.migrated ? ' · из заметки' : '') + '</div>' +
      '<div class="body">' + esc(c.text) + '</div>' +
      '<div class="acts"><button data-edit type="button">изменить</button>' +
      '<button data-del type="button">удалить</button>' +
      '<span class="when" title="' + esc(c.editedAt ? 'Изменено ' + stamp(c.editedAt, true) : '') + '">' +
        esc(stamp(c.at)) + (c.editedAt ? ' · изм.' : '') + '</span></div></div>';

  function renderNotes() {
    var list = loadComments();
    document.getElementById('cCount').textContent = list.length;
    var box = document.getElementById('itemsList');
    box.innerHTML = list.length ? list.map(noteItemHtml).join('') : '<p class="empty">Заметок нет.</p>';
    document.getElementById('promptOut').value = buildPrompt(list);

    box.querySelectorAll('.nitem').forEach(function (item) {
      var id = item.dataset.id;
      var q = function (sel) { return item.querySelector(sel); };
      if (q('[data-del]')) q('[data-del]').addEventListener('click', function () { removeComment(id); });
      if (q('[data-edit]')) q('[data-edit]').addEventListener('click', function () {
        editingId = id; renderNotes();
        var ta = box.querySelector('.nedit-text');
        ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
      });
      if (q('[data-save]')) {
        var save = function () {
          // ключ не трогали — оставляем снимок сущности как был, а не пересобираем его
          var old = loadComments().find(function (c) { return c.id === id; });
          var ref = q('.nedit-ref').value.trim();
          var target = old && ref === refValue(old.target) ? old.target : resolveRef(ref);
          if (updateComment(id, q('.nedit-text').value, target)) editingId = null;
          renderNotes();
        };
        var cancel = function () { editingId = null; renderNotes(); };
        q('[data-save]').addEventListener('click', save);
        q('[data-cancel]').addEventListener('click', cancel);
        [q('.nedit-text'), q('.nedit-ref')].forEach(function (el) {
          el.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); save(); }
            if (e.key === 'Escape') { e.stopPropagation(); cancel(); }
          });
        });
      }
    });
  }

  function openCommentPopup(target, x, y) {
    cpopTarget = target;
    document.getElementById('cpopTarget').innerHTML = whereHtml(target);
    renderPopExisting(target);
    cpopText.value = '';

    if (e.key === 'Escape') { e.stopPropagation(); closeCommentPopup(); }

  // Правый клик по любой строке с data-ctx открывает поле заметки к ней.
  // Цель берётся из реестра, заполняемого при отрисовке строк.
  var ctxTargets = {}, ctxSeq = 0;
  function ctxId(target) {
    var id = 'c' + (ctxSeq++);
    ctxTargets[id] = target;
    return id;
  }
  function ctxAttr(target) { return ' data-ctx="' + ctxId(target) + '"'; }
  document.addEventListener('contextmenu', function (e) {

    if (!el || !ctxTargets[el.dataset.ctx]) return;

    openCommentPopup(ctxTargets[el.dataset.ctx], e.clientX, e.clientY);

  // --- приоритет: уровень выводим из имени, как бакет из статуса
  var PRIO_LEVELS = [
    { cls: 'p-highest', glyph: '⇈', rx: /блокир|критич|highest|blocker|critical|наивысш|срочн/ },
    { cls: 'p-lowest',  glyph: '⇊', rx: /lowest|trivial|незначит|минимальн/ },
    { cls: 'p-high',    glyph: '↑', rx: /высок|high|major|важн/ },
    { cls: 'p-low',     glyph: '↓', rx: /низк|low|minor/ },
    { cls: 'p-medium',  glyph: '=', rx: /средн|medium|normal|обычн|нормальн/ }
  ];

  // ------------------------- сводный отчёт за 3 спринта -------------------------

  function fmt(v) { return v === null || v === undefined ? '—' : String(v).replace('.', ','); }

  // «среднее/медиана/количество» — формат шапки и всех ячеек сводки
  function triple(s) {
    if (!s) return '<span class="m-muted">—</span>';
    return fmt(s.mean) + ' / ' + fmt(s.median) + ' / ' + s.count;
  }

  function renderMetricsLink() {
    var link = document.getElementById('metricsLink');
    var o = METRICS && METRICS.overall;
    link.textContent = o && o.lead ? triple(o.lead).replace(/<[^>]+>/g, '') : '—';
  }

  // ------------------ Burndown текущего спринта ------------------
  // Показывает, сколько задач ещё не закрыто по дням спринта.
  // scope пересчитывается по changelog поля Sprint, поэтому внесённые и
  // вынесенные из спринта задачи видны как ступеньки серой линии объёма.
  function burndownChart() {
    var b = BURNDOWN;
    if (!b || !b.days || !b.days.length) return '<div class="m-muted">Нет данных по спринту.</div>';

    var days = b.days;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var maxY = Math.max.apply(null, days.map(function (d) { return d.scope; })) || 1;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var xOf = function (i) { return padL + innerW * (days.length > 1 ? i / (days.length - 1) : 0); };
    var yOf = function (v) { return padT + innerH * (1 - v / maxY); };

    var parts = [];

    // выходные — светлые полосы
    days.forEach(function (d, i) {
      if (!d.weekend) return;
      var x1 = xOf(i) - innerW / (days.length - 1) / 2;
      var x2 = xOf(i) + innerW / (days.length - 1) / 2;
      parts.push('<rect x="' + Math.max(padL, x1).toFixed(1) + '" y="' + padT +
        '" width="' + Math.max(0, Math.min(W - padR, x2) - Math.max(padL, x1)).toFixed(1) +
        '" height="' + innerH + '" fill="#f4f4f5"/>');
    });

    // сетка и ось Y
    [0, Math.round(maxY / 2), maxY].forEach(function (v) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="10" fill="#666">' + v + '</text>');
    });

    // идеальная линия: от объёма на старте до нуля в конце
    parts.push('<line x1="' + xOf(0) + '" y1="' + yOf(days[0].scope).toFixed(1) +
      '" x2="' + xOf(days.length - 1) + '" y2="' + yOf(0).toFixed(1) +
      '" stroke="#9ca3af" stroke-width="2"/>');

    // фактический остаток — только по сегодняшний день
    var actual = days.filter(function (d) { return !d.future; });
    if (actual.length) {
      var path = actual.map(function (d, i) {
        return (i ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(d.remaining).toFixed(1);
      }).join(' ');
      parts.push('<path d="' + path + '" fill="none" stroke="#dc2626" stroke-width="2"/>');
      actual.forEach(function (d, i) {
        parts.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(d.remaining).toFixed(1) +
          '" r="2.5" fill="#dc2626"><title>' + esc(d.date + ': осталось ' + d.remaining +
          ' из ' + d.scope + ', закрыто ' + d.closed) + '</title></circle>');
      });
    }

    // подписи крайних дат
    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#666">' + esc(b.start) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 8) +
      '" font-size="10" fill="#666" text-anchor="end">' + esc(b.end) + '</text>');

    var last = actual.length ? actual[actual.length - 1] : days[0];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' +
        '<span class="swatch ideal"></span>идеальный темп &nbsp; ' +
        '<span class="swatch actual"></span>фактический остаток<br>' +
        'Сейчас закрыто <b>' + last.closed + '</b> из <b>' + last.scope + '</b>, осталось <b>' +
        last.remaining + '</b>. Серая ступенька — изменение объёма спринта.' +
      '</div>';
  }

  // ------------------ Диаграмма управления ------------------
  // X — дата закрытия, Y — Cycle Time задачи. Синяя линия — скользящее среднее,
  // светлая полоса — коридор ±σ, красная черта — порог выброса (среднее + σ).
  // Точки выше порога подсвечены и вынесены списком под графиком.
  function controlChart(c, label) {
    if (!c || !c.points || !c.points.length) {
      return '<div class="m-muted">Нет закрытых ' + esc(label) + ' за период.</div>';
    }

    var pts = c.points;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var maxY = Math.max.apply(null, pts.map(function (p) { return p.cycle; })) || 1;

    var t0 = new Date(pts[0].doneAt).getTime();
    var t1 = new Date(pts[pts.length - 1].doneAt).getTime();
    var span = Math.max(t1 - t0, 1);
    var xOf = function (iso) { return padL + innerW * ((new Date(iso).getTime() - t0) / span); };
    var yOf = function (v) { return padT + innerH * (1 - v / maxY); };

    var parts = [];
    [0, Math.round(maxY / 2), Math.round(maxY)].forEach(function (v) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="10" fill="#666">' + v + '</text>');
    });

    // скользящее среднее по окну из 5 задач + коридор ±σ
    var WIN = 5, avg = [], band = [];
    pts.forEach(function (p, i) {
      var from = Math.max(0, i - Math.floor(WIN / 2));
      var win = pts.slice(from, from + WIN).map(function (q) { return q.cycle; });
      var m = win.reduce(function (a, v) { return a + v; }, 0) / win.length;
      var sd = Math.sqrt(win.reduce(function (a, v) { return a + (v - m) * (v - m); }, 0) / win.length);
      avg.push({ x: xOf(p.doneAt), y: yOf(m) });
      band.push({ x: xOf(p.doneAt), hi: yOf(Math.min(maxY, m + sd)), lo: yOf(Math.max(0, m - sd)) });
    });

    var bandPath = band.map(function (b, i) { return (i ? 'L' : 'M') + b.x.toFixed(1) + ' ' + b.hi.toFixed(1); }).join(' ') +
      ' ' + band.slice().reverse().map(function (b) { return 'L' + b.x.toFixed(1) + ' ' + b.lo.toFixed(1); }).join(' ') + ' Z';
    parts.push('<path d="' + bandPath + '" fill="#2563eb" fill-opacity="0.10"/>');
    parts.push('<path d="' + avg.map(function (a, i) { return (i ? 'L' : 'M') + a.x.toFixed(1) + ' ' + a.y.toFixed(1); }).join(' ') +
      '" fill="none" stroke="#2563eb" stroke-width="2"/>');

    // порог выброса
    parts.push('<line x1="' + padL + '" y1="' + yOf(c.limit).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + yOf(c.limit).toFixed(1) + '" stroke="#dc2626" stroke-width="1.5"/>');

    // задачи в зоне риска: ещё не закрыты, но в работе дольше медианы.
    // Ставим их на «сегодня» — по вертикали столько, сколько уже длятся.
    var risks = (c.risks || []).filter(function (r) { return r.elapsed <= maxY; });
    var overflow = (c.risks || []).length - risks.length;
    if (c.risks && c.risks.length) {
      var xRisk = W - padR - 6;
      risks.forEach(function (r) {
        parts.push('<circle cx="' + xRisk.toFixed(1) + '" cy="' + yOf(r.elapsed).toFixed(1) +
          '" r="4" fill="#ca8a04" fill-opacity="0.85" stroke="#ca8a04"><title>' +
          esc(r.key + ' · в работе ' + fmt(r.elapsed) + ' дн. · ' + r.status + '\n' + r.title) +
          '</title></circle>');
      });
    }

    // точки: выбросы крупнее и красные
    pts.forEach(function (p) {
      parts.push('<circle cx="' + xOf(p.doneAt).toFixed(1) + '" cy="' + yOf(p.cycle).toFixed(1) +
        '" r="' + (p.outlier ? 4 : 3) + '" fill="' + (p.outlier ? '#dc2626' : '#16a34a') +
        '" fill-opacity="' + (p.outlier ? 0.85 : 0.5) + '" stroke="' + (p.outlier ? '#dc2626' : '#16a34a') +
        '" stroke-opacity="0.9"><title>' + esc(p.key + ' · ' + fmt(p.cycle) + ' дн. · ' + p.doneAt + '\n' + p.title) +
        '</title></circle>');
    });

    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#666">' + esc(pts[0].doneAt) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 8) +
      '" font-size="10" fill="#666" text-anchor="end">' + esc(pts[pts.length - 1].doneAt) + '</text>');

    // список выбросов — то, ради чего диаграмма и нужна
    var outliers = pts.filter(function (p) { return p.outlier; })
      .sort(function (a, b) { return b.cycle - a.cycle; });
    var listHtml = '';
    if (outliers.length) {
      listHtml += '<div class="outliers"><div class="outliers-head">Выбиваются из коридора (' +
        outliers.length + ' из ' + pts.length + ')</div>' +
        outliers.map(function (p) {
          return '<div class="outlier-row">' +
            '<a href="' + jiraUrl(p.key) + '" target="_blank" rel="noopener">' + esc(p.key) + ' — ' + esc(p.title) + '</a>' +
            '<div class="meta-wrap">' +
              '<span class="status ' + bucketClass(p.status, p.category) + '">' + esc(p.status) + '</span>' +
              '<span class="age stale">' + fmt(p.cycle) + 'д</span>' +
            '</div></div>';
        }).join('') + '</div>';
    }
    if (c.risks && c.risks.length) {
      listHtml += '<div class="outliers"><div class="outliers-head risk">В зоне риска (' + c.risks.length +
        ') — в работе дольше медианы ' + fmt(c.median) + ' дн.</div>' +
        c.risks.map(function (r) {
          return '<div class="outlier-row">' +
            '<a href="' + jiraUrl(r.key) + '" target="_blank" rel="noopener">' + esc(r.key) + ' — ' + esc(r.title) + '</a>' +
            '<div class="meta-wrap">' +
              '<span class="status ' + bucketClass(r.status, r.category) + '">' + esc(r.status) + '</span>' +
              '<span class="age risk">' + fmt(r.elapsed) + 'д</span>' +
            '</div></div>';
        }).join('') + '</div>';
    }

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' +
        '<span class="swatch"></span>скользящее среднее &nbsp; ' +
        '<span class="swatch limit"></span>порог выброса ' + fmt(c.limit) + ' дн. &nbsp; ' +
        '<span class="dot" style="background:var(--c-testing)"></span>в зоне риска' +
        (overflow > 0 ? ' (' + overflow + ' выше шкалы)' : '') + '<br>' +
        'Зелёная точка — закрытая задача: по горизонтали дата закрытия, по вертикали Cycle Time. ' +
        'Жёлтая — ещё в работе, стоит у правого края на сегодня. ' +
        'За ' + c.days + ' дн.: медиана <b>' + fmt(c.median) + '</b> дн., среднее <b>' + fmt(c.mean) + '</b> дн., σ ' + fmt(c.sd) + '.' +
      '</div>' + listHtml;
  }

  // ------------------ Производительность: запланировано / сделано ------------------
  // Плановый столбец разложен по текущим статусам — видно, где осело незакрытое.
  function velocityChart() {
    var v = VELOCITY;
    if (!v || !v.sprints || !v.sprints.length) return '<div class="m-muted">Нет данных по спринтам.</div>';

    var rows = v.sprints;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var maxY = Math.max.apply(null, rows.map(function (r) { return Math.max(r.planned, r.done); })) || 1;
    var yOf = function (val) { return padT + innerH * (1 - val / maxY); };
    var group = innerW / rows.length;
    var barW = Math.min(38, group / 3);

    var parts = [];
    [0, Math.round(maxY / 2), maxY].forEach(function (val) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(val).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(val).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(val) + 4).toFixed(1) + '" font-size="10" fill="#666">' + val + '</text>');
    });

    var STACK = [
      { id: 'open',     label: 'TODO',          color: 'var(--c-open)' },
      { id: 'blocked',  label: 'Заблокировано', color: 'var(--c-blocked)' },
      { id: 'progress', label: 'В работе',      color: 'var(--c-progress)' },
      { id: 'testing',  label: 'Тестирование',  color: 'var(--c-testing)' },
      { id: 'review',   label: 'Ревью',         color: 'var(--c-review)' },
      { id: 'done',     label: 'Готово',        color: 'var(--c-done)' }
    ];

    rows.forEach(function (r, i) {
      var cx = padL + group * i + group / 2;
      var xPlan = cx - barW - 3, xDone = cx + 3;

      // плановый столбец — стопка по статусам снизу вверх
      var acc = 0;
      STACK.forEach(function (seg) {
        var n = (r.split && r.split[seg.id]) || 0;
        if (!n) return;
        var yTop = yOf(acc + n), yBot = yOf(acc);
        parts.push('<rect x="' + xPlan.toFixed(1) + '" y="' + yTop.toFixed(1) +
          '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, yBot - yTop).toFixed(1) +
          '" fill="' + seg.color + '" fill-opacity="0.85"><title>' +
          esc(r.name + ' · ' + seg.label + ': ' + n) + '</title></rect>');
        acc += n;
      });

      // столбец «сделано»
      parts.push('<rect x="' + xDone.toFixed(1) + '" y="' + yOf(r.done).toFixed(1) +
        '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, yOf(0) - yOf(r.done)).toFixed(1) +
        '" fill="var(--c-done)"><title>' + esc(r.name + ' · сделано: ' + r.done) + '</title></rect>');

      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - 8) +
        '" font-size="10" fill="#666" text-anchor="middle">' + esc(r.name) + '</text>');
    });

    // линия среднего выполнения
    if (v.avgDone) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v.avgDone).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v.avgDone).toFixed(1) + '" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/>');
    }

    var legend = STACK.map(function (seg) {
      return '<span class="dot" style="background:' + seg.color + '"></span>' + esc(seg.label);
    }).join(' &nbsp; ');

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' + legend + '</div>';
  }

  function fillMetricsPanel() {
    var html = '';

    html += '<div class="metrics-section"><h3>Burndown текущего спринта</h3>' + burndownChart() + '</div>';
    html += '<div class="metrics-section"><h3>Производительность: запланировано / сделано</h3>' + velocityChart() + '</div>';
    html += '<div class="metrics-section"><h3>Диаграмма управления — истории</h3>' +
      controlChart(CONTROL.stories, 'историй') + '</div>';
    html += '<div class="metrics-section"><h3>Диаграмма управления — подзадачи</h3>' +
      controlChart(CONTROL.subtasks, 'подзадач') + '</div>';

    return html;
  }

  // ------------------ Лента изменений статусов ------------------
  // Кто какую задачу куда перевёл за последнюю неделю. Фильтр по автору.
  var logsFilter = null;

  function relTime(iso) {
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + ' мин назад';
    if (diff < 86400) return Math.round(diff / 3600) + ' ч назад';
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function dayLabel(iso) {
    var d = new Date(iso), today = new Date();
    var same = function (a, b) { return a.toDateString() === b.toDateString(); };
    var yest = new Date(today.getTime() - 86400000);
    if (same(d, today)) return 'Сегодня';
    if (same(d, yest)) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }

  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/);
    return parts.slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
  }

  // Тип события определяет, что показываем в строке ленты.
  var LOG_KINDS = [
    { id: 'status',  label: 'Смена статуса' },
    { id: 'comment', label: 'Комментарий' },
    { id: 'created', label: 'Создание' }
  ];

  function logEventBody(e) {
    if (e.kind === 'comment') {
      return '<div class="log-move"><span class="log-verb">оставил комментарий</span></div>' +
        '<div class="log-quote">' + esc(e.body || '') + '</div>';
    }
    if (e.kind === 'created') {
      return '<div class="log-move"><span class="log-verb">создал</span>' +
        '<span class="status b-open">' + esc(e.issueType || 'задачу') + '</span></div>';
    }
    return '<div class="log-move">' +
      '<span class="status b-open">' + esc(e.from) + '</span>' +
      '<span class="arrow">→</span>' +
      '<span class="status ' + bucketClass(e.to, e.toCat) + '">' + esc(e.to) + '</span>' +
    '</div>';
  }

  var logsKind = null;

  function renderLogs() {
    var all = (LOGS && LOGS.events) || [];
    var events = all.filter(function (e) {
      if (logsFilter && e.author !== logsFilter) return false;
      if (logsKind && e.kind !== logsKind) return false;
      return true;
    });

    var kinds = (LOGS && LOGS.kinds) || {};
    var chips = '<div class="log-filters">' +
      '<button class="log-chip' + (logsKind ? '' : ' active') + '" data-kind="">Всё · ' + all.length + '</button>' +
      LOG_KINDS.filter(function (k) { return kinds[k.id]; }).map(function (k) {
        return '<button class="log-chip' + (logsKind === k.id ? ' active' : '') +
          '" data-kind="' + k.id + '">' + esc(k.label) + ' · ' + kinds[k.id] + '</button>';
      }).join('') + '</div>' +
      '<div class="log-filters">' +
      '<button class="log-chip' + (logsFilter ? '' : ' active') + '" data-author="">Все</button>' +
      ((LOGS && LOGS.authors) || []).map(function (a) {
        return '<button class="log-chip' + (logsFilter === a[0] ? ' active' : '') +
          '" data-author="' + esc(a[0]) + '">' + esc(initials(a[0])) + ' ' + esc(a[0].split(' ')[0]) + ' · ' + a[1] + '</button>';
      }).join('') + '</div>';

    if (!events.length) {
      storiesBody.innerHTML = chips + '<div class="log-empty">За период изменений нет.</div>';
      bindLogChips();
      return;
    }

    var html = chips, lastDay = null;
    events.forEach(function (e) {
      var day = dayLabel(e.at);
      if (day !== lastDay) { html += '<div class="log-day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<div class="log-item"' + ctxAttr({ kind: 'event', key: e.key, title: e.title, rowId: null }) + '>' +
        '<div class="log-who" title="' + esc(e.author) + '">' + esc(initials(e.author)) + '</div>' +
        '<div class="log-main">' +
          '<div class="log-head"><span class="log-author">' + esc(e.author) + '</span>' +
            '<span class="log-time">' + esc(relTime(e.at)) + '</span></div>' +
          logEventBody(e) +
          '<div class="log-issue"><a href="' + jiraUrl(e.key) + '" target="_blank" rel="noopener">' +
            esc(e.key) + ' — ' + esc(e.title) + '</a></div>' +
        '</div></div>';
    });

    storiesBody.innerHTML = html;
    bindLogChips();
  }

  function bindLogChips() {
    storiesBody.querySelectorAll('.log-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.kind !== undefined) logsKind = btn.dataset.kind || null;
        else logsFilter = btn.dataset.author || null;
        renderLogs();
      });
    });
  }

  function openLogs() {
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Изменения за неделю';
    stackKey.textContent = 'Logs';
    stackTitle.textContent = 'Кто что менял за последние ' + ((LOGS && LOGS.days) || 7) + ' дней';
    stackLink.style.display = 'none';

    logsFilter = null;
    logsKind = null;
    renderLogs();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openMetrics() {
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Метрики';
    stackKey.textContent = 'Сводный отчёт';
    stackTitle.textContent = 'Команда за последние 3 спринта';
    stackLink.style.display = 'none';

    storiesBody.innerHTML = fillMetricsPanel();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openPanels(rowId) {
    var epic = EPICS.find(function (e) { return e.rowId === rowId; });
    if (!epic) return;

    storiesLabel.textContent = 'Истории';
    setStackHead(epic);
    fillStoriesPanel(epic);

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function closePanels() {
    closeCommentPopup();
    overlay.classList.remove('open');
    panelStack.classList.remove('open');
  }

  overlay.addEventListener('click', closePanels);
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', closePanels);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!cpop.hidden) { closeCommentPopup(); return; }  // сначала поле заметки
    if (notesPanel.classList.contains('open')) { setNotesOpen(false); return; }  // потом корзина
    closePanels();
  });

  function renderHero() {
    document.getElementById('teamName').textContent = team.team;
    document.getElementById('sprintName').textContent = team.sprintName;
    var bl = document.getElementById('boardLink');
    bl.textContent = team.boardName;
    bl.href = team.boardUrl;
    document.getElementById('teamSwitch').innerHTML = TEAMS.map(function (t) {
      return '<button class="team-tab' + (t.slug === team.slug ? ' active' : '') +
        '" data-team="' + esc(t.slug) + '">' + esc(t.team) + '</button>';
    }).join('');
    document.querySelectorAll('[data-team]').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTeam(btn.dataset.team); });
    });
  }

  // «собрано 28.09 09:00 · team-b@1.2.0 · 9b01e4d» — паспорт сбора из _meta.
  // Объект без _meta (данные до контракта) просто не показывает подвал.
  function renderProvenance() {
    var box = document.getElementById('provenance');
    var rows = TEAMS.map(function (t) {
      var m = t._meta;
      if (!m) return '';
      var when = new Date(m.collectedAt);
      var stamp = isNaN(when.getTime()) ? m.collectedAt :
        ('0' + when.getDate()).slice(-2) + '.' + ('0' + (when.getMonth() + 1)).slice(-2) + ' ' +
        ('0' + when.getHours()).slice(-2) + ':' + ('0' + when.getMinutes()).slice(-2);
      var parts = [esc(t.team) + ': собрано ' + esc(stamp),
                   esc(m.collector) + '@' + esc(m.version)];
      if (m.sha) parts.push(esc(String(m.sha).slice(0, 7)));
      if (m.requests !== undefined) parts.push(m.requests + ' запросов');
      var line = parts.join(' · ');
      if ((m.warnings || []).length) {
        line += '<span class="warn" title="' + esc(m.warnings.join('\n')) + '">' +
          m.warnings.length + ' предупр.</span>';
      }
      return '<div>' + line + '</div>';
    }).join('');
    box.innerHTML = rows;
  }

  function switchTeam(slug) {
    closePanels();
    useTeam(slug);
    migrateNotes();
    fillRefList();
    renderHero();
    renderTable();
    renderMetricsLink();
  }

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  renderHero();
  renderTable();
  renderMetricsLink();
  renderProvenance();
  document.getElementById('logsBtn').addEventListener('click', openLogs);
  // корзина: открыть/закрыть, новая заметка, промт
  notesToggle.addEventListener('click', function () {
    setNotesOpen(!notesPanel.classList.contains('open'));
    if (notesPanel.classList.contains('open')) { renderNotes(); document.getElementById('nText').focus(); }
  });
  var nText = document.getElementById('nText'), nRef = document.getElementById('nRef');
  function addFromBasket() {
    if (addComment(resolveRef(nRef.value), nText.value)) { nText.value = ''; nRef.value = ''; nText.focus(); }
  }
  document.getElementById('nAdd').addEventListener('click', addFromBasket);
  [nText, nRef].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFromBasket(); }
    });
  });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var text = document.getElementById('promptOut').value;
    if (!text) return;
    copyText(text).then(function () {
      copyBtn.textContent = 'Скопировано ✓';
    }, function () {
      document.getElementById('promptOut').select();
      copyBtn.textContent = 'Выделено — Ctrl+C';
    }).then(function () {
      setTimeout(function () { copyBtn.textContent = 'Скопировать промт'; }, 1600);
    });
  });
  document.getElementById('metricsLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMetrics();
  });
</script>

</body>
</html>
