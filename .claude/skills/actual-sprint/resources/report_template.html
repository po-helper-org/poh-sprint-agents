      '<div class="meta-wrap">' +
        '<span data-cmark="' + esc(story.key) + '">' + cmarkHtml(counts[story.key] || 0) + '</span>' +
        '<span class="status ' + bucketClass(story.status, story.category) + '">' + esc(story.status) + '</span>' +
        tail(story) +
      '</div>';
    wrap.appendChild(row);

    var subList = document.createElement('div');
    subList.className = 'sub-list';
    (story.subtasks || []).forEach(function (sub) {
      var subRow = document.createElement('div');
      subRow.className = 'sub-item';
      subRow.innerHTML = '<span class="story-title-wrap"' + ctxAttr(itemTarget('subtask', sub, epic)) + '>' +
        prioHtml(sub.priority) +
        whoHtml(sub.assignee) +
        '<a href="' + jiraUrl(sub.key) + '" target="_blank" rel="noopener">' + esc(sub.key) + ' — ' + esc(sub.summary) + '</a>' +
        '</span>' +
        '<div class="meta-wrap">' +
          '<span data-cmark="' + esc(sub.key) + '">' + cmarkHtml(counts[sub.key] || 0) + '</span>' +
          '<span class="status ' + bucketClass(sub.status, sub.category) + '">' + esc(sub.status) + '</span>' +
          (sub.statusChanged !== undefined ? ageHtml(sub.statusChanged, sub.status, sub.category) : '') +
        '</div>';
      subList.appendChild(subRow);
    });
    wrap.appendChild(subList);

    var toggleBtn = row.querySelector('.story-toggle');
    if (hasSubtasks) {
      toggleBtn.title = 'Подзадачи: ' + story.subtasks.length;
      toggleBtn.addEventListener('click', function () {
        toggleBtn.classList.toggle('open');
        subList.classList.toggle('open');
      });
    }
    return wrap;
  }

  function fillStoriesPanel(epic) {
    storiesBody.innerHTML = '';
    var counts = commentCounts().byKey;

    if (!epic.stories || !epic.stories.length) {
      var empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = 'Историй нет.';
      storiesBody.appendChild(empty);
      return;
    }
    epic.stories.forEach(function (story) {
      storiesBody.appendChild(storyNode(story, epic, counts, function (st) {
        return ageHtml(st.statusChanged, st.status, st.category);
      }));
    });
  }

  // ------------------------- весь эпик -------------------------
  // Полный объём эпика, не только спринт: что сделано и что осталось и в каком процессе.
  // Тот же сайдбар; кнопка в шапке переключает «задачи спринта» ↔ «весь эпик».
  var SCOPE_ORDER = ['blocked', 'progress', 'testing', 'review', 'open'];
  var BUCKET_COLOR = { open: 'var(--c-open)', blocked: 'var(--c-blocked)', progress: 'var(--c-progress)',
                       testing: 'var(--c-testing)', review: 'var(--c-review)', done: 'var(--c-done)' };
  var scopeBtn = document.getElementById('scopeBtn');
  var scopeEpic = null, scopeOn = false;

  function sprintChip(item) {
    if (item.inSprint) return '<span class="chip-sprint now" title="В текущем спринте">в спринте</span>';
    if (item.sprint) return '<span class="chip-sprint" title="Была в спринте отчёта">' + esc(item.sprint) + '</span>';
    return '<span class="chip-sprint" title="Вне спринтов отчёта: бэклог или давнее">вне спринта</span>';
  }

  function scopeSection(id, title, n, body, closed) {
    var sec = document.createElement('section');
    sec.className = 'scope-sec' + (closed ? ' closed' : '');
    sec.dataset.sec = id;
    sec.innerHTML = '<button class="sec-head" type="button" aria-expanded="' + !closed + '">' + esc(title) +
      ' <span class="n">· ' + n + '</span><span class="arr">▼</span></button><div class="sec-body"></div>';
    var head = sec.querySelector('.sec-head');
    head.addEventListener('click', function () {
      sec.classList.toggle('closed');
      head.setAttribute('aria-expanded', String(!sec.classList.contains('closed')));
    });
    body.forEach(function (node) { sec.querySelector('.sec-body').appendChild(node); });
    return sec;
  }

  function renderScope(epic) {
    // у задач текущего спринта берём строку из данных спринта: там у подзадач есть
    // исполнитель и возраст статуса, которых поиск по эпику не отдаёт
    var sprintRows = {};
    (epic.stories || []).forEach(function (st) { sprintRows[st.key] = st; });
    var items = (epic.scope || []).map(function (it) {
      var st = it.inSprint && sprintRows[it.key];
      return st ? Object.assign({}, it, { subtasks: st.subtasks }) : it;
    });
    var counts = commentCounts().byKey;
    var byBucket = {};
    BUCKETS.forEach(function (b) { byBucket[b.id] = []; });
    items.forEach(function (it) { byBucket[classifyBucket(it.status, it.category)].push(it); });
    var done = byBucket.done, left = items.length - done.length;
    var pct = items.length ? Math.round(100 * done.length / items.length) : 0;
    var inSprint = items.filter(function (it) { return it.inSprint; }).length;

    storiesBody.innerHTML = '';
    var sum = document.createElement('div');
    sum.className = 'scope-sum';
    sum.innerHTML = '<span class="big">Сделано ' + done.length + ' из ' + items.length + ' · ' + pct + '%</span>' +
      '<span class="sub">задач эпика · в текущем спринте ' + inSprint + '</span>' +
      '<div class="scope-bar" title="' + esc(BUCKETS.filter(function (b) { return byBucket[b.id].length; })
        .map(function (b) { return byBucket[b.id].length + ' — ' + b.phrase; }).join(', ')) + '">' +
      BUCKETS.filter(function (b) { return byBucket[b.id].length; }).map(function (b) {
        return '<i style="flex:' + byBucket[b.id].length + ';background:' + BUCKET_COLOR[b.id] + '"></i>';
      }).join('') + '</div>';
    storiesBody.appendChild(sum);

    if (!items.length) {
      storiesBody.insertAdjacentHTML('beforeend', '<div class="sidebar-empty">Задач в эпике нет.</div>');
      return;
    }

    // «Осталось» — по процессу: сначала то, что стоит, потом в работе, в конце не начатое
    var leftNodes = [];
    SCOPE_ORDER.forEach(function (id) {
      if (!byBucket[id].length) return;
      var b = BUCKETS.find(function (x) { return x.id === id; });
      var g = document.createElement('div');
      // по умолчанию свёрнуто: сначала картина по статусам, задачи — по клику
      g.className = 'scope-group closed';
      g.dataset.bucket = id;
      g.innerHTML = '<button class="grp-head" type="button" aria-expanded="false">' +
        '<span class="dot" style="background:' + BUCKET_COLOR[id] + '"></span>' +
        esc(b.label) + ' · ' + byBucket[id].length + '<span class="arr">▼</span></button>' +
        '<div class="grp-body"></div>';
      var head = g.querySelector('.grp-head'), body = g.querySelector('.grp-body');
      head.addEventListener('click', function () {
        g.classList.toggle('closed');
        head.setAttribute('aria-expanded', String(!g.classList.contains('closed')));
      });
      byBucket[id].forEach(function (it) { body.appendChild(storyNode(it, epic, counts, sprintChip)); });
      leftNodes.push(g);
    });
    // эпик может быть длинным: при открытии видны только итог и заголовки разделов
    storiesBody.appendChild(scopeSection('left', 'Осталось', left, leftNodes, true));
    storiesBody.appendChild(scopeSection('done', 'Сделано', done.length,
      done.map(function (it) { return storyNode(it, epic, counts, sprintChip); }), true));
  }

  function setScopeMode(on) {
    scopeOn = on && !!(scopeEpic && scopeEpic.scope);
    scopeBtn.setAttribute('aria-pressed', String(scopeOn));
    scopeBtn.textContent = scopeOn ? '← Задачи спринта' : 'Смотреть весь эпик';
    storiesLabel.textContent = scopeOn ? 'Весь эпик' : 'Истории';
    if (scopeOn) renderScope(scopeEpic); else fillStoriesPanel(scopeEpic);
    storiesBody.parentNode.scrollTop = 0;
  }

  scopeBtn.addEventListener('click', function () { setScopeMode(!scopeOn); });

  // ------------------------- сводный отчёт за 3 спринта -------------------------

  function fmt(v) { return v === null || v === undefined ? '—' : String(v).replace('.', ','); }

  // «среднее/медиана/количество» — формат шапки и всех ячеек сводки
  function triple(s) {
    if (!s) return '<span class="m-muted">—</span>';
    return fmt(s.mean) + ' / ' + fmt(s.median) + ' / ' + s.count;
  }

  function renderMetricsLink() {
    var link = document.getElementById('metricsLink');
    var o = METRICS && METRICS.overall;
    link.textContent = o && o.lead ? triple(o.lead).replace(/<[^>]+>/g, '') : '—';
  }

  // ------------------ Burndown текущего спринта ------------------
  // Показывает, сколько задач ещё не закрыто по дням спринта.
  // scope пересчитывается по changelog поля Sprint, поэтому внесённые и
  // вынесенные из спринта задачи видны как ступеньки серой линии объёма.
  function burndownChart() {
    var b = BURNDOWN;
    if (!b || !b.days || !b.days.length) return '<div class="m-muted">Нет данных по спринту.</div>';

    var days = b.days;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var maxY = Math.max.apply(null, days.map(function (d) { return d.scope; })) || 1;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var xOf = function (i) { return padL + innerW * (days.length > 1 ? i / (days.length - 1) : 0); };
    var yOf = function (v) { return padT + innerH * (1 - v / maxY); };

    var parts = [];

    // выходные — светлые полосы
    days.forEach(function (d, i) {
      if (!d.weekend) return;
      var x1 = xOf(i) - innerW / (days.length - 1) / 2;
      var x2 = xOf(i) + innerW / (days.length - 1) / 2;
      parts.push('<rect x="' + Math.max(padL, x1).toFixed(1) + '" y="' + padT +
        '" width="' + Math.max(0, Math.min(W - padR, x2) - Math.max(padL, x1)).toFixed(1) +
        '" height="' + innerH + '" fill="#f4f4f5"/>');
    });

    // сетка и ось Y
    [0, Math.round(maxY / 2), maxY].forEach(function (v) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="10" fill="#666">' + v + '</text>');
    });

    // идеальная линия: от объёма на старте до нуля в конце
    parts.push('<line x1="' + xOf(0) + '" y1="' + yOf(days[0].scope).toFixed(1) +
      '" x2="' + xOf(days.length - 1) + '" y2="' + yOf(0).toFixed(1) +
      '" stroke="#9ca3af" stroke-width="2"/>');

    // фактический остаток — только по сегодняшний день
    var actual = days.filter(function (d) { return !d.future; });
    if (actual.length) {
      var path = actual.map(function (d, i) {
        return (i ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(d.remaining).toFixed(1);
      }).join(' ');
      parts.push('<path d="' + path + '" fill="none" stroke="#dc2626" stroke-width="2"/>');
      actual.forEach(function (d, i) {
        parts.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(d.remaining).toFixed(1) +
          '" r="2.5" fill="#dc2626"><title>' + esc(d.date + ': осталось ' + d.remaining +
          ' из ' + d.scope + ', закрыто ' + d.closed) + '</title></circle>');
      });
    }

    // подписи крайних дат
    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#666">' + esc(b.start) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 8) +
      '" font-size="10" fill="#666" text-anchor="end">' + esc(b.end) + '</text>');

    var last = actual.length ? actual[actual.length - 1] : days[0];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' +
        '<span class="swatch ideal"></span>идеальный темп &nbsp; ' +
        '<span class="swatch actual"></span>фактический остаток<br>' +
        'Сейчас закрыто <b>' + last.closed + '</b> из <b>' + last.scope + '</b>, осталось <b>' +
        last.remaining + '</b>.' +
      '</div>';
  }

  // ------------------ Диаграмма управления ------------------
  // X — дата закрытия, Y — Cycle Time задачи. Синяя линия — скользящее среднее,
  // светлая полоса — коридор ±σ, красная черта — порог выброса (среднее + σ).
  // Точки выше порога подсвечены и вынесены списком под графиком.
  // Цель заметки для задачи из диаграммы: из отчёта, если она там есть (с эпиком),
  // иначе — снимок того, что известно по строке диаграммы.
  function chartItemTarget(row, kind) {
    return entityIndex()[String(row.key).toUpperCase()] ||
      { kind: kind, key: row.key, title: row.title, status: row.status,
        assignee: row.assignee || null, rowId: null };
  }

  function controlChart(c, label, kind) {
    if (!c || !c.points || !c.points.length) {
      return '<div class="m-muted">Нет закрытых ' + esc(label) + ' за период.</div>';
    }

    var pts = c.points;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var maxY = Math.max.apply(null, pts.map(function (p) { return p.cycle; })) || 1;

    var t0 = new Date(pts[0].doneAt).getTime();
    var t1 = new Date(pts[pts.length - 1].doneAt).getTime();
    var span = Math.max(t1 - t0, 1);
    var xOf = function (iso) { return padL + innerW * ((new Date(iso).getTime() - t0) / span); };
    var yOf = function (v) { return padT + innerH * (1 - v / maxY); };

    var parts = [];
    [0, Math.round(maxY / 2), Math.round(maxY)].forEach(function (v) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="10" fill="#666">' + v + '</text>');
    });

    // скользящее среднее по окну из 5 задач + коридор ±σ
    var WIN = 5, avg = [], band = [];
    pts.forEach(function (p, i) {
      var from = Math.max(0, i - Math.floor(WIN / 2));
      var win = pts.slice(from, from + WIN).map(function (q) { return q.cycle; });
      var m = win.reduce(function (a, v) { return a + v; }, 0) / win.length;
      var sd = Math.sqrt(win.reduce(function (a, v) { return a + (v - m) * (v - m); }, 0) / win.length);
      avg.push({ x: xOf(p.doneAt), y: yOf(m) });
      band.push({ x: xOf(p.doneAt), hi: yOf(Math.min(maxY, m + sd)), lo: yOf(Math.max(0, m - sd)) });
    });

    var bandPath = band.map(function (b, i) { return (i ? 'L' : 'M') + b.x.toFixed(1) + ' ' + b.hi.toFixed(1); }).join(' ') +
      ' ' + band.slice().reverse().map(function (b) { return 'L' + b.x.toFixed(1) + ' ' + b.lo.toFixed(1); }).join(' ') + ' Z';
    parts.push('<path d="' + bandPath + '" fill="#2563eb" fill-opacity="0.10"/>');
    parts.push('<path d="' + avg.map(function (a, i) { return (i ? 'L' : 'M') + a.x.toFixed(1) + ' ' + a.y.toFixed(1); }).join(' ') +
      '" fill="none" stroke="#2563eb" stroke-width="2"/>');

    // порог выброса
    parts.push('<line x1="' + padL + '" y1="' + yOf(c.limit).toFixed(1) + '" x2="' + (W - padR) +
      '" y2="' + yOf(c.limit).toFixed(1) + '" stroke="#dc2626" stroke-width="1.5"/>');

    // задачи в зоне риска: ещё не закрыты, но в работе дольше медианы.
    // Ставим их на «сегодня» — по вертикали столько, сколько уже длятся.
    var risks = (c.risks || []).filter(function (r) { return r.elapsed <= maxY; });
    var overflow = (c.risks || []).length - risks.length;
    if (c.risks && c.risks.length) {
      var xRisk = W - padR - 6;
      risks.forEach(function (r) {
        parts.push('<circle cx="' + xRisk.toFixed(1) + '" cy="' + yOf(r.elapsed).toFixed(1) +
          '" r="4" fill="#ca8a04" fill-opacity="0.85" stroke="#ca8a04"><title>' +
          esc(r.key + ' · в работе ' + fmt(r.elapsed) + ' дн. · ' + r.status + '\n' + r.title) +
          '</title></circle>');
      });
    }

    // точки: выбросы крупнее и красные
    pts.forEach(function (p) {
      parts.push('<circle cx="' + xOf(p.doneAt).toFixed(1) + '" cy="' + yOf(p.cycle).toFixed(1) +
        '" r="' + (p.outlier ? 4 : 3) + '" fill="' + (p.outlier ? '#dc2626' : '#16a34a') +
        '" fill-opacity="' + (p.outlier ? 0.85 : 0.5) + '" stroke="' + (p.outlier ? '#dc2626' : '#16a34a') +
        '" stroke-opacity="0.9"><title>' + esc(p.key + ' · ' + fmt(p.cycle) + ' дн. · ' + p.doneAt + '\n' + p.title) +
        '</title></circle>');
    });

    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#666">' + esc(pts[0].doneAt) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 8) +
      '" font-size="10" fill="#666" text-anchor="end">' + esc(pts[pts.length - 1].doneAt) + '</text>');

    // список выбросов — то, ради чего диаграмма и нужна
    var outliers = pts.filter(function (p) { return p.outlier; })
      .sort(function (a, b) { return b.cycle - a.cycle; });
    var listHtml = '';
    if (outliers.length) {
      listHtml += '<div class="outliers"><div class="outliers-head">Выбиваются из коридора (' +
        outliers.length + ' из ' + pts.length + ')</div>' +
        outliers.map(function (p) {
          return '<div class="outlier-row"' + ctxAttr(chartItemTarget(p, kind)) + '>' +
            '<a href="' + jiraUrl(p.key) + '" target="_blank" rel="noopener" title="' + esc(p.key + ' — ' + p.title) + '">' +
              '<span class="key">' + esc(p.key) + '</span>' + esc(p.title) + '</a>' +
            '<span class="status ' + bucketClass(p.status, p.category) + '" title="' + esc(p.status) + '">' + esc(p.status) + '</span>' +
            '<span class="age stale">' + fmt(p.cycle) + ' д</span>' +
            '</div>';
        }).join('') + '</div>';
    }
    if (c.risks && c.risks.length) {
      listHtml += '<div class="outliers"><div class="outliers-head risk">В зоне риска (' + c.risks.length +
        ') — в работе дольше медианы ' + fmt(c.median) + ' дн.</div>' +
        c.risks.map(function (r) {
          return '<div class="outlier-row"' + ctxAttr(chartItemTarget(r, kind)) + '>' +
            '<a href="' + jiraUrl(r.key) + '" target="_blank" rel="noopener" title="' + esc(r.key + ' — ' + r.title) + '">' +
              '<span class="key">' + esc(r.key) + '</span>' + esc(r.title) + '</a>' +
            '<span class="status ' + bucketClass(r.status, r.category) + '" title="' + esc(r.status) + '">' + esc(r.status) + '</span>' +
            '<span class="age risk">' + fmt(r.elapsed) + ' д</span>' +
            '</div>';
        }).join('') + '</div>';
    }

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' +
        '<span class="swatch"></span>скользящее среднее &nbsp; ' +
        '<span class="swatch limit"></span>порог выброса ' + fmt(c.limit) + ' дн. &nbsp; ' +
        '<span class="dot" style="background:var(--c-testing)"></span>в зоне риска' +
        (overflow > 0 ? ' (' + overflow + ' выше шкалы)' : '') +
      '</div>' + listHtml;
  }

  // ------------------ Производительность: запланировано / сделано ------------------
  // Плановый столбец разложен по текущим статусам — видно, где осело незакрытое.
  function velocityChart() {
    var v = VELOCITY;
    if (!v || !v.sprints || !v.sprints.length) return '<div class="m-muted">Нет данных по спринтам.</div>';

    var rows = v.sprints;
    var W = 560, H = 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var maxY = Math.max.apply(null, rows.map(function (r) { return Math.max(r.planned, r.done); })) || 1;
    var yOf = function (val) { return padT + innerH * (1 - val / maxY); };
    var group = innerW / rows.length;
    var barW = Math.min(38, group / 3);

    var parts = [];
    [0, Math.round(maxY / 2), maxY].forEach(function (val) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(val).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(val).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(val) + 4).toFixed(1) + '" font-size="10" fill="#666">' + val + '</text>');
    });

    var STACK = [
      { id: 'open',     label: 'TODO',          color: 'var(--c-open)' },
      { id: 'blocked',  label: 'Заблокировано', color: 'var(--c-blocked)' },
      { id: 'progress', label: 'В работе',      color: 'var(--c-progress)' },
      { id: 'testing',  label: 'Тестирование',  color: 'var(--c-testing)' },
      { id: 'review',   label: 'Ревью',         color: 'var(--c-review)' },
      { id: 'done',     label: 'Готово',        color: 'var(--c-done)' }
    ];

    rows.forEach(function (r, i) {
      var cx = padL + group * i + group / 2;
      var xPlan = cx - barW - 3, xDone = cx + 3;

      // плановый столбец — стопка по статусам снизу вверх
      var acc = 0;
      STACK.forEach(function (seg) {
        var n = (r.split && r.split[seg.id]) || 0;
        if (!n) return;
        var yTop = yOf(acc + n), yBot = yOf(acc);
        parts.push('<rect x="' + xPlan.toFixed(1) + '" y="' + yTop.toFixed(1) +
          '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, yBot - yTop).toFixed(1) +
          '" fill="' + seg.color + '" fill-opacity="0.85"><title>' +
          esc(r.name + ' · ' + seg.label + ': ' + n) + '</title></rect>');
        acc += n;
      });

      // столбец «сделано»
      parts.push('<rect x="' + xDone.toFixed(1) + '" y="' + yOf(r.done).toFixed(1) +
        '" width="' + barW.toFixed(1) + '" height="' + Math.max(0, yOf(0) - yOf(r.done)).toFixed(1) +
        '" fill="var(--c-done)"><title>' + esc(r.name + ' · сделано: ' + r.done) + '</title></rect>');

      parts.push('<text x="' + cx.toFixed(1) + '" y="' + (H - 8) +
        '" font-size="10" fill="#666" text-anchor="middle">' + esc(r.name) + '</text>');
    });

    // линия среднего выполнения
    if (v.avgDone) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v.avgDone).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v.avgDone).toFixed(1) + '" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3"/>');
    }

    var legend = STACK.map(function (seg) {
      return '<span class="dot" style="background:' + seg.color + '"></span>' + esc(seg.label);
    }).join(' &nbsp; ');

    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' + legend + '</div>';
  }

  // «Как читать» — постоянная расшифровка графика в подсказке «i». Интерпретация
  // конкретных цифр — отдельный раздел «Инсайды ИИ» внизу отчёта. Под графиком
  // остаются только легенда и списки.
  var CHART_INFO = {
    burndown: ['Серая линия — идеальный темп: от объёма на старте до нуля в последний день.',
               'Красная — сколько задач осталось на каждый день; точка — подсказка с числами.',
               'Светлые полосы — выходные. Ступенька вверх — в спринт добавили задачи.'],
    velocity: ['Левый столбец — всё, что было в спринте, разложенное по текущему статусу.',
               'Правый — сколько сделано. Пунктир — среднее сделанное за показанные спринты.'],
    control: ['Точка — закрытая задача: по горизонтали дата закрытия, по вертикали Cycle Time — дни от взятия в работу до закрытия.',
              'Синяя линия — скользящее среднее по 5 задачам, светлая полоса — коридор ±σ.',
              'Красная линия — порог выброса: среднее + σ. Выше — задача шла заметно дольше обычного.',
              'Жёлтые точки у правого края — ещё в работе и уже дольше медианы; по высоте — сколько идут на сегодня.']
  };
  var AI_LEVELS = { risk: 'нужна реакция', warn: 'присмотреться', good: 'работает', info: 'наблюдение' };
  var AI_ABOUT = { sprint: 'спринт', team: 'команда', burndown: 'burndown', velocity: 'производительность',
                   controlStories: 'cycle time историй', controlSubtasks: 'cycle time подзадач' };

  // Раздел «Инсайды ИИ»: на что обратить внимание PO, что можно сказать о состоянии
  // команды в этом спринте и о тенденции. Пишет агент (/sprint-insights) по фактам из
  // снимка; runner кладёт в team.insights, только если они написаны по этим же данным.
  // Нет наблюдений — раздел всё равно на месте и говорит, как их получить.
  function insightsSection() {
    var ins = team.insights;
    var list = ins && ins.observations && ins.observations.length ? ins.observations : null;
    var title = 'Инсайды ИИ';
    var body;
    if (!list) {
      body = '<p class="ai-none">ИИ-агент ещё не смотрел этот сбор. Попросите его: <code>/sprint-insights</code> — ' +
        'здесь появятся наблюдения о спринте и команде.</p>';
    } else {
      body = '<p class="ai-lead">На что обратить внимание PO: состояние команды в этом спринте и тенденция</p>' +
        '<ol class="ai-list">' + list.map(function (it) {
          var lvl = AI_LEVELS[it.level] ? it.level : 'info';
          var keys = (it.keys || []).map(function (k) {
            return '<a href="' + jiraUrl(k) + '" target="_blank" rel="noopener">' + esc(k) + '</a>';
          }).join('');
          return '<li class="ai-item lv-' + lvl + '"' + ctxAttr({ kind: 'insight', title: it.text }) + '>' +
            '<div class="ai-meta"><span class="dot"></span><span class="lvl">' + AI_LEVELS[lvl] + '</span>' +
              (AI_ABOUT[it.about] ? '<span class="about">' + AI_ABOUT[it.about] + '</span>' : '') + '</div>' +
            '<p class="ai-text">' + esc(it.text) + '</p>' +
            (it.action ? '<p class="ai-act">→ ' + esc(it.action) + '</p>' : '') +
            (keys ? '<div class="ai-keys">' + keys + '</div>' : '') +
          '</li>';
        }).join('') + '</ol>' +
        '<p class="ai-by">Интерпретация ИИ, не данные' + (ins.author ? ' · ' + esc(ins.author) : '') +
        (ins.generatedAt ? ' · ' + esc(String(ins.generatedAt).slice(0, 16).replace('T', ' ')) : '') + '</p>';
    }
    return '<div class="metrics-section ai-section" id="aiInsights"><h3>' + title + '</h3>' + body + '</div>';
  }

  function infoHtml(kind, stat) {
    var li = function (list) { return '<ul>' + list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; };
    return '<span class="info" tabindex="0" role="button" aria-label="Как читать график">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"' +
      ' stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5.1h.01"/></svg>' +
      '<span class="info-tip" role="tooltip">' + (stat ? '<div class="stat">' + stat + '</div>' : '') +
      '<b>Как читать</b>' + li(CHART_INFO[kind]) +
      '</span></span>';
  }

  function controlStat(c) {
    if (!c || !c.points || !c.points.length) return '';
    return 'За ' + c.days + ' дн.: медиана <strong>' + fmt(c.median) + '</strong> дн., среднее <strong>' +
      fmt(c.mean) + '</strong> дн., σ ' + fmt(c.sd) + '.';
  }

  // раздел графика: правый клик по нему — заметка к графику целиком
  function chartSection(title, info, body) {
    return '<div class="metrics-section"' + ctxAttr({ kind: 'chart', title: title }) + '><h3>' + esc(title) + info + '</h3>' +
      body + '</div>';
  }

  function fillMetricsPanel() {
    var html = '';
    html += chartSection('Burndown текущего спринта', infoHtml('burndown'), burndownChart());
    html += chartSection('Производительность: запланировано / сделано', infoHtml('velocity'), velocityChart());
    html += chartSection('Диаграмма управления — истории', infoHtml('control', controlStat(CONTROL.stories)),
      controlChart(CONTROL.stories, 'историй', 'story'));
    html += chartSection('Диаграмма управления — подзадачи', infoHtml('control', controlStat(CONTROL.subtasks)),
      controlChart(CONTROL.subtasks, 'подзадач', 'subtask'));
    html += insightsSection();
    return html;
  }

  // ------------------ Лента изменений статусов ------------------
  // Кто какую задачу куда перевёл за последнюю неделю. Фильтр по автору.
  var logsFilter = null;

  function relTime(iso) {
    var diff = (Date.now() - new Date(iso).getTime()) / 1000;
    if (diff < 3600) return Math.max(1, Math.round(diff / 60)) + ' мин назад';
    if (diff < 86400) return Math.round(diff / 3600) + ' ч назад';
    var d = new Date(iso);
    return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2);
  }

  function dayLabel(iso) {
    var d = new Date(iso), today = new Date();
    var same = function (a, b) { return a.toDateString() === b.toDateString(); };
    var yest = new Date(today.getTime() - 86400000);
    if (same(d, today)) return 'Сегодня';
    if (same(d, yest)) return 'Вчера';
    return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  }

  function initials(name) {
    var parts = String(name || '').trim().split(/\s+/);
    return parts.slice(0, 2).map(function (p) { return p.charAt(0).toUpperCase(); }).join('');
  }

  // Тип события определяет, что показываем в строке ленты.
  var LOG_KINDS = [
    { id: 'status',  label: 'Смена статуса' },
    { id: 'comment', label: 'Комментарий' },
    { id: 'created', label: 'Создание' }
  ];

  function logEventBody(e) {
    if (e.kind === 'comment') {
      return '<div class="log-move"><span class="log-verb">оставил комментарий</span></div>' +
        '<div class="log-quote">' + esc(e.body || '') + '</div>';
    }
    if (e.kind === 'created') {
      return '<div class="log-move"><span class="log-verb">создал</span>' +
        '<span class="status b-open">' + esc(e.issueType || 'задачу') + '</span></div>';
    }
    return '<div class="log-move">' +
      '<span class="status b-open">' + esc(e.from) + '</span>' +
      '<span class="arrow">→</span>' +
      '<span class="status ' + bucketClass(e.to, e.toCat) + '">' + esc(e.to) + '</span>' +
    '</div>';
  }

  var logsKind = null;

  function renderLogs() {
    var all = (LOGS && LOGS.events) || [];
    var events = all.filter(function (e) {
      if (logsFilter && e.author !== logsFilter) return false;
      if (logsKind && e.kind !== logsKind) return false;
      return true;
    });

    var kinds = (LOGS && LOGS.kinds) || {};
    var chips = '<div class="log-filters">' +
      '<button class="log-chip' + (logsKind ? '' : ' active') + '" data-kind="">Всё · ' + all.length + '</button>' +
      LOG_KINDS.filter(function (k) { return kinds[k.id]; }).map(function (k) {
        return '<button class="log-chip' + (logsKind === k.id ? ' active' : '') +
          '" data-kind="' + k.id + '">' + esc(k.label) + ' · ' + kinds[k.id] + '</button>';
      }).join('') + '</div>' +
      '<div class="log-filters">' +
      '<button class="log-chip' + (logsFilter ? '' : ' active') + '" data-author="">Все</button>' +
      ((LOGS && LOGS.authors) || []).map(function (a) {
        return '<button class="log-chip' + (logsFilter === a[0] ? ' active' : '') +
          '" data-author="' + esc(a[0]) + '">' + esc(initials(a[0])) + ' ' + esc(a[0].split(' ')[0]) + ' · ' + a[1] + '</button>';
      }).join('') + '</div>';

    if (!events.length) {
      storiesBody.innerHTML = chips + '<div class="log-empty">За период изменений нет.</div>';
      bindLogChips();
      return;
    }

    var html = chips, lastDay = null;
    events.forEach(function (e) {
      var day = dayLabel(e.at);
      if (day !== lastDay) { html += '<div class="log-day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<div class="log-item"' + ctxAttr({ kind: 'event', key: e.key, title: e.title, rowId: null }) + '>' +
        '<div class="log-who" title="' + esc(e.author) + '">' + esc(initials(e.author)) + '</div>' +
        '<div class="log-main">' +
          '<div class="log-head"><span class="log-author">' + esc(e.author) + '</span>' +
            '<span class="log-time">' + esc(relTime(e.at)) + '</span></div>' +
          logEventBody(e) +
          '<div class="log-issue"><a href="' + jiraUrl(e.key) + '" target="_blank" rel="noopener">' +
            esc(e.key) + ' — ' + esc(e.title) + '</a></div>' +
        '</div></div>';
    });

    storiesBody.innerHTML = html;
    bindLogChips();
  }

  function bindLogChips() {
    storiesBody.querySelectorAll('.log-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.kind !== undefined) logsKind = btn.dataset.kind || null;
        else logsFilter = btn.dataset.author || null;
        renderLogs();
      });
    });
  }

  function openLogs() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Изменения за неделю';
    stackKey.textContent = 'Logs';
    stackTitle.textContent = 'Кто что менял за последние ' + ((LOGS && LOGS.days) || 7) + ' дней';

    logsFilter = null;
    logsKind = null;
    renderLogs();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openMetrics() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Метрики';
    stackKey.textContent = 'Сводный отчёт';
    stackTitle.textContent = 'Команда за последние 3 спринта';

    storiesBody.innerHTML = fillMetricsPanel();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openPanels(rowId) {
    var epic = EPICS.find(function (e) { return e.rowId === rowId; });
    if (!epic) return;

    setStackHead(epic);
    scopeEpic = epic;
    scopeBtn.hidden = !(epic.epicKey && epic.scope);
    setScopeMode(false);

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function closePanels() {
    closeCommentPopup();
    overlay.classList.remove('open');
    panelStack.classList.remove('open');
  }

  overlay.addEventListener('click', closePanels);
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', closePanels);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!cpop.hidden) { closeCommentPopup(); return; }  // сначала поле заметки
    if (notesPanel.classList.contains('open')) { setNotesOpen(false); return; }  // потом корзина
    closePanels();
  });

  // ===================== Презентация: продвижение за спринт =====================
  // Второй отчёт из тех же данных, для управляющего комитета, PO других департаментов
  // и бизнес-заказчиков: что каждая команда сделала за спринт и как это двигает
  // бизнес-цели. Отчёт PO (страница выше) — для синхронизации с техлидами; здесь —
  // коротко, по слайду на команду. Цифры — из данных сбора, как на странице.
  // Связь «эпик → цель», «что это даёт бизнесу» и просьбы к комитету пишет ИИ-агент
  // (/sprint-insights, блок business); нет их — слайд честно говорит «цель не указана».
  var START_MODE = '{{START_MODE}}';           // 'presentation' — файл для комитета
  var deck = document.getElementById('deck');
  var deckStage = document.getElementById('deckStage');
  var deckIndex = 0, deckSlides = [];

  function withTeam(t, fn) {                     // счётчики бакетов — по карте статусов своей команды
    var prev = team.slug;
    useTeam(t.slug);
    try { return fn(); } finally { useTeam(prev); }
  }

  function ddmm(iso) { return iso ? iso.slice(8, 10) + '.' + iso.slice(5, 7) : '—'; }

  // Темп — та же идеальная прямая, что в burndown и в PDF /sprint-status: от первого
  // дня с ненулевым объёмом до нуля в конце, целые задачи с округлением от половины вверх.
  function teamPace(t) {
    var b = t.burndown || {}, days = b.days || [];
    if (!days.length) return null;
    var past = days.filter(function (d) { return !d.future; });
    var today = past.length ? past[past.length - 1] : days[0];
    var idx = days.indexOf(today);
    var first = 0;
    for (var i = 0; i < days.length; i++) { if (days[i].scope) { first = i; break; } }
    var span = days.length - 1 - first;
    var ideal = idx < first ? null : (span > 0 ? Math.floor(days[first].scope * (1 - (idx - first) / span) + 0.5) : 0);
    var work = days.filter(function (d) { return !d.weekend; });
    return {
      start: b.start, end: b.end, scope: today.scope, closed: today.closed, remaining: today.remaining,
      gap: past.length && ideal !== null ? today.remaining - ideal : 0,
      workday: work.filter(function (d) { return !d.future; }).length, workdays: work.length
    };
  }

  function paceStatus(p) {
    if (!p || !p.scope) return { cls: 'st-none', text: 'нет данных' };
    if (p.gap <= 0) return { cls: 'st-ok', text: 'в графике' };
    if (p.gap / p.scope <= 0.15) return { cls: 'st-lag', text: 'отставание ' + p.gap };
    return { cls: 'st-risk', text: 'риск срыва' };
  }

  function sprintSplit(t) {                       // статусы всех задач спринта — последний столбец velocity
    var s = (t.velocity && t.velocity.sprints) || [];
    var last = s.length ? s[s.length - 1].split : {};
    var get = function (k) { return last[k] || 0; };
    return { done: get('done'), work: get('progress') + get('testing') + get('review'),
             block: get('blocked'), open: get('open') };
  }

  function pbarHtml(parts, total) {
    total = total || 1;
    return '<div class="pbar">' + parts.filter(function (p) { return p[1] > 0; }).map(function (p) {
      return '<i class="' + p[0] + '" style="width:' + (100 * p[1] / total).toFixed(2) + '%"></i>';
    }).join('') + '</div>';
  }

  function teamBusiness(t) { return (t.insights && t.insights.business) || {}; }

  function autoHeadline(t, p) {
    if (!p) return 'Нет данных burndown по спринту.';
    return 'Закрыто ' + p.closed + ' из ' + p.scope + ' задач спринта, рабочий день ' + p.workday + ' из ' + p.workdays + '.';
  }

  // эпики спринта: прогресс всего эпика (объём из JIRA) и вклад этого спринта
  function epicRows(t) {
    var rank = { 'p-highest': 0, 'p-high': 1, 'p-medium': 2, 'p-low': 3, 'p-lowest': 4, 'p-none': 5 };
    return withTeam(t, function () {
      return (t.epics || []).filter(function (e) { return e.epicKey; }).map(function (e) {
        var sprint = tallyEpic(e);
        var scope = e.scope || [];
        var done = 0, inSprintDone = 0;
        scope.forEach(function (it) {
          var d = classifyBucket(it.status, it.category) === 'done';
          if (d) done++;
          if (d && it.inSprint) inSprintDone++;
        });
        var lvl = (prioHtml(e.epicPriority).match(/prio (p-[a-z]+)/) || [])[1] || 'p-none';
        return { key: e.epicKey, title: e.epicTitle, rank: rank[lvl], total: scope.length || sprint.total,
                 done: scope.length ? done : sprint.done, sprintDone: scope.length ? inSprintDone : sprint.done,
                 whole: !!scope.length };
      }).sort(function (a, b) { return a.rank - b.rank; });
    });
  }

  function closedStories(t) {
    return withTeam(t, function () {
      var out = [];
      (t.epics || []).forEach(function (e) {
        (e.stories || []).forEach(function (st) {
          if (classifyBucket(st.status, st.category) === 'done') out.push({ key: st.key, title: st.title, epic: e.epicTitle });
        });
      });
      return out;
    });
  }

  function blockedItems(t) {
    var at = t._meta && t._meta.collectedAt;
    return withTeam(t, function () {
      var out = [];
      (t.epics || []).forEach(function (e) {
        (e.stories || []).forEach(function (st) {
          if (classifyBucket(st.status, st.category) === 'blocked') out.push({ key: st.key, title: st.title, age: statusAgeDays(st.statusChanged, at) });
          (st.subtasks || []).forEach(function (sub) {
            if (classifyBucket(sub.status, sub.category) === 'blocked') out.push({ key: sub.key, title: sub.summary, age: statusAgeDays(sub.statusChanged, at) });
          });
        });
      });
      return out.sort(function (a, b) { return (b.age || 0) - (a.age || 0); });
    });
  }

  // дни без смены статуса на момент сбора: слайды — снимок, а не живая страница
  function statusAgeDays(iso, at) {
    if (!iso) return null;
    var d = new Date(iso), ref = at ? new Date(at) : new Date();
    if (isNaN(d.getTime()) || isNaN(ref.getTime())) return null;
    return Math.max(0, Math.floor((ref.getTime() - d.getTime()) / 86400000));
  }

  function aiMark(t) {
    var ins = t.insights;
    if (!ins || !ins.business) return '';
    return '<span class="ai-mark">Цели и выводы — интерпретация ИИ' + (ins.author ? ' · ' + esc(ins.author) : '') + '</span>';
  }

  function slideTitle() {
    var stamp = TEAMS.map(function (t) { return t._meta && t._meta.collectedAt; }).filter(Boolean).sort().pop();
    return '<section class="slide dark">' +
      '<div class="kicker">Продвижение за спринт</div>' +
      '<h1>Что команды сделали за спринт<br>и как это двигает бизнес-цели</h1>' +
      '<p class="lead">Краткий отчёт для управляющего комитета, PO смежных департаментов и бизнес-заказчиков.</p>' +
      '<div class="t-teams">' + TEAMS.map(function (t) {
        var p = teamPace(t);
        return '<div>' + esc(t.team) + ' <span>· ' + esc(t.sprintName) + (p ? ' · ' + ddmm(p.start) + '–' + ddmm(p.end) : '') + '</span></div>';
      }).join('') + '</div>' +
      '<div class="spacer"></div>' +
      '<div class="foot">Данные JIRA на <span class="mono">' + esc(stamp ? stamp.slice(8, 10) + '.' + stamp.slice(5, 7) + ' ' + stamp.slice(11, 16) : '—') +
      '</span> · цифры собраны скриптом, без ручной правки</div>' +
    '</section>';
  }

  function slideSummary() {
    var pages = [];
    for (var i = 0; i < TEAMS.length; i += 5) pages.push(TEAMS.slice(i, i + 5));
    return pages.map(function (teams, n) {
      return summaryPage(teams, pages.length > 1 ? ' · ' + (n + 1) + ' из ' + pages.length : '');
    }).join('');
  }

  function summaryPage(teams, part) {
    return '<section class="slide">' +
      '<div class="kicker">Сводка' + part + '</div><h2>Как идут команды</h2>' +
      '<div class="sum-rows">' + teams.map(function (t) {
        var p = teamPace(t), st = paceStatus(p), sp = sprintSplit(t), biz = teamBusiness(t);
        var total = sp.done + sp.work + sp.block + sp.open;
        return '<div class="sum-row">' +
          '<div class="sum-who">' + esc(t.team) + '<span class="mono">' + esc(t.sprintName) +
            (p ? ' · день ' + p.workday + ' из ' + p.workdays : '') + '</span></div>' +
          '<div>' + pbarHtml([['s-done', sp.done], ['s-work', sp.work], ['s-block', sp.block], ['s-open', sp.open]], total) +
            '<div class="hl">' + esc(biz.headline || autoHeadline(t, p)) + '</div></div>' +
          '<div class="num">' + (p ? p.closed + ' / ' + p.scope : '—') + '<small>сделано / в спринте</small></div>' +
          '<div class="st"><span class="chip ' + st.cls + '">' + esc(st.text) + '</span></div>' +
        '</div>';
      }).join('') + '</div>' +
      '<div class="pbar-legend"><span><i style="background:#7cc69a"></i>сделано</span><span><i style="background:#8fb3e8"></i>в работе, тесте, ревью</span>' +
        '<span><i style="background:#eda27e"></i>заблокировано</span><span><i style="background:#c9c5bf"></i>не начато</span></div>' +
    '</section>';
  }

  function slideTeam(t) {
    var p = teamPace(t), st = paceStatus(p), biz = teamBusiness(t), goals = biz.goals || {};
    var allEps = epicRows(t), eps = allEps.slice(0, 4), done = closedStories(t), blocked = blockedItems(t);
    var paceVal = !p ? '—' : p.gap > 0 ? '−' + p.gap : 'в графике';
    var list = function (items, cls, max, render) {
      if (!items.length) return '';
      return '<ul class="tm-list ' + cls + '">' + items.slice(0, max).map(render).join('') + '</ul>' +
        (items.length > max ? '<div class="tm-more">и ещё ' + (items.length - max) + '</div>' : '');
    };
    var value = (biz.value || []).slice(0, 3);
    return '<section class="slide">' +
      '<div class="tm-head"><div class="grow"><h2>' + esc(t.team) + '</h2>' +
        '<div class="mono">' + esc(t.sprintName) + (p ? ' · ' + ddmm(p.start) + '–' + ddmm(p.end) + ' · рабочий день ' + p.workday + ' из ' + p.workdays : '') + '</div></div>' +
        '<span class="chip ' + st.cls + '">' + esc(st.text) + '</span></div>' +
      '<p class="tm-hl' + (biz.headline ? '' : ' auto') + '">' + esc(biz.headline || autoHeadline(t, p)) + '</p>' +
      '<div class="kpis">' +
        '<div class="kpi"><div class="lbl">Сделано в спринте</div><div class="val accent">' + (p ? p.closed + ' / ' + p.scope : '—') + '</div>' +
          '<div class="sub">' + (p && p.scope ? Math.round(100 * p.closed / p.scope) + '% задач спринта' : '') + '</div></div>' +
        '<div class="kpi"><div class="lbl">Темп к плану</div><div class="val">' + esc(paceVal) + '</div>' +
          '<div class="sub">' + (p && p.gap > 0 ? 'задач позади идеального темпа' : 'остаток не выше идеальной прямой') + '</div></div>' +
        '<div class="kpi"><div class="lbl">Блокеры</div><div class="val">' + blocked.length + '</div>' +
          '<div class="sub">' + (blocked.length ? 'задач ждут внешнего решения' : 'ничего не блокирует') + '</div></div>' +
      '</div>' +
      '<div class="tm-cols"><div>' +
        '<h3>Эпики → бизнес-цели</h3>' + (eps.length ? eps.map(function (e) {
          var pct = e.total ? Math.round(100 * e.done / e.total) : 0;
          var goal = goals[e.key];
          return '<div class="ep"><div class="ep-top"><span class="ep-title">' + esc(e.title) + '</span>' +
            '<span class="ep-pct">' + pct + '%<small> · ' + e.done + '/' + e.total + (e.sprintDone ? ' · +' + e.sprintDone + ' за спринт' : '') + '</small></span></div>' +
            '<div class="ep-goal' + (goal ? '' : ' none') + '">' + (goal ? '→ ' + esc(goal) : 'цель не указана') + '</div>' +
            pbarHtml([['s-done', e.done], ['s-open', e.total - e.done]], e.total) + '</div>';
        }).join('') + (allEps.length > eps.length ? '<div class="tm-more">и ещё эпиков: ' + (allEps.length - eps.length) + ' — в отчёте PO</div>' : '')
          : '<div class="ep-goal none">Эпиков в спринте нет.</div>') +
      '</div><div class="tm-side">' +
        (value.length ? '<div><h3>Что это даёт бизнесу</h3>' + list(value, 'value', 3, function (v) { return '<li>' + esc(v) + '</li>'; }) + '</div>' : '') +
        '<div><h3>Сделано за спринт</h3>' + (done.length ? list(done, 'done', value.length ? 3 : 5, function (s) {
          return '<li>' + esc(s.title) + ' <span class="mono">' + esc(s.key) + '</span></li>'; }) : '<div class="ep-goal none">Закрытых историй пока нет.</div>') + '</div>' +
        (blocked.length ? '<div><h3>Риски</h3>' + list(blocked, 'block', 2, function (b) {
          return '<li>' + esc(b.title) + ' <span class="mono">' + esc(b.key) + (b.age !== null ? ' · ' + b.age + ' дн.' : '') + '</span></li>'; }) + '</div>' : '') +
      '</div></div>' +
      '<div class="foot">' + aiMark(t) + '</div>' +
    '</section>';
  }

  function slideAsks() {
    var asks = [];
    TEAMS.forEach(function (t) {
      (teamBusiness(t).asks || []).forEach(function (a) { asks.push({ team: t.team, a: a }); });
    });
    if (!asks.length) return '';
    return '<section class="slide dark"><div class="kicker">Решения</div><h2>Что нужно от комитета</h2>' +
      '<div class="asks">' + asks.slice(0, 6).map(function (x, i) {
        return '<div class="ask"><div class="n">' + (i + 1) + '</div><div class="team">' + esc(x.team) + '</div>' +
          '<div class="t">' + esc(x.a.title) + '</div>' +
          (x.a.why ? '<div class="why">' + esc(x.a.why) + '</div>' : '') +
          (x.a.ask ? '<div class="a">' + esc(x.a.ask) + '</div>' : '') + '</div>';
      }).join('') + '</div><div class="spacer"></div>' +
      '<div class="foot">Просьбы сформулированы ИИ-агентом PO по данным спринта — подтверждаются PO на комитете</div></section>';
  }

  function buildDeck() {
    deckStage.innerHTML = slideTitle() + slideSummary() + TEAMS.map(slideTeam).join('') + slideAsks();
    deckSlides = Array.prototype.slice.call(deckStage.querySelectorAll('.slide'));
  }

  function isFeed() {
    return window.matchMedia && window.matchMedia('(max-width: 700px) and (orientation: portrait)').matches;
  }

  function fitDeck() {
    deck.classList.toggle('feed', isFeed());
    if (deck.classList.contains('feed')) return;
    var w = deckStage.clientWidth, h = deckStage.clientHeight;
    var k = Math.min((w - 32) / 1600, (h - 24) / 900);
    deckSlides.forEach(function (sl) {
      sl.style.transform = 'translate(-50%, -50%) scale(' + k.toFixed(4) + ')';
    });
  }

  function showSlide(i) {
    deckIndex = Math.max(0, Math.min(deckSlides.length - 1, i));
    deckSlides.forEach(function (sl, n) { sl.classList.toggle('current', n === deckIndex); });
    document.getElementById('deckCount').textContent = (deckIndex + 1) + ' / ' + deckSlides.length;
    document.getElementById('deckPrev').disabled = deckIndex === 0;
    document.getElementById('deckNext').disabled = deckIndex === deckSlides.length - 1;
  }

  function openDeck() {
    closePanels();
    if (typeof setNotesOpen === 'function') setNotesOpen(false);
    buildDeck();
    deck.hidden = false;
    document.body.style.overflow = 'hidden';
    fitDeck();
    showSlide(0);
    if (location.hash !== '#presentation') history.replaceState(null, '', '#presentation');
  }

  function closeDeck() {
    if (START_MODE === 'presentation') return;      // у файла для комитета отчёта PO под слайдами нет
    deck.hidden = true;
    document.body.style.overflow = '';
    if (location.hash === '#presentation') history.replaceState(null, '', location.pathname + location.search);
  }

  document.getElementById('presBtn').addEventListener('click', openDeck);
  document.getElementById('deckClose').addEventListener('click', closeDeck);
  document.getElementById('deckPrev').addEventListener('click', function () { showSlide(deckIndex - 1); });
  document.getElementById('deckNext').addEventListener('click', function () { showSlide(deckIndex + 1); });
  document.getElementById('deckPrint').addEventListener('click', function () {
    document.body.classList.add('printing');
    window.print();
  });
  window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); });
  window.addEventListener('resize', function () { if (!deck.hidden) fitDeck(); });
  document.addEventListener('keydown', function (e) {
    if (deck.hidden) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); showSlide(deckIndex + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showSlide(deckIndex - 1); }
    else if (e.key === 'Home') showSlide(0);
    else if (e.key === 'End') showSlide(deckSlides.length - 1);
    else if (e.key === 'Escape') { e.stopImmediatePropagation(); closeDeck(); }
  }, true);
  // свайп по слайдам (телефон боком, планшет)
  var swipeX = null;
  deckStage.addEventListener('touchstart', function (e) { swipeX = e.touches.length === 1 ? e.touches[0].clientX : null; }, { passive: true });
  deckStage.addEventListener('touchend', function (e) {
    if (swipeX === null || deck.classList.contains('feed')) return;
    var dx = e.changedTouches[0].clientX - swipeX;
    if (Math.abs(dx) > 50) showSlide(deckIndex + (dx < 0 ? 1 : -1));
    swipeX = null;
  });

  function renderHero() {
    document.getElementById('teamName').textContent = team.team;
    document.getElementById('sprintName').textContent = team.sprintName;
    var bl = document.getElementById('boardLink');
    bl.textContent = team.boardName;
    bl.href = team.boardUrl;
    document.getElementById('teamSwitch').innerHTML = TEAMS.map(function (t) {
      return '<button class="team-tab' + (t.slug === team.slug ? ' active' : '') +
        '" data-team="' + esc(t.slug) + '">' + esc(t.team) + '</button>';
    }).join('');
    document.querySelectorAll('[data-team]').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTeam(btn.dataset.team); });
    });
  }

  function switchTeam(slug) {
    closePanels();
    useTeam(slug);
    migrateNotes();
    fillRefList();
    renderHero();
    renderTable();
    renderMetricsLink();
  }

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  renderHero();
  renderTable();
  renderMetricsLink();
  document.getElementById('logsBtn').addEventListener('click', openLogs);
  if (START_MODE === 'presentation') {
    document.getElementById('deckClose').hidden = true;
    document.title = 'Продвижение за спринт';
    openDeck();
  } else if (location.hash === '#presentation') {
    openDeck();
  }
  // корзина: открыть/закрыть, новая заметка, промт
  notesToggle.addEventListener('click', function () {
    setNotesOpen(!notesPanel.classList.contains('open'));
    if (notesPanel.classList.contains('open')) { renderNotes(); document.getElementById('nText').focus(); }
  });
  var nText = document.getElementById('nText'), nRef = document.getElementById('nRef');
  var nCompose = document.getElementById('nCompose');
  function syncCompose() {
    nCompose.classList.toggle('filled', !!(nText.value || nRef.value));
    nText.style.height = 'auto';
    nText.style.height = Math.min(nText.scrollHeight + 2, 160) + 'px';
  }
  function addFromBasket() {
    if (addComment(resolveRef(nRef.value), nText.value)) { nText.value = ''; nRef.value = ''; syncCompose(); nText.focus(); }
  }
  nText.addEventListener('input', syncCompose);
  nRef.addEventListener('input', syncCompose);
  [nText, nRef].forEach(function (el) {
    el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); addFromBasket(); }
    });
  });

  var copyBtn = document.getElementById('copyBtn');
  copyBtn.addEventListener('click', function () {
    var text = document.getElementById('promptOut').value;
    if (!text) return;
    copyText(text).then(function () {
      copyBtn.textContent = 'Скопировано ✓';
    }, function () {
      var view = document.getElementById('promptOut');
      view.classList.add('open'); view.select();
      copyBtn.textContent = 'Выделено — Ctrl+C';
    }).then(function () {
      setTimeout(function () { copyBtn.textContent = 'Скопировать промт для ИИ'; }, 1600);
    });
  });
  var promptShow = document.getElementById('promptShow');
  promptShow.innerHTML = svgIcon('eye');
  promptShow.addEventListener('click', function () {
    document.getElementById('promptOut').classList.toggle('open');
  });
  document.getElementById('metricsLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMetrics();
  });
</script>

</body>
</html>
