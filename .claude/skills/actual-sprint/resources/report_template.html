<!DOCTYPE html>
<html lang="ru">
<head>
<!--#include shared/head.html-->
<title>Отчёт по спринтам команд</title>
<style>
/*#include shared/core.css*/
</style>
</head>
<body>
<!-- Отчёт PO (навык actual-sprint): эпики спринта, сводный отчёт, интерпретация ИИ.
     Общий движок — resources/shared; бизнес-отчёт — отдельный навык sprint-business. -->

<div class="promptbox" id="promptbox">
  <div class="pb-row">
    <button class="pres-btn" id="bizBtn" title="Промт для генерации бизнес-отчёта «ФАКТ | спринт» для управляющего комитета">Бизнес-отчёт</button>
    <button class="logs-btn" id="logsBtn" title="Кто что менял за спринт">Logs</button>
    <button class="pb-toggle" id="notesToggle" aria-expanded="false" aria-controls="notesPanel"
      title="Заметки к спринту и промт для ИИ">Комментарии (<span id="cCount">0</span>)</button>
  </div>
<!--#include shared/notes.html-->
</div>

<div class="hero">
  <div class="team">Команда</div>
  <div class="name-row">
    <h1 id="teamName">—</h1>
    <button class="interp-btn" id="interpBtn" type="button" aria-label="Интерпретация ИИ"
            title="Интерпретация ИИ: динамика команды, на что обратить внимание, рекомендации">!</button>
  </div>
  <div class="team-switch" id="teamSwitch"></div>
  <div class="meta">
    <div>Спринт: <strong id="sprintName">—</strong></div>
    <div>Доска: <strong><a class="board-link" id="boardLink" href="#" target="_blank" rel="noopener">—</a></strong></div>
    <div>Lead Time за 3 спринта:
      <strong><a class="metrics-link" href="#" id="metricsLink" title="Среднее / медиана / количество закрытых запросов. Открыть сводный отчёт">—</a></strong>
    </div>
  </div>
</div>

<main>
  <table>
    <tbody id="tableBody"></tbody>
  </table>
</main>


<!--#include shared/panels.html-->

<script>
/*#include shared/core.js*/
  var tableBody = document.getElementById('tableBody');

  // подсказка: только ненулевые бакеты, «2 — в бэклоге, 1 — в ревью»
  function tallyTip(counts) {
    var parts = BUCKETS
      .filter(function (b) { return counts[b.id] > 0; })
      .map(function (b) { return counts[b.id] + ' — ' + b.phrase; });
    if (!parts.length) return 'Задач нет';
    return parts.join(', ') + ' · всего ' + counts.total;
  }

  function tallyHtml(counts) {
    var nums = BUCKETS.map(function (b) {
      var n = counts[b.id];
      return '<span class="n ' + b.cls + (n ? '' : ' zero') + '">' + n + '</span>';
    }).join('<span class="sep">/</span>');
    return '<span class="tally-box">' + nums + '<span class="tip">' + esc(tallyTip(counts)) + '</span></span>';
  }

  // метки заметок у строк эпиков
  function pageMarks(counts) {
    tableBody.querySelectorAll('tr[data-row]').forEach(function (tr) {
      var btn = tr.querySelector('.action-btn');
      var n = counts.byRow[tr.dataset.row] || 0;
      btn.classList.toggle('has-note', !!n);
      btn.title = n ? 'Заметок по эпику: ' + n : '';
    });
  }

  function renderTable() {

    tableBody.innerHTML = EPICS.map(function (e) {
      // название эпика — просто текст: ссылка на JIRA живёт в шапке панели,
      // иначе клик по строке конфликтует с переходом по ссылке
      var epicCell = e.epicKey
        ? prioHtml(e.epicPriority) + esc(e.epicTitle)
        : '<span class="prio p-none"></span><span class="no-epic">' + esc(e.epicTitle || 'Без эпика') + '</span>';
      return (
        '<tr data-row="' + esc(e.rowId) + '"' + ctxAttr(epicTarget(e)) + '>' +
          '<td class="epic">' + epicCell + '</td>' +
          '<td class="tally">' + tallyHtml(tallyEpic(e)) + '</td>' +
          '<td class="actions"><button class="action-btn" data-open="' + esc(e.rowId) + '">Статус</button></td>' +
        '</tr>'
      );
    }).join('');

    // клик по любому месту строки открывает панель
    tableBody.querySelectorAll('tr').forEach(function (tr) {
      var rowId = tr.dataset.row;
      tr.addEventListener('click', function () { openPanels(rowId); });
    });
    refreshComments();
  }

  // ------------------------- сводный отчёт за 3 спринта -------------------------


  // «среднее/медиана/количество» — формат шапки и всех ячеек сводки
  function triple(s) {
    if (!s) return '<span class="m-muted">—</span>';
    return fmt(s.mean) + ' / ' + fmt(s.median) + ' / ' + s.count;
  }

  function renderMetricsLink() {
    var link = document.getElementById('metricsLink');
    var o = METRICS && METRICS.overall;
    link.textContent = o && o.lead ? triple(o.lead).replace(/<[^>]+>/g, '') : '—';
  }

  // ------------------ Burndown текущего спринта ------------------
  // Показывает, сколько задач ещё не закрыто по дням спринта.
  // scope пересчитывается по changelog поля Sprint, поэтому внесённые и
  // вынесенные из спринта задачи видны как ступеньки серой линии объёма.
  function burndownChart() {
    var b = BURNDOWN;
    if (!b || !b.days || !b.days.length) return '<div class="m-muted">Нет данных по спринту.</div>';

    var days = b.days;
    var W = (CHART_BOX && CHART_BOX.W) || 560, H = (CHART_BOX && CHART_BOX.H) || 210, padL = 34, padR = 14, padT = 12, padB = 30;
    var maxY = Math.max.apply(null, days.map(function (d) { return d.scope; })) || 1;
    var innerW = W - padL - padR, innerH = H - padT - padB;
    var xOf = function (i) { return padL + innerW * (days.length > 1 ? i / (days.length - 1) : 0); };
    var yOf = function (v) { return padT + innerH * (1 - v / maxY); };

    var parts = [];

    // выходные — светлые полосы
    days.forEach(function (d, i) {
      if (!d.weekend) return;
      var x1 = xOf(i) - innerW / (days.length - 1) / 2;
      var x2 = xOf(i) + innerW / (days.length - 1) / 2;
      parts.push('<rect x="' + Math.max(padL, x1).toFixed(1) + '" y="' + padT +
        '" width="' + Math.max(0, Math.min(W - padR, x2) - Math.max(padL, x1)).toFixed(1) +
        '" height="' + innerH + '" fill="#f4f4f5"/>');
    });

    // сетка и ось Y
    [0, Math.round(maxY / 2), maxY].forEach(function (v) {
      parts.push('<line x1="' + padL + '" y1="' + yOf(v).toFixed(1) + '" x2="' + (W - padR) +
        '" y2="' + yOf(v).toFixed(1) + '" stroke="#eee"/>');
      parts.push('<text x="4" y="' + (yOf(v) + 4).toFixed(1) + '" font-size="10" fill="#666">' + v + '</text>');
    });

    // идеальная линия: от объёма на старте до нуля в конце
    parts.push('<line x1="' + xOf(0) + '" y1="' + yOf(days[0].scope).toFixed(1) +
      '" x2="' + xOf(days.length - 1) + '" y2="' + yOf(0).toFixed(1) +
      '" stroke="#9ca3af" stroke-width="2"/>');

    // фактический остаток — только по сегодняшний день
    var actual = days.filter(function (d) { return !d.future; });
    if (actual.length) {
      var path = actual.map(function (d, i) {
        return (i ? 'L' : 'M') + xOf(i).toFixed(1) + ' ' + yOf(d.remaining).toFixed(1);
      }).join(' ');
      parts.push('<path d="' + path + '" fill="none" stroke="#dc2626" stroke-width="2"/>');
      actual.forEach(function (d, i) {
        parts.push('<circle cx="' + xOf(i).toFixed(1) + '" cy="' + yOf(d.remaining).toFixed(1) +
          '" r="2.5" fill="#dc2626"><title>' + esc(d.date + ': осталось ' + d.remaining +
          ' из ' + d.scope + ', закрыто ' + d.closed) + '</title></circle>');
      });
    }

    // подписи крайних дат
    parts.push('<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#666">' + esc(b.start) + '</text>');
    parts.push('<text x="' + (W - padR) + '" y="' + (H - 8) +
      '" font-size="10" fill="#666" text-anchor="end">' + esc(b.end) + '</text>');

    var last = actual.length ? actual[actual.length - 1] : days[0];
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
      parts.join('') + '</svg>' +
      '<div class="chart-legend">' +
        '<span class="swatch ideal"></span>идеальный темп &nbsp; ' +
        '<span class="swatch actual"></span>фактический остаток<br>' +
        'Сейчас закрыто <b>' + last.closed + '</b> из <b>' + last.scope + '</b>, осталось <b>' +
        last.remaining + '</b>.' +
      '</div>';
  }

  // «Как читать» — постоянная расшифровка графика в подсказке «i». Интерпретация
  // конкретных цифр — отдельный раздел «Инсайды ИИ» внизу отчёта. Под графиком
  // остаются только легенда и списки.
  var CHART_INFO = {
    burndown: ['Серая линия — идеальный темп: от объёма на старте до нуля в последний день.',
               'Красная — сколько задач осталось на каждый день; точка — подсказка с числами.',
               'Светлые полосы — выходные. Ступенька вверх — в спринт добавили задачи.'],
    velocity: ['Левый столбец — всё, что было в спринте, разложенное по текущему статусу.',
               'Правый — сколько сделано. Пунктир — среднее сделанное за показанные спринты.'],
    control: ['Точка — закрытая задача: по горизонтали дата закрытия, по вертикали Cycle Time — дни от взятия в работу до закрытия.',
              'Синяя линия — скользящее среднее по 5 задачам, светлая полоса — коридор ±σ.',
              'Красная линия — порог выброса: среднее + σ. Выше — задача шла заметно дольше обычного.',
              'Жёлтые точки у правого края — ещё в работе и уже дольше медианы; по высоте — сколько идут на сегодня.']
  };
  var AI_LEVELS = { risk: 'нужна реакция', warn: 'присмотреться', good: 'работает', info: 'наблюдение' };
  var AI_ABOUT = { sprint: 'спринт', team: 'команда', burndown: 'burndown', velocity: 'производительность',
                   controlStories: 'cycle time историй', controlSubtasks: 'cycle time подзадач' };

  // Раздел «Инсайды ИИ»: на что обратить внимание PO, что можно сказать о состоянии
  // команды в этом спринте и о тенденции. Пишет агент (/sprint-insights) по фактам из
  // снимка; runner кладёт в team.insights, только если они написаны по этим же данным.
  // Нет наблюдений — раздел всё равно на месте и говорит, как их получить.
  function insightsSection() {
    var ins = team.insights;
    var list = ins && ins.observations && ins.observations.length ? ins.observations : null;
    var title = 'Инсайды ИИ';
    var body;
    if (!list) {
      body = '<p class="ai-none">ИИ-агент ещё не смотрел этот сбор. Попросите его: <code>/sprint-insights</code> — ' +
        'здесь появятся наблюдения о спринте и команде.</p>';
    } else {
      body = '<p class="ai-lead">На что обратить внимание PO: состояние команды в этом спринте и тенденция</p>' +
        '<ol class="ai-list">' + list.map(function (it) {
          var lvl = AI_LEVELS[it.level] ? it.level : 'info';
          var keys = (it.keys || []).map(function (k) {
            return '<a href="' + jiraUrl(k) + '" target="_blank" rel="noopener">' + esc(k) + '</a>';
          }).join('');
          return '<li class="ai-item lv-' + lvl + '"' + ctxAttr({ kind: 'insight', title: it.text }) + '>' +
            '<div class="ai-meta"><span class="dot"></span><span class="lvl">' + AI_LEVELS[lvl] + '</span>' +
              (AI_ABOUT[it.about] ? '<span class="about">' + AI_ABOUT[it.about] + '</span>' : '') + '</div>' +
            '<p class="ai-text">' + esc(it.text) + '</p>' +
            (it.action ? '<p class="ai-act">→ ' + esc(it.action) + '</p>' : '') +
            (keys ? '<div class="ai-keys">' + keys + '</div>' : '') +
          '</li>';
        }).join('') + '</ol>' +
        '<p class="ai-by">Интерпретация ИИ, не данные' + (ins.author ? ' · ' + esc(ins.author) : '') +
        (ins.generatedAt ? ' · ' + esc(String(ins.generatedAt).slice(0, 16).replace('T', ' ')) : '') + '</p>';
    }
    return '<div class="metrics-section ai-section" id="aiInsights"><h3>' + title + '</h3>' + body + '</div>';
  }

  // Интерпретация динамики команды (отдельный промт sprint-insights/prompts/interpretation.md):
  // пишется ИИ-агентом на этапе генерации отчёта, показывается сайдбаром по «!» в шапке.
  var INTERP_PARTS = [
    ['dynamics', 'Что можно сказать о динамике команды'],
    ['attention', 'На что стоит обратить внимание'],
    ['recommendations', 'Рекомендации на будущее']
  ];

  function interpretation() {
    return team.insights && team.insights.interpretation || null;
  }

  function keyLinks(text) {
    return esc(text).replace(/\b[A-Z][A-Z0-9_]*-\d+\b/g, function (k) {
      return '<a href="' + jiraUrl(k) + '" target="_blank" rel="noopener">' + k + '</a>';
    });
  }

  function interpretationHtml() {
    var it = interpretation(), ins = team.insights;
    if (!it) {
      return '<p class="ai-none">Интерпретации по этому сбору нет. Её пишет ИИ-агент при генерации отчёта ' +
        '(<code>/actual-sprint</code>), отдельно — <code>/sprint-insights</code>.</p>';
    }
    return (ins.stale ? '<p class="interp-stale">Написано по прошлому сбору: данные с тех пор обновились. ' +
        'Свежая интерпретация — <code>/sprint-insights</code>.</p>' : '') +
      INTERP_PARTS.map(function (p) {
        var items = it[p[0]] || [];
        return '<section class="interp-sec" data-part="' + p[0] + '"><h3>' + p[1] + '</h3><ul>' +
          items.map(function (x) {
            return '<li' + ctxAttr({ kind: 'insight', title: x }) + '>' + keyLinks(x) + '</li>';
          }).join('') + '</ul></section>';
      }).join('') +
      '<p class="ai-by">Интерпретация ИИ, не данные' + (ins.author ? ' · ' + esc(ins.author) : '') +
      (ins.generatedAt ? ' · ' + esc(String(ins.generatedAt).slice(0, 16).replace('T', ' ')) : '') + '</p>';
  }

  function refreshInterpBtn() {
    var it = interpretation(), btn = document.getElementById('interpBtn');
    btn.classList.toggle('empty', !it);
    btn.classList.toggle('stale', !!(it && team.insights.stale));
    btn.title = !it ? 'Интерпретации ИИ по этому сбору нет'
      : team.insights.stale ? 'Интерпретация ИИ по прошлому сбору'
      : 'Интерпретация ИИ: динамика команды, на что обратить внимание, рекомендации';
  }

  function openInterpretation() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Команда за последние 3 спринта';
    stackKey.textContent = 'Интерпретация ИИ';
    stackTitle.textContent = team.team + ' · ' + team.sprintName;
    storiesBody.innerHTML = interpretationHtml();
    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function infoHtml(kind, stat) {
    var li = function (list) { return '<ul>' + list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; };
    return '<span class="info" tabindex="0" role="button" aria-label="Как читать график">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"' +
      ' stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5.1h.01"/></svg>' +
      '<span class="info-tip" role="tooltip">' + (stat ? '<div class="stat">' + stat + '</div>' : '') +
      '<b>Как читать</b>' + li(CHART_INFO[kind]) +
      '</span></span>';
  }

  function controlStat(c) {
    if (!c || !c.points || !c.points.length) return '';
    return 'За ' + c.days + ' дн.: медиана <strong>' + fmt(c.median) + '</strong> дн., среднее <strong>' +
      fmt(c.mean) + '</strong> дн., σ ' + fmt(c.sd) + '.';
  }

  // раздел графика: правый клик по нему — заметка к графику целиком
  function chartSection(title, info, body) {
    return '<div class="metrics-section"' + ctxAttr({ kind: 'chart', title: title }) + '><h3>' + esc(title) + info + '</h3>' +
      body + '</div>';
  }

  function fillMetricsPanel() {
    var html = '';
    html += chartSection('Burndown текущего спринта', infoHtml('burndown'), burndownChart());
    html += chartSection('Производительность: запланировано / сделано', infoHtml('velocity'), velocityChart());
    html += chartSection('Диаграмма управления — истории', infoHtml('control', controlStat(CONTROL.stories)),
      controlChart(CONTROL.stories, 'историй', 'story'));
    html += chartSection('Диаграмма управления — подзадачи', infoHtml('control', controlStat(CONTROL.subtasks)),
      controlChart(CONTROL.subtasks, 'подзадач', 'subtask'));
    html += insightsSection();
    return html;
  }

  // ------------------ Лента изменений статусов ------------------
  // Кто какую задачу куда перевёл за последнюю неделю. Фильтр по автору.
  var logsFilter = null;

  var logsKind = null;

  function renderLogs() {
    var all = (LOGS && LOGS.events) || [];
    var events = all.filter(function (e) {
      if (logsFilter && e.author !== logsFilter) return false;
      if (logsKind && e.kind !== logsKind) return false;
      return true;
    });

    var kinds = (LOGS && LOGS.kinds) || {};
    var chips = '<div class="log-filters">' +
      '<button class="log-chip' + (logsKind ? '' : ' active') + '" data-kind="">Всё · ' + all.length + '</button>' +
      LOG_KINDS.filter(function (k) { return kinds[k.id]; }).map(function (k) {
        return '<button class="log-chip' + (logsKind === k.id ? ' active' : '') +
          '" data-kind="' + k.id + '">' + esc(k.label) + ' · ' + kinds[k.id] + '</button>';
      }).join('') + '</div>' +
      '<div class="log-filters">' +
      '<button class="log-chip' + (logsFilter ? '' : ' active') + '" data-author="">Все</button>' +
      ((LOGS && LOGS.authors) || []).map(function (a) {
        return '<button class="log-chip' + (logsFilter === a[0] ? ' active' : '') +
          '" data-author="' + esc(a[0]) + '">' + esc(initials(a[0])) + ' ' + esc(a[0].split(' ')[0]) + ' · ' + a[1] + '</button>';
      }).join('') + '</div>';

    if (!events.length) {
      storiesBody.innerHTML = chips + '<div class="log-empty">За период изменений нет.</div>';
      bindLogChips();
      return;
    }

    var html = chips, lastDay = null;
    events.forEach(function (e) {
      var day = dayLabel(e.at);
      if (day !== lastDay) { html += '<div class="log-day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<div class="log-item"' + ctxAttr({ kind: 'event', key: e.key, title: e.title, rowId: null }) + '>' +
        '<div class="log-who" title="' + esc(e.author) + '">' + esc(initials(e.author)) + '</div>' +
        '<div class="log-main">' +
          '<div class="log-head"><span class="log-author">' + esc(e.author) + '</span>' +
            '<span class="log-time">' + esc(relTime(e.at)) + '</span></div>' +
          logEventBody(e) +
          '<div class="log-issue"><a href="' + jiraUrl(e.key) + '" target="_blank" rel="noopener">' +
            esc(e.key) + ' — ' + esc(e.title) + '</a></div>' +
        '</div></div>';
    });

    storiesBody.innerHTML = html;
    bindLogChips();
  }

  function bindLogChips() {
    storiesBody.querySelectorAll('.log-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.kind !== undefined) logsKind = btn.dataset.kind || null;
        else logsFilter = btn.dataset.author || null;
        renderLogs();
      });
    });
  }

  function openLogs() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = LOGS && LOGS.since ? 'Изменения за спринт' : 'Изменения за неделю';
    stackKey.textContent = 'Logs';
    stackTitle.textContent = LOGS && LOGS.since ? 'Кто что менял с начала спринта (' + ddmm(LOGS.since) + ')'
      : 'Кто что менял за последние ' + ((LOGS && LOGS.days) || 7) + ' дней';

    logsFilter = null;
    logsKind = null;
    renderLogs();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openMetrics() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Метрики';
    stackKey.textContent = 'Сводный отчёт';
    stackTitle.textContent = 'Команда за последние 3 спринта';

    storiesBody.innerHTML = fillMetricsPanel();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openPanels(rowId) {
    var epic = EPICS.find(function (e) { return e.rowId === rowId; });
    if (!epic) return;

    setStackHead(epic);
    scopeEpic = epic;
    scopeBtn.hidden = !(epic.epicKey && epic.scope);
    setScopeMode(false);

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function renderHero() {
    document.getElementById('teamName').textContent = team.team;
    refreshInterpBtn();
    document.getElementById('sprintName').textContent = team.sprintName;
    var bl = document.getElementById('boardLink');
    bl.textContent = team.boardName;
    bl.href = team.boardUrl;
    document.getElementById('teamSwitch').innerHTML = TEAMS.map(function (t) {
      return '<button class="team-tab' + (t.slug === team.slug ? ' active' : '') +
        '" data-team="' + esc(t.slug) + '">' + esc(t.team) + '</button>';
    }).join('');
    document.querySelectorAll('[data-team]').forEach(function (btn) {
      btn.addEventListener('click', function () { switchTeam(btn.dataset.team); });
    });
  }

  function switchTeam(slug) {
    closePanels();
    useTeam(slug);
    migrateNotes();
    fillRefList();
    renderHero();
    renderTable();
    renderMetricsLink();
  }

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  renderHero();
  renderTable();
  renderMetricsLink();
  document.getElementById('logsBtn').addEventListener('click', openLogs);
  document.getElementById('metricsLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMetrics();
  });
  document.getElementById('interpBtn').addEventListener('click', openInterpretation);

  // «Бизнес-отчёт»: промт на колоду «ФАКТ | спринт» — тем же данным, своим навыком
  function businessPrompt() {
    var notes = allNotesLines();
    return [
      'Собери бизнес-отчёт «ФАКТ | спринт» для управляющего комитета, PO смежных департаментов и бизнес-заказчиков.',
      '',
      '/sprint-business',
      '',
      'Контекст:'
    ].concat(dataContext().map(function (l) { return '- ' + l; })).concat([
      '- Отчёт строится от целей: слайд = цель OBJ, группа = KR (эпик), строка = история спринта — что сделано одним предложением и следующий шаг.',
      '- Цели OBJ и KR — только из OKR/roadmap PO (.okr/<квартал>/OKR-*.md, roadmap.md) или со слов PO; источник — в goalsSource.',
      '- В конце каждой команды — операционный отчёт: производительность и выработка участников в SP.',
      '',
      notes.length ? 'Заметки PO из технического отчёта — учесть, если касаются бизнеса (риски, сдвиги, договорённости):' : 'Заметок PO в техническом отчёте нет.'
    ]).concat(notes).concat([
      '',
      'Выход: reports/sprint-business.html. Цифры — только из снимка, ключи задач — только из данных.'
    ]).join('\n');
  }
  document.getElementById('bizBtn').addEventListener('click', function () {
    openGenPrompt('Промт: бизнес-отчёт', 'Скопируйте и отправьте агенту — он соберёт «ФАКТ | спринт» навыком /sprint-business на тех же данных.', businessPrompt());
  });
</script>
