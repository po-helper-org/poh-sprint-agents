<!DOCTYPE html>
<html lang="ru">
<head>
<!--#include shared/head.html-->
<title>Отчёт по спринтам команд</title>
<style>
/*#include shared/core.css*/
  /* ---------- главный экран отчёта PO: сводка → блокаторы | инициативы ---------- */
  .sprint-sum { margin: 0 0 32px; }
  .sum-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .sum-dates { color: var(--fg); font-weight: 600; }
  .sum-at.stale { color: #b45309; }
  .sum-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .tile { display: block; width: 100%; text-align: left; font: inherit; color: var(--fg); background: #f7f7f8;
    border: none; border-radius: 12px; padding: 14px 16px 12px; min-width: 0; }
  .tile .t-label { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
  .tile .t-big { font-size: 28px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; }
  .tile .t-big small { font-size: 14px; font-weight: 400; color: var(--muted); }
  .tile .t-note { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .tile .t-note b { font-weight: 600; }
  .t-fc.ok .t-note b { color: var(--c-done); }
  .t-fc.warn .t-note b { color: #b45309; }
  .t-fc.bad .t-note b { color: var(--c-blocked); }
  .t-blk { cursor: pointer; }
  .t-blk:not(.none) .t-big { color: var(--c-blocked); }
  .t-blk:hover { background: #efeff1; }
  .t-legend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .t-legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }
  .sbar { display: flex; gap: 2px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--hover-bg); }
  .sbar i { display: block; min-width: 3px; }
  .sbar.big { height: 8px; margin-top: 10px; }

  .main-cols { display: block; }
  @media (min-width: 1280px) {
    .main-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 56px; align-items: start; }
    .main-cols:has(> .blockers[hidden]) { grid-template-columns: minmax(0, 1fr); }
    .main-cols .blockers { margin-bottom: 0; }
  }
  .inits-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 4px; }
  .inits-head h2 { margin: 0; font-size: 20px; }
  .inits-head h2 .n { color: var(--muted); font-weight: 400; margin-left: 8px; font-variant-numeric: tabular-nums; }
  .inits-head small { color: var(--muted); font-size: 12px; }
  #tableBody td { padding: 11px 8px; }
  #tableBody td:first-child { padding-left: 0; }
  td.prog { width: 1%; white-space: nowrap; }
  .eprog { display: inline-grid; grid-template-columns: 120px 3em 2.6em; align-items: center; gap: 10px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .epct { text-align: right; font-weight: 600; }
  .eblk { color: var(--c-blocked); font-size: 12px; }
  td.go { width: 1%; padding-right: 0; }
  .row-go { color: var(--muted); font-size: 20px; line-height: 1; }
  .row-go.has-note::before { content: "●"; font-size: 9px; color: var(--fg); vertical-align: 4px; margin-right: 6px; }
  @media (max-width: 640px) {
    .sprint-sum { margin-bottom: 24px; }
    .sum-tiles { grid-template-columns: 1fr 1fr; gap: 8px; }
    .t-done { grid-column: 1 / -1; }
    .tile { padding: 12px 14px 10px; }
    .tile .t-big { font-size: 24px; }
    #tableBody td.prog { padding: 0 0 0 22px; }
    #tableBody td.go { padding: 0; }
    .eprog { grid-template-columns: minmax(80px, 1fr) 3em 2.6em; width: 100%; }
    #tableBody td.prog { width: auto; }
  }
</style>
</head>
<body class="has-burger">
<!--#include shared/burger.html-->
<!-- Отчёт PO (навык actual-sprint): эпики спринта, сводный отчёт, интерпретация ИИ.
     Общий движок — resources/shared; бизнес-отчёт — отдельный навык sprint-business. -->

<div class="promptbox" id="promptbox">
  <div class="pb-row">
    <button class="pres-btn" id="bizBtn" title="Промт для генерации бизнес-отчёта «ФАКТ | спринт» для управляющего комитета">Бизнес-отчёт</button>
    <button class="logs-btn" id="logsBtn" title="Кто что менял за спринт">Logs</button>
    <button class="pb-toggle" id="notesToggle" aria-expanded="false" aria-controls="notesPanel"
      title="Заметки к спринту и промт для ИИ">Комментарии (<span id="cCount">0</span>)</button>
  </div>
<!--#include shared/notes.html-->
</div>

<div class="hero">
  <!-- команда видна по переключателю: ни метки «Команда», ни названия заголовком -->
  <div class="switch-row">
    <div class="team-switch" id="teamSwitch"></div>
    <button class="interp-btn" id="interpBtn" type="button" aria-label="Интерпретация ИИ"
            title="Интерпретация ИИ: динамика команды, на что обратить внимание, рекомендации">!</button>
  </div>
  <div class="meta">
    <div>Команда: <strong><a class="metrics-link" href="#" id="teamLink" title="Участники: выработка за 3 спринта, задачи каждого">—</a></strong></div>
    <div>Доска: <strong><a class="board-link" id="boardLink" href="#" target="_blank" rel="noopener">—</a></strong></div>
    <div>Lead Time за 3 спринта:
      <strong><a class="metrics-link" href="#" id="metricsLink" title="Среднее / медиана / количество закрытых запросов. Открыть сводный отчёт">—</a></strong>
    </div>
  </div>
</div>

<main>
  <!-- Главный экран: сначала «успеваем ли спринт» (сводка), под ней — что стоит и как идут инициативы.
       Широкий экран — две колонки (блокаторы | инициативы), телефон — одна. -->
  <section class="sprint-sum" id="sprintSum" hidden></section>
  <div class="main-cols">
    <!-- «✋ Блокаторы»: что стоит в спринте (runner/blockers.py → team.blockers).
         Тап по строке — заметка к блокатору в корзину; её разбирает ИИ-агент отчёта. -->
    <section class="blockers" id="blockers" hidden></section>
    <section class="inits" id="inits">
      <div class="inits-head"><h2>Инициативы<span class="n" id="initsN"></span></h2><small>тап — истории эпика</small></div>
      <table>
        <tbody id="tableBody"></tbody>
      </table>
    </section>
  </div>
</main>


<!--#include shared/panels.html-->

<script>
/*#include shared/core.js*/
  var tableBody = document.getElementById('tableBody');

  // подсказка: только ненулевые бакеты, «2 — в бэклоге, 1 — в ревью»
  function tallyTip(counts) {
    var parts = BUCKETS
      .filter(function (b) { return counts[b.id] > 0; })
      .map(function (b) { return counts[b.id] + ' — ' + b.phrase; });
    if (!parts.length) return 'Задач нет';
    return parts.join(', ') + ' · всего ' + counts.total;
  }

  // Полоса статусов — одна на сводку и строки эпиков: слева готовое, дальше проверка,
  // в работе, в ожидании, не начато. Те же цвета, что в «Весь эпик» и бизнес-колоде.
  var BAR_ORDER = ['done', 'review', 'testing', 'progress', 'blocked', 'open'];
  function statusBar(counts, cls) {
    return '<span class="sbar' + (cls ? ' ' + cls : '') + '">' + BAR_ORDER.filter(function (id) { return counts[id]; }).map(function (id) {
      return '<i style="flex:' + counts[id] + ';background:' + BUCKET_COLOR[id] + '"></i>';
    }).join('') + '</span>';
  }
  function donePct(counts) { return counts.total ? Math.round(100 * counts.done / counts.total) : 0; }

  // строка эпика: полоса + «N%» вместо счётчиков «1/5/0/0/0/5»; «в ожидании» — красным числом
  // (блокаторы шире: ещё и задачи без движения — они в своём разделе)
  function epicProgress(counts) {
    return '<span class="eprog" title="' + esc(tallyTip(counts)) + '">' + statusBar(counts) +
      '<span class="epct">' + donePct(counts) + '%</span>' +
      (counts.blocked ? '<span class="eblk" title="В ожидании: ' + counts.blocked + '">✋' + counts.blocked + '</span>' : '') + '</span>';
  }

  // метки заметок у строк эпиков
  function pageMarks(counts) {
    tableBody.querySelectorAll('tr[data-row]').forEach(function (tr) {
      var mark = tr.querySelector('.row-go');
      var n = counts.byRow[tr.dataset.row] || 0;
      mark.classList.toggle('has-note', !!n);
      mark.title = n ? 'Заметок по эпику: ' + n : '';
    });
  }

  // ------------------------- сводка спринта: успеваем ли -------------------------
  // Сделано — по статусам задач сейчас (как в строках эпиков), прогноз — по темпу закрытия
  // из burndown: (закрыто в последний день − в первый) / прошедшие рабочие дни × оставшиеся.
  var MON = ['янв', 'фев', 'мар', 'апр', 'мая', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  function dMon(iso) { return iso ? +iso.slice(8, 10) + ' ' + MON[+iso.slice(5, 7) - 1] : '—'; }
  function isoDay(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

  // рабочие дни с сегодняшнего по последний день спринта включительно (праздники не учитываем)
  function workdaysLeft(end, now) {
    var d = new Date(now.getFullYear(), now.getMonth(), now.getDate()), n = 0;
    while (isoDay(d) <= end) { if (d.getDay() % 6) n++; d.setDate(d.getDate() + 1); }
    return n;
  }

  function sprintSummary(t, now) {
    var c = { total: 0 };
    BUCKETS.forEach(function (b) { c[b.id] = 0; });
    (t.epics || []).forEach(function (e) {
      var x = tallyEpic(e);
      BUCKETS.forEach(function (b) { c[b.id] += x[b.id]; });
      c.total += x.total;
    });
    var bd = t.burndown || {}, days = bd.days || [];
    var act = days.filter(function (d) { return !d.future; });
    var fc = null;
    if (act.length > 1 && c.total) {
      var worked = act.filter(function (d) { return !d.weekend; }).length - 1;
      var pace = Math.max(0, act[act.length - 1].closed - act[0].closed) / Math.max(1, worked);
      var ahead = days.filter(function (d) { return d.future && !d.weekend; }).length;
      var proj = Math.min(c.total, c.done + Math.round(pace * ahead));
      var gap = c.total - proj;
      fc = { pace: pace, proj: proj, gap: gap, level: gap <= 0 ? 'ok' : gap <= Math.ceil(c.total * 0.1) ? 'warn' : 'bad' };
    }
    var blk = t.blockers && t.blockers.items || null;
    var at = t._meta && t._meta.collectedAt;
    var ageH = at ? (now - parseTs(at)) / 36e5 : null;
    return { c: c, start: bd.start, end: bd.end, left: bd.end ? workdaysLeft(bd.end, now) : null, fc: fc,
             blk: blk, long: blk ? blk.filter(function (b) { return b.days >= 10; }).length : 0,
             who: t.blockers && t.blockers.byPerson && t.blockers.byPerson[0] || null,
             at: at, stale: ageH != null && ageH > 24 };
  }

  function leftText(n) {
    return n == null ? '' : n <= 0 ? 'спринт завершён' : n === 1 ? 'последний день' : 'осталось ' + n + ' ' + plural(n, 'рабочий день', 'рабочих дня', 'рабочих дней');
  }

  function renderSummary() {
    var box = document.getElementById('sprintSum');
    var s = sprintSummary(team, new Date()), c = s.c;
    if (!c.total && !s.end) { box.hidden = true; return; }
    box.hidden = false;
    var at = s.at ? String(s.at) : '';
    var head = '<div class="sum-head">' +
      (s.start ? '<span class="sum-dates">' + dMon(s.start) + ' – ' + dMon(s.end) + '</span>' : '') +
      (s.left != null ? '<span class="sum-left">' + leftText(s.left) + '</span>' : '') +
      (at ? '<span class="sum-at' + (s.stale ? ' stale' : '') + '" title="Когда собраны данные из JIRA">' +
        (s.stale ? 'данные от ' : 'данные ') + dMon(at.slice(0, 10)) + ' ' + at.slice(11, 16) + (s.stale ? ' — не обновлялись' : '') + '</span>' : '') +
      '</div>';
    var legend = [['progress', 'в работе'], ['blocked', 'в ожидании'], ['check', 'на проверке'], ['open', 'не начато']].map(function (p) {
      var n = p[0] === 'check' ? c.testing + c.review : c[p[0]];
      return n ? '<span><i style="background:' + BUCKET_COLOR[p[0] === 'check' ? 'review' : p[0]] + '"></i>' + p[1] + ' ' + n + '</span>' : '';
    }).join('');
    var done = '<div class="tile t-done"><div class="t-label">Сделано</div>' +
      '<div class="t-big">' + c.done + '<small> из ' + c.total + ' · ' + donePct(c) + '%</small></div>' +
      statusBar(c, 'big') + '<div class="t-legend">' + legend + '</div></div>';
    var fc = s.fc ? '<div class="tile t-fc ' + s.fc.level + '" title="Темп — закрытые задачи в рабочий день по burndown спринта' +
        (s.stale ? '; прогноз на день сбора данных' : '') + '"><div class="t-label">Прогноз к ' + dMon(s.end) + '</div>' +
      '<div class="t-big">≈ ' + s.fc.proj + '<small> из ' + c.total + '</small></div>' +
      '<div class="t-note"><b>' + (s.fc.level === 'ok' ? 'успеваем' : 'не успеваем ≈ ' + s.fc.gap) + '</b> · темп ' +
        fmt(Math.round(s.fc.pace * 10) / 10) + ' в день</div></div>' : '';
    var blk = s.blk ? '<button type="button" class="tile t-blk' + (s.blk.length ? '' : ' none') + '" data-go="blockers">' +
      '<div class="t-label">Блокаторы</div><div class="t-big">' + s.blk.length + '</div>' +
      '<div class="t-note">' + (!s.blk.length ? 'ничего не стоит' :
        (s.long ? s.long + ' ' + plural(s.long, 'стоит', 'стоят', 'стоят') + ' 10+ дней' : 'все моложе 10 дней') +
        (s.who ? ' · больше всего у ' + esc(shortName(s.who.name)) : '')) + '</div></button>' : '';
    box.innerHTML = head + '<div class="sum-tiles">' + done + fc + blk + '</div>';
  }

  document.getElementById('sprintSum').addEventListener('click', function (e) {
    var go = e.target.closest('[data-go]');
    if (go) document.getElementById(go.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  function renderTable() {

    tableBody.innerHTML = EPICS.map(function (e) {
      // название эпика — просто текст: ссылка на JIRA живёт в шапке панели,
      // иначе клик по строке конфликтует с переходом по ссылке
      var epicCell = e.epicKey
        ? prioHtml(e.epicPriority) + esc(e.epicTitle)
        : '<span class="prio p-none"></span><span class="no-epic">' + esc(e.epicTitle || 'Без эпика') + '</span>';
      return (
        '<tr data-row="' + esc(e.rowId) + '"' + ctxAttr(epicTarget(e)) + '>' +
          '<td class="epic">' + epicCell + '</td>' +
          '<td class="prog">' + epicProgress(tallyEpic(e)) + '</td>' +
          '<td class="go"><span class="row-go" aria-hidden="true">›</span></td>' +
        '</tr>'
      );
    }).join('');
    document.getElementById('initsN').textContent = EPICS.length;

    // клик по любому месту строки открывает панель
    tableBody.querySelectorAll('tr').forEach(function (tr) {
      var rowId = tr.dataset.row;
      tr.addEventListener('click', function () { openPanels(rowId); });
    });
    refreshComments();
  }

  // ------------------------- сводный отчёт за 3 спринта -------------------------


  // «среднее/медиана/количество» — формат шапки и всех ячеек сводки
  function triple(s) {
    if (!s) return '<span class="m-muted">—</span>';
    return fmt(s.mean) + ' / ' + fmt(s.median) + ' / ' + s.count;
  }

  function renderMetricsLink() {
    var link = document.getElementById('metricsLink');
    var o = METRICS && METRICS.overall;
    link.textContent = o && o.lead ? triple(o.lead).replace(/<[^>]+>/g, '') : '—';
  }


  // «Как читать» — постоянная расшифровка графика в подсказке «i». Интерпретация
  // конкретных цифр — отдельный раздел «Инсайды ИИ» внизу отчёта. Под графиком
  // остаются только легенда и списки.
  var CHART_INFO = {
    burndown: ['Серая линия — идеальный темп: от объёма на старте до нуля в последний день.',
               'Красная — сколько задач осталось на каждый день; точка — подсказка с числами.',
               'Светлые полосы — выходные. Ступенька вверх — в спринт добавили задачи.'],
    velocity: ['Левый столбец — всё, что было в спринте, разложенное по текущему статусу.',
               'Правый — сколько сделано. Пунктир — среднее сделанное за показанные спринты.'],
    control: ['Точка — закрытая задача: по горизонтали дата закрытия, по вертикали Cycle Time — дни от взятия в работу до закрытия.',
              'Синяя линия — скользящее среднее по 5 задачам, светлая полоса — коридор ±σ.',
              'Красная линия — порог выброса: среднее + σ. Выше — задача шла заметно дольше обычного.',
              'Жёлтые точки у правого края — ещё в работе и уже дольше медианы; по высоте — сколько идут на сегодня.']
  };
  var AI_LEVELS = { risk: 'нужна реакция', warn: 'присмотреться', good: 'работает', info: 'наблюдение' };
  var AI_ABOUT = { sprint: 'спринт', team: 'команда', burndown: 'burndown', velocity: 'производительность',
                   controlStories: 'cycle time историй', controlSubtasks: 'cycle time подзадач' };

  // Раздел «Инсайды ИИ»: на что обратить внимание PO, что можно сказать о состоянии
  // команды в этом спринте и о тенденции. Пишет агент (/sprint-insights) по фактам из
  // снимка; runner кладёт в team.insights, только если они написаны по этим же данным.
  // Нет наблюдений — раздел всё равно на месте и говорит, как их получить.
  function insightsSection() {
    var ins = team.insights;
    var list = ins && ins.observations && ins.observations.length ? ins.observations : null;
    var title = 'Инсайды ИИ';
    var body;
    if (!list) {
      body = '<p class="ai-none">ИИ-агент ещё не смотрел этот сбор. Попросите его: <code>/sprint-insights</code> — ' +
        'здесь появятся наблюдения о спринте и команде.</p>';
    } else {
      body = '<p class="ai-lead">На что обратить внимание PO: состояние команды в этом спринте и тенденция</p>' +
        '<ol class="ai-list">' + list.map(function (it) {
          var lvl = AI_LEVELS[it.level] ? it.level : 'info';
          var keys = (it.keys || []).map(function (k) {
            return '<a href="' + jiraUrl(k) + '" target="_blank" rel="noopener">' + esc(k) + '</a>';
          }).join('');
          return '<li class="ai-item lv-' + lvl + '"' + ctxAttr({ kind: 'insight', title: it.text }) + '>' +
            '<div class="ai-meta"><span class="dot"></span><span class="lvl">' + AI_LEVELS[lvl] + '</span>' +
              (AI_ABOUT[it.about] ? '<span class="about">' + AI_ABOUT[it.about] + '</span>' : '') + '</div>' +
            '<p class="ai-text">' + esc(it.text) + '</p>' +
            (it.action ? '<p class="ai-act">→ ' + esc(it.action) + '</p>' : '') +
            (keys ? '<div class="ai-keys">' + keys + '</div>' : '') +
          '</li>';
        }).join('') + '</ol>' +
        '<p class="ai-by">Интерпретация ИИ, не данные' + (ins.author ? ' · ' + esc(ins.author) : '') +
        (ins.generatedAt ? ' · ' + esc(String(ins.generatedAt).slice(0, 16).replace('T', ' ')) : '') + '</p>';
    }
    return '<div class="metrics-section ai-section" id="aiInsights"><h3>' + title + '</h3>' + body + '</div>';
  }

  // Интерпретация динамики команды (отдельный промт sprint-insights/prompts/interpretation.md):
  // пишется ИИ-агентом на этапе генерации отчёта, показывается сайдбаром по «!» в шапке.
  var INTERP_PARTS = [
    ['dynamics', 'Что можно сказать о динамике команды'],
    ['attention', 'На что стоит обратить внимание'],
    ['recommendations', 'Рекомендации на будущее']
  ];

  function interpretation() {
    return team.insights && team.insights.interpretation || null;
  }

  function keyLinks(text) {
    return esc(text).replace(/\b[A-Z][A-Z0-9_]*-\d+\b/g, function (k) {
      return '<a href="' + jiraUrl(k) + '" target="_blank" rel="noopener">' + k + '</a>';
    });
  }

  function interpretationHtml() {
    var it = interpretation(), ins = team.insights;
    if (!it) {
      return '<p class="ai-none">Интерпретации по этому сбору нет. Её пишет ИИ-агент при генерации отчёта ' +
        '(<code>/actual-sprint</code>), отдельно — <code>/sprint-insights</code>.</p>';
    }
    return (ins.stale ? '<p class="interp-stale">Написано по прошлому сбору: данные с тех пор обновились. ' +
        'Свежая интерпретация — <code>/sprint-insights</code>.</p>' : '') +
      INTERP_PARTS.map(function (p) {
        var items = it[p[0]] || [];
        return '<section class="interp-sec" data-part="' + p[0] + '"><h3>' + p[1] + '</h3><ul>' +
          items.map(function (x) {
            return '<li' + ctxAttr({ kind: 'insight', title: x }) + '>' + keyLinks(x) + '</li>';
          }).join('') + '</ul></section>';
      }).join('') +
      '<p class="ai-by">Интерпретация ИИ, не данные' + (ins.author ? ' · ' + esc(ins.author) : '') +
      (ins.generatedAt ? ' · ' + esc(String(ins.generatedAt).slice(0, 16).replace('T', ' ')) : '') + '</p>';
  }

  function refreshInterpBtn() {
    var it = interpretation(), btn = document.getElementById('interpBtn');
    btn.classList.toggle('empty', !it);
    btn.classList.toggle('stale', !!(it && team.insights.stale));
    btn.title = !it ? 'Интерпретации ИИ по этому сбору нет'
      : team.insights.stale ? 'Интерпретация ИИ по прошлому сбору'

    overlay.classList.add('open');

  function infoHtml(kind, stat) {
    var li = function (list) { return '<ul>' + list.map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('') + '</ul>'; };
    return '<span class="info" tabindex="0" role="button" aria-label="Как читать график">' +
      '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"' +
      ' stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M8 7.3v3.6M8 5.1h.01"/></svg>' +
      '<span class="info-tip" role="tooltip">' + (stat ? '<div class="stat">' + stat + '</div>' : '') +
      '<b>Как читать</b>' + li(CHART_INFO[kind]) +
      '</span></span>';
  }

  function controlStat(c) {
    if (!c || !c.points || !c.points.length) return '';
    return 'За ' + c.days + ' дн.: медиана <strong>' + fmt(c.median) + '</strong> дн., среднее <strong>' +
      fmt(c.mean) + '</strong> дн., σ ' + fmt(c.sd) + '.';
  }

  // раздел графика: правый клик по нему — заметка к графику целиком
  function chartSection(title, info, body) {
    return '<div class="metrics-section"' + ctxAttr({ kind: 'chart', title: title }) + '><h3>' + esc(title) + info + '</h3>' +
      body + '</div>';
  }

  function fillMetricsPanel() {
    var html = '';
    html += chartSection('Burndown текущего спринта', infoHtml('burndown'), burndownChart());
    html += chartSection('Производительность: запланировано / сделано', infoHtml('velocity'), velocityChart());
    html += chartSection('Диаграмма управления — истории', infoHtml('control', controlStat(CONTROL.stories)),
      controlChart(CONTROL.stories, 'историй', 'story'));
    html += chartSection('Диаграмма управления — подзадачи', infoHtml('control', controlStat(CONTROL.subtasks)),
      controlChart(CONTROL.subtasks, 'подзадач', 'subtask'));
    html += insightsSection();
    return html;

  // ------------------ Лента изменений статусов ------------------
  // Кто какую задачу куда перевёл за последнюю неделю. Фильтр по автору.
  var logsFilter = null;

  var logsKind = null;

  function renderLogs() {
    var all = (LOGS && LOGS.events) || [];
    var events = all.filter(function (e) {
      if (logsFilter && e.author !== logsFilter) return false;
      if (logsKind && e.kind !== logsKind) return false;
      return true;
    });

    var kinds = (LOGS && LOGS.kinds) || {};
    var chips = '<div class="log-filters">' +
      '<button class="log-chip' + (logsKind ? '' : ' active') + '" data-kind="">Всё · ' + all.length + '</button>' +
      LOG_KINDS.filter(function (k) { return kinds[k.id]; }).map(function (k) {
        return '<button class="log-chip' + (logsKind === k.id ? ' active' : '') +
          '" data-kind="' + k.id + '">' + esc(k.label) + ' · ' + kinds[k.id] + '</button>';
      }).join('') + '</div>' +
      '<div class="log-filters">' +
      '<button class="log-chip' + (logsFilter ? '' : ' active') + '" data-author="">Все</button>' +
      ((LOGS && LOGS.authors) || []).map(function (a) {
        return '<button class="log-chip' + (logsFilter === a[0] ? ' active' : '') +
          '" data-author="' + esc(a[0]) + '">' + esc(initials(a[0])) + ' ' + esc(a[0].split(' ')[0]) + ' · ' + a[1] + '</button>';
      }).join('') + '</div>';

    if (!events.length) {
      storiesBody.innerHTML = chips + '<div class="log-empty">За период изменений нет.</div>';
      bindLogChips();
      return;
    }

    var html = chips, lastDay = null;
    events.forEach(function (e) {
      var day = dayLabel(e.at);
      if (day !== lastDay) { html += '<div class="log-day">' + esc(day) + '</div>'; lastDay = day; }
      html += '<div class="log-item"' + ctxAttr({ kind: 'event', key: e.key, title: e.title, rowId: null }) + '>' +
        '<div class="log-who" title="' + esc(e.author) + '">' + esc(initials(e.author)) + '</div>' +
        '<div class="log-main">' +
          '<div class="log-head"><span class="log-author">' + esc(e.author) + '</span>' +
            '<span class="log-time">' + esc(relTime(e.at)) + '</span></div>' +
          logEventBody(e) +
          '<div class="log-issue"><a href="' + jiraUrl(e.key) + '" target="_blank" rel="noopener">' +
            esc(e.key) + ' — ' + esc(e.title) + '</a></div>' +
        '</div></div>';
    });

    storiesBody.innerHTML = html;
    bindLogChips();
  }

  function bindLogChips() {
    storiesBody.querySelectorAll('.log-chip').forEach(function (btn) {
      btn.addEventListener('click', function () {
        if (btn.dataset.kind !== undefined) logsKind = btn.dataset.kind || null;
        else logsFilter = btn.dataset.author || null;
        renderLogs();
      });
    });
  }

  function openLogs() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = LOGS && LOGS.since ? 'Изменения за спринт' : 'Изменения за неделю';
    stackKey.textContent = 'Logs';
    stackTitle.textContent = LOGS && LOGS.since ? 'Кто что менял с начала спринта (' + ddmm(LOGS.since) + ')'
      : 'Кто что менял за последние ' + ((LOGS && LOGS.days) || 7) + ' дней';

    logsFilter = null;
    logsKind = null;
    renderLogs();

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function openMetrics() {
    scopeBtn.hidden = true;
    scopeEpic = null;
    stackTitle.parentNode.removeAttribute('data-ctx');
    storiesLabel.textContent = 'Метрики';
    stackKey.textContent = 'Сводный отчёт';
    stackTitle.textContent = 'Команда за последние 3 спринта';

    panelStack.classList.add('open');

    setStackHead(epic);

  // «Команда: N» — участники за 3 спринта: выработка по группам, Lead time; клик по

    } else {
      OUT_TIPS = [];
      MEMBER_REFS = [];
      storiesBody.innerHTML = '<div class="team-legend">' + OUT_GROUPS.map(function (g) {

  function renderHero() {
    refreshInterpBtn();
    var m = outputModel(team);
    var people = m ? m.rows.filter(function (r) { return r.name !== 'Не назначен'; }).length : 0;
    var tl = document.getElementById('teamLink');

  // ------------------------- ✋ Блокаторы -------------------------
  // Группы по длительности стоянки (рабочие дни): дольше стоит — выше. В группе
  // видно BLK_SHOW строк, остальное — по «ещё N». Под списком — где стоим: дни
  // в блоке по инициативам (эпикам) и по людям; тап по человеку — только его блокаторы.
  var BLK_GROUPS = [
    { id: 'g10', label: '10+ дней', test: function (d) { return d >= 10; } },
    { id: 'g5', label: '5–10 дней', test: function (d) { return d >= 5 && d < 10; } },
    { id: 'g3', label: '3–5 дней', test: function (d) { return d >= 3 && d < 5; } },
    { id: 'g0', label: 'до 3 дней', test: function (d) { return d < 3; } },
    { id: 'gx', label: 'начало неизвестно', test: function (d) { return d == null; } }
  ];
  var BLK_SHOW = 5, BLK_TOP = 5;
  var blkState = { who: null, open: {} };

  // имя — shortName() общего движка: «Парфило Сергей Иванович» → «Парфило С. И.»; без исполнителя — NOBODY
  var NOBODY = 'Не назначен';
  function blockerTarget(b) {
    return { kind: 'blocker', key: b.key, title: b.title, status: b.status, assignee: b.assignee,
             epicKey: b.epicKey, epicTitle: b.epicTitle, rowId: b.rowId, why: b.why, days: b.days };
  }

  function daysText(d) { return d == null ? '?' : d + ' ' + plural(d, 'день', 'дня', 'дней'); }

  function blkRow(b) {
    var why = b.why === 'stale' ? 'без движения' : 'в ожидании';
    var link = b.url ? '<a class="blk-key" href="' + esc(b.url) + '" target="_blank" rel="noopener">' + esc(b.key) + '</a>'
      : '<span class="blk-key">' + esc(b.key) + '</span>';
    return '<li class="blk-row ' + (b.why === 'stale' ? 'stale' : 'wait') + '" data-blk="' + esc(b.key) + '"' + ctxAttr(blockerTarget(b)) +
      ' title="' + esc(b.comment ? 'Последний комментарий — ' + (b.comment.by || '') + ': ' + b.comment.text : 'Тап — комментарий для ИИ-агента') + '">' +
      '<div class="blk-main"><div class="blk-title">' + esc(b.title) + '</div>' +
      '<div class="blk-sub">' + esc(shortName(b.assignee || NOBODY)) + ' · ' + why + ' · ' + link +
        '<span class="blk-cm" data-cmark="' + esc(b.key) + '"></span></div></div>' +
      '<div class="blk-days">' + esc(daysText(b.days)) + '</div></li>';
  }

  function blkBars(title, rows, kind) {
    if (!rows.length) return '';
    var max = Math.max.apply(null, rows.map(function (r) { return r.days || 0; })) || 1;
    return '<div class="blk-bars"><h3>' + title + '</h3>' + rows.slice(0, BLK_TOP).map(function (r) {
      var label = kind === 'epic' ? r.title : shortName(r.name);
      var on = kind === 'person' && blkState.who === r.name;
      var attr = kind === 'epic' ? ' data-blk-epic="' + esc(r.rowId || '') + '"' : ' data-blk-who="' + esc(r.name) + '"';
      return '<button type="button" class="blk-bar' + (on ? ' on' : '') + '"' + attr + ' title="' +
        esc(label + ': ' + r.count + ' ' + plural(r.count, 'задача', 'задачи', 'задач') + ', ' + r.days + ' раб. ' + plural(r.days, 'день', 'дня', 'дней')) + '">' +
        '<span class="blk-bar-label">' + esc(label) + '</span>' +
        '<span class="blk-bar-track"><span style="width:' + Math.max(4, Math.round(100 * (r.days || 0) / max)) + '%"></span></span>' +
        '<span class="blk-bar-n">' + r.days + '</span></button>';
    }).join('') + '</div>';
  }

  function renderBlockers() {
    var box = document.getElementById('blockers');
    var data = team.blockers;
    if (!data) { box.hidden = true; return; }   // страница без наложения (старый runner)
    box.hidden = false;
    var all = data.items || [];
    if (blkState.who && !all.some(function (b) { return (b.assignee || NOBODY) === blkState.who; })) blkState.who = null;
    var items = blkState.who ? all.filter(function (b) { return (b.assignee || NOBODY) === blkState.who; }) : all;
    var head = '<div class="blk-head"><h2>✋ Блокаторы' + (all.length ? '<span class="n">' + all.length + '</span>' : '') + '</h2>' +
      (blkState.who ? '<button type="button" class="blk-reset" data-blk-who="">' + esc(shortName(blkState.who)) + ' ✕</button>' : '') +
      '<small>' + (all.length ? 'тап по строке — комментарий для ИИ-агента' : '') + '</small></div>';
    if (!all.length) {
      box.innerHTML = head + '<p class="blk-empty">Ничего не стоит: ни «в ожидании», ни без движения ' + data.staleDays + '+ раб. дня.</p>';
      return;
    }
    var groups = BLK_GROUPS.map(function (g) {
      var list = items.filter(function (b) { return g.test(b.days); });
      if (!list.length) return '';
      var open = blkState.open[g.id], shown = open ? list : list.slice(0, BLK_SHOW);
      return '<div class="blk-group"><h3>' + g.label + '<span class="n">' + list.length + '</span></h3><ul>' +
        shown.map(blkRow).join('') + '</ul>' +
        (list.length > shown.length ? '<button type="button" class="blk-more" data-blk-more="' + g.id + '">ещё ' + (list.length - shown.length) + '</button>' : '') +
        '</div>';
    }).join('');
    box.innerHTML = head + '<div class="blk-groups">' + groups + '</div>' +
      '<div class="blk-sum">' + blkBars('Инициативы · дней в блоке', data.byEpic || [], 'epic') +
        blkBars('Люди · дней в блоке', data.byPerson || [], 'person') + '</div>';
    refreshComments();
  }

  document.getElementById('blockers').addEventListener('click', function (e) {
    if (e.target.closest('a[href]')) return;   // ключ задачи — ссылка в Jira
    var more = e.target.closest('[data-blk-more]');
    if (more) { blkState.open[more.dataset.blkMore] = true; renderBlockers(); return; }
    var who = e.target.closest('[data-blk-who]');
    if (who) { blkState.who = who.dataset.blkWho && who.dataset.blkWho !== blkState.who ? who.dataset.blkWho : null; renderBlockers(); return; }
    var ep = e.target.closest('[data-blk-epic]');
    if (ep) { if (ep.dataset.blkEpic) openPanels(ep.dataset.blkEpic); return; }
    var row = e.target.closest('.blk-row[data-ctx]');
    if (row && ctxTargets[row.dataset.ctx]) {
      var r = row.getBoundingClientRect();
      openCommentPopup(ctxTargets[row.dataset.ctx], r.left + 12, r.bottom + 4);
    }
  });

  // ------------------------- меню бургера (вместо шапки) -------------------------
  // Шапка (.hero, кнопки корзины) скрыта стилем has-burger; пункты меню нажимают её кнопки.
  // Команда — через скрытую вкладку .team-tab: оболочка виджета слушает именно её.
  burger.label = function () { return team.team + (team.sprintName ? ' · ' + team.sprintName : ''); };
  burger.build = function () {
    var m = outputModel(team);
    var people = m ? m.rows.filter(function (r) { return r.name !== NOBODY; }).length : 0;
    var it = interpretation(), n = +document.getElementById('cCount').textContent || 0;
    var teams = TEAMS.length > 1 ? bmSection('Команда', '<div class="bm-teams">' + TEAMS.map(function (t) {
      return '<button type="button" class="bm-team' + (t.slug === team.slug ? ' on' : '') + '" data-bm-team="' + esc(t.slug) + '">' + esc(t.team) + '</button>';
    }).join('') + '</div>') : '';
    var board = team.boardUrl ? '<a class="bm-item" href="' + esc(team.boardUrl) + '" target="_blank" rel="noopener"><span class="bm-main">' +
      '<span class="bm-label">Доска</span><span class="bm-sub">' + esc(team.boardName || 'JIRA') + '</span></span><span class="bm-go">↗</span></a>' : '';
    return teams +
      bmSection(/^спринт/i.test(team.sprintName || '') ? team.sprintName : 'Спринт' + (team.sprintName ? ' ' + team.sprintName : ''),
        bmItem('data-bm-click="teamLink"', 'Команда', m ? people + ' ' + plural(people, 'участник', 'участника', 'участников') + ' · выработка за 3 спринта' : 'нет данных') +
        board +
        bmItem('data-bm-click="metricsLink"', 'Lead Time за 3 спринта', document.getElementById('metricsLink').textContent + ' · среднее / медиана / кол-во · сводный отчёт') +
        bmItem('data-bm-click="interpBtn"', 'Интерпретация ИИ', !it ? 'по этому сбору нет' : team.insights.stale ? 'написана по прошлому сбору' : 'динамика команды, на что обратить внимание, рекомендации')) +
      bmSection('Действия',
        bmItem('data-bm-click="notesToggle"', 'Комментарии', n ? n + ' ' + plural(n, 'заметка', 'заметки', 'заметок') + ' · промт для ИИ' : 'заметки к спринту и промт для ИИ',
          n ? '<span class="bm-n">' + n + '</span>' : null) +
        bmItem('data-bm-click="logsBtn"', 'Logs', 'кто что менял за спринт') +
        bmItem('data-bm-click="bizBtn"', 'Бизнес-отчёт', 'промт для презентации «ФАКТ | спринт»'));
  };
  if (burgerBtn) document.getElementById('burgerBody').addEventListener('click', function (e) {
    var b = e.target.closest('[data-bm-team]');
    if (!b) return;
    var tab = document.querySelector('#teamSwitch .team-tab[data-team="' + b.dataset.bmTeam + '"]');
    if (tab) tab.click();
    renderBurger();
  });

  function switchTeam(slug) {
    closePanels();
    useTeam(slug);
    migrateNotes();
    fillRefList();
    renderHero();
    blkState = { who: null, open: {} };
    renderSummary();
    renderBlockers();
    renderTable();
    renderMetricsLink();
    refreshBurger();

  useTeam(TEAMS[0].slug);
  migrateNotes();
  fillRefList();
  renderHero();
  renderSummary();
  renderBlockers();
  renderTable();
  renderMetricsLink();
  refreshBurger();
  document.getElementById('logsBtn').addEventListener('click', openLogs);
  document.getElementById('metricsLink').addEventListener('click', function (e) {
    e.preventDefault();
    openMetrics();
  });
  document.getElementById('interpBtn').addEventListener('click', openInterpretation);
  document.getElementById('teamLink').addEventListener('click', function (e) {
    e.preventDefault();
    openTeam();
  });

  // «Бизнес-отчёт»: промт на колоду «ФАКТ | спринт» — тем же данным, своим навыком

    var notes = allNotesLines();
    return [
      'Собери бизнес-отчёт «ФАКТ | спринт» для управляющего комитета, PO смежных департаментов и бизнес-заказчиков.',
      '',
      '/sprint-business',
      '',
      'Контекст:'
    ].concat(dataContext().map(function (l) { return '- ' + l; })).concat([
      '- Отчёт верхнеуровневый: слайд = цель OBJ, строка = KR (эпик) со сводкой историй спринта — итог одним предложением, блокер и следующий шаг; заблокированное — отдельно от не успетого по объёму.',
      '- Цели OBJ и KR — только из OKR/roadmap PO (.okr/<квартал>/OKR-*.md, roadmap.md) или со слов PO; источник — в goalsSource.',
      '- В конце каждой команды — операционный отчёт: производительность и выработка участников в SP.',
      '',
      notes.length ? 'Заметки PO из технического отчёта — учесть, если касаются бизнеса (риски, сдвиги, договорённости):' : 'Заметок PO в техническом отчёте нет.'
    ]).concat(notes).concat([
      '',
      'Выход: reports/sprint-business.html. Цифры — только из снимка, ключи задач — только из данных.'
    ]).join('\n');
  }
  document.getElementById('bizBtn').addEventListener('click', function () {
    openGenPrompt('Промт: бизнес-отчёт', 'Скопируйте и отправьте агенту — он соберёт «ФАКТ | спринт» навыком /sprint-business на тех же данных.', businessPrompt());
  });
</script>
