<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчёт {{TEAM_NAME}} — {{SPRINT_NAME}}</title>
<style>
  :root {
    --fg: #111;
    --bg: #fff;
    --muted: #666;
    --line: #ddd;
    --accent: #111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  .hero {
    padding: 48px 32px 32px;
    border-bottom: 3px solid var(--fg);
  }
  .hero .team {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 32px;
    font-weight: 700;
  }
  .hero .meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--muted);
  }
  .hero .meta strong { color: var(--fg); }

  main { padding: 32px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  thead th {
    border-bottom: 2px solid var(--fg);
    font-weight: 700;
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafafa; }
  td.epic a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); font-weight: 600; }
  td.epic a:hover { border-bottom-color: var(--fg); }
  td.epic .no-epic { color: var(--muted); font-weight: 600; }

  td.actions { white-space: nowrap; width: 1%; }
  td.actions .btn-group { display: flex; gap: 8px; }
  .action-btn {
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover { background: var(--fg); color: var(--bg); }
  .action-btn.has-note { border-color: #111; font-weight: 600; }

  /* сайдбар */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sidebar {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    width: 420px;
    max-width: 90vw;
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    transform: translateX(100%);
    transition: transform 0.2s ease;
    z-index: 11;
    display: flex;
    flex-direction: column;
  }
  .sidebar.open { transform: translateX(0); }

  .sidebar-head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
  }
  .sidebar-head .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .sidebar-head h2 { margin: 0 0 6px; font-size: 17px; line-height: 1.35; padding-right: 24px; }
  .sidebar-head a { font-size: 13px; color: var(--muted); }

  .sidebar-close {
    position: absolute;
    top: 16px;
    right: 16px;
    border: none;
    background: none;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
  }
  .sidebar-close:hover { color: var(--fg); }

  .sidebar-body { padding: 16px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }

  /* список историй эпика, с разворотом подзадач */
  .story-item { border-bottom: 1px solid #eee; }
  .story-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 10px 0;
    font-size: 13px;
  }
  .story-row .story-title-wrap { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .story-toggle {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px 0 0;
    width: 14px;
    transform: rotate(0deg);
    transition: transform 0.15s ease;
  }
  .story-toggle.open { transform: rotate(90deg); }
  .story-toggle:disabled { visibility: hidden; }
  .story-row a { color: var(--fg); text-decoration: none; }
  .story-row a:hover { text-decoration: underline; }
  .story-row .status {
    flex-shrink: 0;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    white-space: nowrap;
  }
  .status.done { border-color: #111; font-weight: 600; }
  .status.progress { border-color: #999; }
  .status.backlog { color: var(--muted); }

  .sub-list { display: none; padding: 0 0 10px 20px; }
  .sub-list.open { display: block; }
  .sub-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 6px 0;
    font-size: 12px;
    border-top: 1px dashed #eee;
  }
  .sub-item:first-child { border-top: none; }
  .sub-item a { color: var(--muted); text-decoration: none; }
  .sub-item a:hover { color: var(--fg); text-decoration: underline; }

  .sidebar-empty { color: var(--muted); font-size: 13px; padding: 8px 0; }

  .note-area {
    flex: 1;
    width: 100%;
    min-height: 240px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    line-height: 1.6;
  }
  .note-area:focus { outline: none; border-color: var(--fg); }
  .note-hint { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>

<div class="hero">
  <div class="team">Команда</div>
  <h1>{{TEAM_NAME}}</h1>
  <div class="meta">
    <div>Спринт: <strong>{{SPRINT_NAME}}</strong></div>
    <div>Доска: <strong>{{BOARD_NAME}}</strong></div>
    <div>Эпиков в отчёте: <strong id="epicCount">0</strong></div>
  </div>
</div>

<main>
  <table>
    <thead>
      <tr>
        <th>Эпик</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</main>

<div class="overlay" id="overlay"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <button class="sidebar-close" id="sidebarClose">&times;</button>
    <div class="eyebrow" id="sbKey">—</div>
    <h2 id="sbTitle">—</h2>
    <a id="sbLink" href="#" target="_blank" rel="noopener">Открыть в JIRA →</a>
  </div>
  <div class="sidebar-body" id="sbBody"></div>
</aside>

<script>
  // -------------------------------------------------------------------
  // REPORT_ID: уникальный префикс localStorage-заметок для ЭТОГО отчёта,
  // чтобы заметки разных отчётов, открытых в одном браузере, не пересекались.
  // Заполняется генератором навыка (team-slug + спринт), например "gds-live-2026q3s6".
  var REPORT_ID = "{{REPORT_ID}}";

  // JIRA_BASE: базовый URL для ссылок вида {JIRA_BASE}/browse/{key}
  var JIRA_BASE = "{{JIRA_BASE_URL}}";

  // EPICS: заполняется генератором навыка (см. resources/data_shape.md).
  // Единица отчёта — ЭПИК. Каждый элемент:
  // {
  //   rowId, epicKey|null, epicTitle,   // epicKey=null -> псевдо-эпик "Без эпика"
  //   stories: [
  //     { key, title, status, category,
  //       subtasks: [ { key, summary, status, category } ] }
  //   ]
  // }
  var EPICS = [
    // {{EPICS_JSON}}
  ];
  // -------------------------------------------------------------------

  function jiraUrl(key) { return JIRA_BASE + '/browse/' + key; }

  function statusClass(category) {
    if (category === 'Выполнено') return 'done';
    if (category === 'В работе') return 'progress';
    return 'backlog';
  }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  var tableBody = document.getElementById('tableBody');
  var epicCountEl = document.getElementById('epicCount');

  function renderTable() {
    epicCountEl.textContent = EPICS.length;
    tableBody.innerHTML = EPICS.map(function (e) {
      var epicCell = e.epicKey
        ? '<a href="' + jiraUrl(e.epicKey) + '" target="_blank" rel="noopener">' + esc(e.epicTitle) + '</a>'
        : '<span class="no-epic">' + esc(e.epicTitle || 'Без эпика') + '</span>';
      return (
        '<tr data-row="' + esc(e.rowId) + '">' +
          '<td class="epic">' + epicCell + '</td>' +
          '<td class="actions"><div class="btn-group">' +
            '<button class="action-btn" data-open="' + esc(e.rowId) + '">Статус историй</button>' +
            '<button class="action-btn" data-note="' + esc(e.rowId) + '">Прогресс</button>' +
          '</div></td>' +
        '</tr>'
      );
    }).join('');

    document.querySelectorAll('[data-open]').forEach(function (btn) {
      btn.addEventListener('click', function () { openStoriesSidebar(btn.dataset.open); });
    });
    document.querySelectorAll('[data-note]').forEach(function (btn) {
      var rowId = btn.dataset.note;
      refreshNoteButton(rowId);
      btn.addEventListener('click', function () {
        var epic = EPICS.find(function (e) { return e.rowId === rowId; });
        if (epic) openNoteSidebar(epic);
      });
    });
  }

  var overlay = document.getElementById('overlay');
  var sidebar = document.getElementById('sidebar');
  var sbKey = document.getElementById('sbKey');
  var sbTitle = document.getElementById('sbTitle');
  var sbLink = document.getElementById('sbLink');
  var sbBody = document.getElementById('sbBody');

  function openStoriesSidebar(rowId) {
    var epic = EPICS.find(function (e) { return e.rowId === rowId; });
    if (!epic) return;
    sbKey.textContent = epic.epicKey || 'Без эпика';
    sbTitle.textContent = epic.epicTitle || 'Без эпика';
    if (epic.epicKey) { sbLink.href = jiraUrl(epic.epicKey); sbLink.style.display = ''; }
    else { sbLink.style.display = 'none'; }

    sbBody.innerHTML = '';
    sbBody.style.display = 'block';
    if (!epic.stories || !epic.stories.length) {
      var empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = 'Историй нет.';
      sbBody.appendChild(empty);
      openPanel();
      return;
    }

    epic.stories.forEach(function (story, idx) {
      var wrap = document.createElement('div');
      wrap.className = 'story-item';

      var hasSubtasks = story.subtasks && story.subtasks.length > 0;
      var subListId = 'sub-' + rowId + '-' + idx;

      var row = document.createElement('div');
      row.className = 'story-row';
      row.innerHTML =
        '<div class="story-title-wrap">' +
          '<button class="story-toggle" ' + (hasSubtasks ? '' : 'disabled') + '>▶</button>' +
          '<a href="' + jiraUrl(story.key) + '" target="_blank" rel="noopener">' + esc(story.key) + ' — ' + esc(story.title) + '</a>' +
        '</div>' +
        '<span class="status ' + statusClass(story.category) + '">' + esc(story.status) + '</span>';
      wrap.appendChild(row);

      var subList = document.createElement('div');
      subList.className = 'sub-list';
      subList.id = subListId;
      if (hasSubtasks) {
        story.subtasks.forEach(function (sub) {
          var subRow = document.createElement('div');
          subRow.className = 'sub-item';
          subRow.innerHTML =
            '<a href="' + jiraUrl(sub.key) + '" target="_blank" rel="noopener">' + esc(sub.key) + ' — ' + esc(sub.summary) + '</a>' +
            '<span class="status ' + statusClass(sub.category) + '">' + esc(sub.status) + '</span>';
          subList.appendChild(subRow);
        });
      }
      wrap.appendChild(subList);

      var toggleBtn = row.querySelector('.story-toggle');
      if (hasSubtasks) {
        toggleBtn.addEventListener('click', function () {
          toggleBtn.classList.toggle('open');
          subList.classList.toggle('open');
        });
      }

      sbBody.appendChild(wrap);
    });

    openPanel();
  }

  function noteStorageKey(rowId) { return 'actual-sprint:' + REPORT_ID + ':note:' + rowId; }

  function openNoteSidebar(epic) {
    sbKey.textContent = epic.epicKey || 'Без эпика';
    sbTitle.textContent = epic.epicTitle || 'Без эпика';
    if (epic.epicKey) { sbLink.href = jiraUrl(epic.epicKey); sbLink.style.display = ''; }
    else { sbLink.style.display = 'none'; }

    sbBody.innerHTML = '';
    sbBody.style.display = 'flex';

    var storageKey = noteStorageKey(epic.rowId);
    var textarea = document.createElement('textarea');
    textarea.className = 'note-area';
    textarea.placeholder = 'Заметка о прогрессе по эпику…';
    textarea.value = localStorage.getItem(storageKey) || '';
    textarea.addEventListener('input', function () {
      localStorage.setItem(storageKey, textarea.value);
      refreshNoteButton(epic.rowId);
    });
    sbBody.appendChild(textarea);

    var hint = document.createElement('div');
    hint.className = 'note-hint';
    hint.textContent = 'Сохраняется автоматически в этом браузере.';
    sbBody.appendChild(hint);

    openPanel();
    textarea.focus();
  }

  function refreshNoteButton(rowId) {
    var btn = document.querySelector('[data-note="' + rowId + '"]');
    if (!btn) return;
    btn.classList.toggle('has-note', !!localStorage.getItem(noteStorageKey(rowId)));
  }

  function openPanel() { overlay.classList.add('open'); sidebar.classList.add('open'); }
  function closeSidebar() { overlay.classList.remove('open'); sidebar.classList.remove('open'); }

  overlay.addEventListener('click', closeSidebar);
  document.getElementById('sidebarClose').addEventListener('click', closeSidebar);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSidebar(); });

  renderTable();
</script>

</body>
</html>
