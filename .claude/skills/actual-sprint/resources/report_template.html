<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Отчёт {{TEAM_NAME}} — {{SPRINT_NAME}}</title>
<style>
  :root {
    --fg: #111;
    --bg: #fff;
    --muted: #666;
    --line: #ddd;
    --accent: #111;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--fg);
    background: var(--bg);
    line-height: 1.5;
  }
  .hero {
    padding: 48px 32px 32px;
    border-bottom: 3px solid var(--fg);
  }
  .hero .team {
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .hero h1 {
    margin: 0 0 12px;
    font-size: 32px;
    font-weight: 700;
  }
  .hero .meta {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    font-size: 14px;
    color: var(--muted);
  }
  .hero .meta strong { color: var(--fg); }

  main { padding: 32px; }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }
  th, td {
    text-align: left;
    padding: 12px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }
  thead th {
    border-bottom: 2px solid var(--fg);
    font-weight: 700;
    white-space: nowrap;
  }
  tbody tr:hover { background: #fafafa; }
  td.epic a { color: var(--fg); text-decoration: none; border-bottom: 1px solid var(--line); font-weight: 600; }
  td.epic a:hover { border-bottom-color: var(--fg); }
  td.epic .no-epic { color: var(--muted); font-weight: 600; }

  /* агрегированная визуализация статусов по всей иерархии эпика */
  td.tally { white-space: nowrap; width: 1%; }
  .tally-row { display: flex; gap: 2px; align-items: stretch; font-variant-numeric: tabular-nums; }
  .tally-cell {
    min-width: 30px;
    padding: 3px 6px;
    text-align: center;
    font-size: 12px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
    background: var(--bg);
  }
  .tally-cell.nonzero { color: var(--fg); border-color: #999; }
  .tally-cell.b-done.nonzero { border-color: #111; background: #111; color: #fff; font-weight: 600; }
  .tally-cell.b-blocked.nonzero { border-color: #111; border-style: dashed; font-weight: 600; }
  .tally-total { margin-left: 8px; font-size: 12px; color: var(--muted); align-self: center; }

  .legend {
    margin: 0 0 16px;
    font-size: 12px;
    color: var(--muted);
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
  }
  .legend b { color: var(--fg); font-weight: 600; }

  td.actions { white-space: nowrap; width: 1%; }
  .action-btn {
    font: inherit;
    font-size: 13px;
    padding: 5px 12px;
    border: 1px solid var(--fg);
    background: var(--bg);
    color: var(--fg);
    border-radius: 4px;
    cursor: pointer;
    white-space: nowrap;
  }
  .action-btn:hover { background: var(--fg); color: var(--bg); }
  .action-btn.has-note { border-color: #111; font-weight: 600; }
  .action-btn.has-note::after { content: " •"; }

  /* сайдбары: два независимых панеля, один стек едет целиком */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
    z-index: 10;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .panel-stack {
    position: fixed;
    top: 0;
    right: 0;
    height: 100%;
    display: flex;
    z-index: 11;
    transform: translateX(100%);
    transition: transform 0.2s ease;
    pointer-events: none;
    max-width: 100vw;
  }
  .panel-stack.open { transform: translateX(0); pointer-events: auto; }

  .sidebar {
    position: relative;
    height: 100%;
    background: var(--bg);
    border-left: 1px solid var(--line);
    box-shadow: -8px 0 24px rgba(0,0,0,0.08);
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #panelProgress { width: 340px; }
  #panelStories { width: 420px; }

  .sidebar-head {
    padding: 20px 20px 16px;
    border-bottom: 1px solid var(--line);
    position: relative;
    flex-shrink: 0;
  }
  .sidebar-head .eyebrow {
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .sidebar-head h2 { margin: 0 0 6px; font-size: 15px; line-height: 1.35; padding-right: 24px; }
  .sidebar-head a { font-size: 13px; color: var(--muted); }

  .sidebar-close {
    position: absolute;
    top: 16px;
    right: 16px;
    border: none;
    background: none;
    font-size: 20px;
    line-height: 1;
    cursor: pointer;
    color: var(--muted);
  }
  .sidebar-close:hover { color: var(--fg); }

  .sidebar-body { padding: 16px 20px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; }

  .note-area {
    flex: 1;
    width: 100%;
    min-height: 200px;
    resize: vertical;
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 12px;
    font: inherit;
    font-size: 13px;
    color: var(--fg);
    line-height: 1.6;
  }
  .note-area:focus { outline: none; border-color: var(--fg); }
  .note-hint { font-size: 12px; color: var(--muted); margin-top: 8px; flex-shrink: 0; }

  /* сводка по бакетам внутри панели историй */
  .panel-tally {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 14px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
    flex-shrink: 0;
  }
  .panel-tally .chip {
    font-size: 12px;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    color: var(--muted);
  }
  .panel-tally .chip.nonzero { color: var(--fg); border-color: #999; }

  /* список историй эпика, с разворотом подзадач */
  .story-item { border-bottom: 1px solid #eee; }
  .story-item:last-child { border-bottom: none; }
  .story-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 10px 0;
    font-size: 13px;
  }
  .story-row .story-title-wrap { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
  .story-toggle {
    flex-shrink: 0;
    border: none;
    background: none;
    cursor: pointer;
    font-size: 11px;
    color: var(--muted);
    padding: 0 4px 0 0;
    width: 14px;
    transform: rotate(0deg);
    transition: transform 0.15s ease;
  }
  .story-toggle.open { transform: rotate(90deg); }
  .story-toggle:disabled { visibility: hidden; }
  .story-row a { color: var(--fg); text-decoration: none; }
  .story-row a:hover { text-decoration: underline; }

  /* базовый бейдж статуса — общий для историй и подзадач */
  .status {
    flex-shrink: 0;
    padding: 2px 8px;
    border: 1px solid var(--line);
    border-radius: 3px;
    font-size: 11px;
    white-space: nowrap;
  }
  .sub-item .status { font-size: 10px; padding: 1px 6px; }
  .status.b-done { border-color: #111; font-weight: 600; }
  .status.b-review, .status.b-testing, .status.b-progress { border-color: #999; }
  .status.b-blocked { border-color: #111; border-style: dashed; }
  .status.b-open { color: var(--muted); }

  .sub-list { display: none; padding: 0 0 10px 20px; }
  .sub-list.open { display: block; }
  .sub-item {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: baseline;
    padding: 6px 0;
    font-size: 12px;
    border-top: 1px dashed #eee;
  }
  .sub-item:first-child { border-top: none; }
  .sub-item a { color: var(--muted); text-decoration: none; }
  .sub-item a:hover { color: var(--fg); text-decoration: underline; }

  .sidebar-empty { color: var(--muted); font-size: 13px; padding: 4px 0; }
</style>
</head>
<body>

<div class="hero">
  <div class="team">Команда</div>
  <h1>{{TEAM_NAME}}</h1>
  <div class="meta">
    <div>Спринт: <strong>{{SPRINT_NAME}}</strong></div>
    <div>Доска: <strong>{{BOARD_NAME}}</strong></div>
    <div>Эпиков в отчёте: <strong id="epicCount">0</strong></div>
  </div>
</div>

<main>
  <div class="legend" id="legend"></div>
  <table>
    <thead>
      <tr>
        <th>Эпик</th>
        <th id="tallyHead">Статусы</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
</main>

<div class="overlay" id="overlay"></div>
<div class="panel-stack" id="panelStack">
  <!-- Сайдбар 1: заметка о прогрессе эпика -->
  <aside class="sidebar" id="panelProgress">
    <div class="sidebar-head">
      <button class="sidebar-close" data-close>&times;</button>
      <div class="eyebrow">Прогресс</div>
      <h2 id="progTitle">—</h2>
      <a id="progLink" href="#" target="_blank" rel="noopener">Открыть в JIRA →</a>
    </div>
    <div class="sidebar-body" id="progBody"></div>
  </aside>

  <!-- Сайдбар 2: истории эпика + их подзадачи -->
  <aside class="sidebar" id="panelStories">
    <div class="sidebar-head">
      <button class="sidebar-close" data-close>&times;</button>
      <div class="eyebrow">Истории</div>
      <h2 id="storiesTitle">—</h2>
      <a id="storiesLink" href="#" target="_blank" rel="noopener">Открыть в JIRA →</a>
    </div>
    <div class="sidebar-body" id="storiesBody"></div>
  </aside>
</div>

<script>
  // -------------------------------------------------------------------
  // REPORT_ID: уникальный префикс localStorage-заметок для ЭТОГО отчёта,
  // чтобы заметки разных отчётов, открытых в одном браузере, не пересекались.
  // Заполняется генератором навыка (team-slug + спринт), например "gds-live-2026q3s6".
  var REPORT_ID = "{{REPORT_ID}}";

  // JIRA_BASE: базовый URL для ссылок вида {JIRA_BASE}/browse/{key}
  var JIRA_BASE = "{{JIRA_BASE_URL}}";

  // EPICS: заполняется генератором навыка (см. resources/data_shape.md).
  // Единица отчёта — ЭПИК. Каждый элемент:
  // {
  //   rowId, epicKey|null, epicTitle,   // epicKey=null -> псевдо-эпик "Без эпика"
  //   stories: [
  //     { key, title, status, category,
  //       subtasks: [ { key, summary, status, category } ] }
  //   ]
  // }
  var EPICS = [
    // {{EPICS_JSON}}
  ];
  // -------------------------------------------------------------------

  // Бакеты статусов. Порядок = порядок вывода в строке эпика.
  var BUCKETS = [
    { id: 'open',     label: 'Открыто',       cls: 'b-open' },
    { id: 'blocked',  label: 'Заблокировано', cls: 'b-blocked' },
    { id: 'progress', label: 'В работе',      cls: 'b-progress' },
    { id: 'testing',  label: 'Тестирование',  cls: 'b-testing' },
    { id: 'review',   label: 'Ревью',         cls: 'b-review' },
    { id: 'done',     label: 'Готово',        cls: 'b-done' }
  ];

  // Маппинг реального статуса JIRA -> бакет (см. resources/status_mapping.md).
  // Порядок проверок важен и выверен регрессией по всем ~330 статусам инстанса.
  var DONE_EXACT = [
    'закрыт', 'закрыта', 'закрыто', 'готово', 'сделано', 'выполнено', 'выполнена',
    'завершено', 'завершена', 'отменен', 'отменён', 'отменена', 'отменено',
    'отклонен', 'отклонён', 'отклонена', 'отклонено', 'решён', 'решен', 'решена'
  ];

  function classifyBucket(status, category) {
    var s = (status || '').trim().toLowerCase();

    // 1. Категория JIRA "Выполнено" — авторитетный и единственный широкий признак готовности.
    //    Подстрочный поиск по имени здесь недопустим: "Аналитика завершена", "Готово к закрытию",
    //    "Ожидает решения КЦ" содержат done-подобные корни, но финальными НЕ являются.
    if (category === 'Выполнено') return 'done';
    if (DONE_EXACT.indexOf(s) !== -1) return 'done';

    // 2. Блокировки и ожидания — раньше остальных: "Ожидает тестирование" это очередь, не тесты.
    if (/блок|ожида|пауза|на паузе|hold|wait|отложен|приостановл/.test(s)) return 'blocked';

    // 3. Тестирование раньше ревью: "Готово к тестированию" — про тесты.
    if (/тест|qa/.test(s)) return 'testing';

    // 4. Ревью / приёмка / согласование.
    if (/ревью|review|проверк|приемк|приёмк|согласован|утвержд/.test(s)) return 'review';

    // 5. Дефолт по категории JIRA.
    if (category === 'К выполнению') return 'open';
    return 'progress';
  }

  function bucketClass(status, category) {
    var id = classifyBucket(status, category);
    for (var i = 0; i < BUCKETS.length; i++) {
      if (BUCKETS[i].id === id) return BUCKETS[i].cls;
    }
    return 'b-open';
  }

  // Агрегация по ВСЕЙ иерархии эпика: каждая история + каждая её подзадача = 1 единица.
  function tallyEpic(epic) {
    var counts = {};
    BUCKETS.forEach(function (b) { counts[b.id] = 0; });

    (epic.stories || []).forEach(function (story) {
      counts[classifyBucket(story.status, story.category)]++;
      (story.subtasks || []).forEach(function (sub) {
        counts[classifyBucket(sub.status, sub.category)]++;
      });
    });

    counts.total = BUCKETS.reduce(function (acc, b) { return acc + counts[b.id]; }, 0);
    return counts;
  }

  function jiraUrl(key) { return JIRA_BASE + '/browse/' + key; }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : s;
    return d.innerHTML;
  }

  var tableBody = document.getElementById('tableBody');
  var epicCountEl = document.getElementById('epicCount');
  var legendEl = document.getElementById('legend');
  var tallyHeadEl = document.getElementById('tallyHead');

  function renderLegend() {
    legendEl.innerHTML = 'Порядок счётчиков: ' + BUCKETS.map(function (b, i) {
      return '<span><b>' + (i + 1) + '</b> ' + esc(b.label) + '</span>';
    }).join(' · ');
    tallyHeadEl.textContent = BUCKETS.map(function (b) { return b.label; }).join(' / ');
  }

  function tallyHtml(counts) {
    var cells = BUCKETS.map(function (b) {
      var n = counts[b.id];
      return '<span class="tally-cell ' + b.cls + (n ? ' nonzero' : '') + '" title="' + esc(b.label) + '">' + n + '</span>';
    }).join('');
    return '<div class="tally-row">' + cells + '<span class="tally-total">из ' + counts.total + '</span></div>';
  }

  function renderTable() {
    renderLegend();
    epicCountEl.textContent = EPICS.length;

    tableBody.innerHTML = EPICS.map(function (e) {
      var epicCell = e.epicKey
        ? '<a href="' + jiraUrl(e.epicKey) + '" target="_blank" rel="noopener">' + esc(e.epicTitle) + '</a>'
        : '<span class="no-epic">' + esc(e.epicTitle || 'Без эпика') + '</span>';
      return (
        '<tr data-row="' + esc(e.rowId) + '">' +
          '<td class="epic">' + epicCell + '</td>' +
          '<td class="tally">' + tallyHtml(tallyEpic(e)) + '</td>' +
          '<td class="actions"><button class="action-btn" data-open="' + esc(e.rowId) + '">Статус</button></td>' +
        '</tr>'
      );
    }).join('');

    document.querySelectorAll('[data-open]').forEach(function (btn) {
      var rowId = btn.dataset.open;
      refreshStatusButton(rowId);
      btn.addEventListener('click', function () { openPanels(rowId); });
    });
  }

  var overlay = document.getElementById('overlay');
  var panelStack = document.getElementById('panelStack');
  var progTitle = document.getElementById('progTitle');
  var progLink = document.getElementById('progLink');
  var progBody = document.getElementById('progBody');
  var storiesTitle = document.getElementById('storiesTitle');
  var storiesLink = document.getElementById('storiesLink');
  var storiesBody = document.getElementById('storiesBody');

  function noteStorageKey(rowId) { return 'actual-sprint:' + REPORT_ID + ':note:' + rowId; }

  function setEpicHead(titleEl, linkEl, epic) {
    titleEl.textContent = epic.epicTitle || 'Без эпика';
    if (epic.epicKey) { linkEl.href = jiraUrl(epic.epicKey); linkEl.style.display = ''; }
    else { linkEl.style.display = 'none'; }
  }

  function fillProgressPanel(epic) {
    setEpicHead(progTitle, progLink, epic);
    progBody.innerHTML = '';

    var storageKey = noteStorageKey(epic.rowId);
    var textarea = document.createElement('textarea');
    textarea.className = 'note-area';
    textarea.placeholder = 'Заметка о прогрессе по эпику…';
    textarea.value = localStorage.getItem(storageKey) || '';
    textarea.addEventListener('input', function () {
      localStorage.setItem(storageKey, textarea.value);
      refreshStatusButton(epic.rowId);
    });
    progBody.appendChild(textarea);

    var hint = document.createElement('div');
    hint.className = 'note-hint';
    hint.textContent = 'Сохраняется автоматически в этом браузере.';
    progBody.appendChild(hint);
  }

  function fillStoriesPanel(epic) {
    setEpicHead(storiesTitle, storiesLink, epic);
    storiesBody.innerHTML = '';

    var counts = tallyEpic(epic);
    var summary = document.createElement('div');
    summary.className = 'panel-tally';
    summary.innerHTML = BUCKETS.map(function (b) {
      var n = counts[b.id];
      return '<span class="chip' + (n ? ' nonzero' : '') + '">' + esc(b.label) + ': ' + n + '</span>';
    }).join('');
    storiesBody.appendChild(summary);

    if (!epic.stories || !epic.stories.length) {
      var empty = document.createElement('div');
      empty.className = 'sidebar-empty';
      empty.textContent = 'Историй нет.';
      storiesBody.appendChild(empty);
      return;
    }

    epic.stories.forEach(function (story) {
      var wrap = document.createElement('div');
      wrap.className = 'story-item';

      var hasSubtasks = story.subtasks && story.subtasks.length > 0;

      var row = document.createElement('div');
      row.className = 'story-row';
      row.innerHTML =
        '<div class="story-title-wrap">' +
          '<button class="story-toggle" ' + (hasSubtasks ? '' : 'disabled') + '>▶</button>' +
          '<a href="' + jiraUrl(story.key) + '" target="_blank" rel="noopener">' + esc(story.key) + ' — ' + esc(story.title) + '</a>' +
        '</div>' +
        '<span class="status ' + bucketClass(story.status, story.category) + '">' + esc(story.status) + '</span>';
      wrap.appendChild(row);

      var subList = document.createElement('div');
      subList.className = 'sub-list';
      if (hasSubtasks) {
        story.subtasks.forEach(function (sub) {
          var subRow = document.createElement('div');
          subRow.className = 'sub-item';
          subRow.innerHTML =
            '<a href="' + jiraUrl(sub.key) + '" target="_blank" rel="noopener">' + esc(sub.key) + ' — ' + esc(sub.summary) + '</a>' +
            '<span class="status ' + bucketClass(sub.status, sub.category) + '">' + esc(sub.status) + '</span>';
          subList.appendChild(subRow);
        });
      }
      wrap.appendChild(subList);

      var toggleBtn = row.querySelector('.story-toggle');
      if (hasSubtasks) {
        toggleBtn.addEventListener('click', function () {
          toggleBtn.classList.toggle('open');
          subList.classList.toggle('open');
        });
      }

      storiesBody.appendChild(wrap);
    });
  }

  function openPanels(rowId) {
    var epic = EPICS.find(function (e) { return e.rowId === rowId; });
    if (!epic) return;

    fillProgressPanel(epic);
    fillStoriesPanel(epic);

    overlay.classList.add('open');
    panelStack.classList.add('open');
  }

  function refreshStatusButton(rowId) {
    var btn = document.querySelector('[data-open="' + rowId + '"]');
    if (!btn) return;
    btn.classList.toggle('has-note', !!localStorage.getItem(noteStorageKey(rowId)));
  }

  function closePanels() {
    overlay.classList.remove('open');
    panelStack.classList.remove('open');
  }

  overlay.addEventListener('click', closePanels);
  document.querySelectorAll('[data-close]').forEach(function (btn) {
    btn.addEventListener('click', closePanels);
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closePanels(); });

  renderTable();
</script>

</body>
</html>
