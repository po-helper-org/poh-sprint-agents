# Раздел «Управление спринтами»: встроенный коннектор к корпоративной JIRA.
#
# Файл едет вместе с пакетом и применяется на любой машине, поэтому путей и
# адресов конкретной установки здесь нет. Всё, что различается от команды к
# команде — адрес JIRA, токен, проект, промт подключения, — задаётся в
# «Настройки → Плагины → Управление спринтами» и живёт в документе настроек
# харнесса, а не в этом файле.
#
# СЕКРЕТАМ ЗДЕСЬ НЕ МЕСТО: файл лежит в репозитории. Если токен нужен вне
# документа настроек, задайте JIRA_TOKEN в окружении процесса харнесса —
# коннектор возьмёт его, когда поле настроек пусто.
#
# Точечная правка значений по идентификатору строки (слой профиля):
#
#   - id: sprint-management
#     config:
#       timeoutMs: 30000
#
- insert:
    - id: sprint-management
      name: dsh-plugin-sprint
      config:
        # Бюджет ожидания одного запроса к JIRA. Корпоративный контур за VPN
        # отвечает медленнее публичного облака — увеличивайте, если ловите таймауты.
        timeoutMs: 15000
        # Бюджет одного вызова инструмента: поиск плюс разовый поход за каталогом полей.
        toolTimeoutMs: 45000
        # Потолок числа задач в одной выдаче: длинный список стоит контекста модели.
        maxIssues: 50
        # Порядок секции системного промта: после персоны и PLAN_POLICY, рядом
        # с блоками подсказок по инструментам (>= 1000).
        promptOrder: 1200
